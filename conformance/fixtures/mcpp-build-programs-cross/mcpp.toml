version     = "0.1.0"
description = "Conformance fixture: build programs compiled with a toolchain of their own (mcpp-community/mcpp#797)"
license     = "Apache-2.0"

[toolchain]
default = "llvm@23.1.3"

[dependencies]
both = { path = "deps/both" }

[build-dependencies]
gen  = { path = "deps/gen" }
