# mcppls.os: the facts mcppls names about the system it runs upon, over mcpplibs.os.
[package]
name        = "mcppls-os"
version     = "0.2.0"
description = "The system mcppls runs upon, in mcppls' own names, over mcpplibs.os"
license     = "Apache-2.0"

[targets.mcppls-os]
kind = "lib"

[dependencies]
os.workspace = true

[lib]
path = "src/os.cppm"
