# The only package that talks to openkal for the program: files, processes, the environment,
# directories, loopback sockets. Everything above it asks here.
[package]
name        = "mcppls-platform"
version     = "0.1.0"
description = "mcppls platform adapters over openkal: fs, process, env, dirs, loopback net, stdio, tool runs"
license     = "Apache-2.0"

[targets.mcppls-platform]
kind = "lib"

[dependencies]
openkal-llvm-runtime.workspace = true
mcppls-base = { path = "../base" }

[dependencies.nlohmann]
json.workspace = true

[dev-dependencies]
mcppls-testing = { path = "../testing" }

[target.'cfg(os = "linux")'.dependencies]
mcppls-os-linux = { path = "../os/linux" }

[target.'cfg(os = "macos")'.dependencies]
mcppls-os-macos = { path = "../os/macos" }

[target.'cfg(windows)'.dependencies]
mcppls-os-windows = { path = "../os/windows" }

# X-6 (plan 2026-10-03): the process identity asks this system's own tables (GetProcessTimes,
# OpenProcess, GetCurrentProcessId -- declared in process.cpp the way openkal-windows declares
# its Win32 set, without a vendor SDK). `winprocess` is this package's own import library for
# those three names, generated from port/winprocess.def by build.mcpp (see there for why it is
# not called kernel32); `kernel32` itself is already on the line through openkal-windows, which
# carries the rest (CloseHandle, GetExitCodeProcess, GetCurrentProcess). The predicate is the
# object ABI (openkal-windows/mcpp.toml explains why `env`).
[target.'cfg(all(windows, not(env = "msvc")))'.build]
ldflags = ["-lwinprocess"]

[lib]
path = "src/platform.cppm"
