[package]
name        = "mcppls-base"
version     = "0.1.0"
description = "mcppls foundations: errors, paths, text, globbing, sha256, URIs, logging, the product version, its directories and payload names, a channel"
license     = "Apache-2.0"

[targets.mcppls-base]
kind = "lib"

[dependencies]
os.workspace = true
openkal-llvm-runtime.workspace = true

[dev-dependencies]
mcppls-testing = { path = "../testing" }

[lib]
path = "src/base.cppm"
