# The conformance fixtures as mtest programs (mcpp-community/mcpp design 2026-11-08, W8). CI's
# conformance job names each as the command `bash .github/scripts/run-fixture.sh <fixture>`, which
# is the program's name; mtest keeps every run (.mtest/), and a second attempt of a job runs only
# the fixtures that failed in the first (`mtest rerun`).
#
# A fixture that states a time -- a deadline, a pause, a measured readiness -- holds `serial:perf`:
# it runs while no other fixture of that resource runs, so that a run of several fixtures at once
# (CONFORMANCE_JOBS) measures nothing but its own work.

[project]
store = ".mtest"

[cases."bash .github/scripts/run-fixture.sh engine-none*"]
resources = ["serial:perf"]

[cases."bash .github/scripts/run-fixture.sh clangd-crash-closure*"]
resources = ["serial:perf"]

