# The CLion build the plugin is compiled against. A plugin built here runs on this build and later
# ones within the same major line; sinceBuild/untilBuild in plugin.xml is what actually gates it.
platformType = CL
platformVersion = 2026.2.3
pluginVersion = 0.0.12
org.gradle.jvmargs = -Xmx2g
# The IDE ships the Kotlin standard library; bundling a second copy in the plugin is what JetBrains
# asks plugins not to do.
kotlin.stdlib.default.dependency = false
