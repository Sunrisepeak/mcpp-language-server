id = "mcppls"
name = "C++ Modules Language Server"
version = "0.0.11"
schema_version = 1
description = "mcppls - C++20/23 named modules that just work: navigation, completion, hover and diagnostics across modules for any compiler"
repository = "https://github.com/Sunrisepeak/mcpp-language-server"
authors = ["Sunrisepeak"]

[lib]
kind = "Rust"
version = "0.7.0"

# Zed already knows the C and C++ languages; this adds a language server for them. Put it before
# clangd in `languages."C++".language_servers` and mcppls drives clangd itself, with the module
# database it built — running both directly would mean two engines over one file.
[language_servers.mcppls]
name = "mcppls"
languages = ["C++", "C"]
