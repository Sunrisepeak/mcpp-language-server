name: Frozen server cold log diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  XLINGS_NON_INTERACTIVE: '1'
  PAYLOAD_CACHE: ${{ github.workspace }}/.payload-cache
  MCPP_SOURCE_REF: ${{ vars.MCPP_SOURCE_REF || '' }}
  MCPP_XLINGS_OVERRIDE_XIM_NODE: path:node
  MCPP_XLINGS_OVERRIDE_XIM_RUST: path:cargo

jobs:
  cold:
    name: frozen cold ${{ matrix.fixture }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        fixture: [ux-mcpp, ux-xlings]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Bounded inode capture controls
        run: python3 .github/scripts/test_capture_rotating_logs.py
      - uses: ./.github/actions/setup-mcpp
      - name: GCC 16, the original fixture toolchain
        run: mcpp toolchain install gcc 16.1.0
      - name: The mcpp the mcpp fixture asks for
        if: matrix.fixture == 'ux-mcpp'
        run: |
          set -euo pipefail
          xlings install mcpp@2026.9.21.1 -y -g
          xlings use mcpp "$MCPP_VERSION"
          mcpp --version
      - name: Exact original payload, test tools and kit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir frozen-parts
          for id in 13330133429 13329316378 13329549834; do
            gh api "repos/Sunrisepeak/mcpp-language-server/actions/artifacts/$id" > "frozen-parts/$id.json"
            gh api "repos/Sunrisepeak/mcpp-language-server/actions/artifacts/$id/zip" > "frozen-parts/$id.zip"
          done
          python3 - <<'CHECK'
          import hashlib, json, stat, zipfile
          from pathlib import Path
          parts = [
              (13330133429, 'payload', '2f5f3c08f924f8a143b14d484f54f9bef20e928fa214db75f853ef31f01504f6', '.'),
              (13329316378, 'stage-linux-x64', '1853b5500764a56f76fe0e9d02c3066b641092c75022f773be3a7d7cddf43211', '.'),
              (13329549834, 'kit-linux-x64', '1308a58bd6baa43e20a0b186125bf2cd156e79837543971d47bb9998c03e742c', 'kit-archive')]
          for identity, name, digest, folder in parts:
              part = json.load(open(f'frozen-parts/{identity}.json'))
              archive = Path(f'frozen-parts/{identity}.zip')
              assert part['id'] == identity and part['name'] == name and not part['expired']
              assert part['workflow_run']['id'] == 41839033098
              assert part['workflow_run']['head_sha'] == '5bdeddb3ae1f993f4ee75eef1cd6f17798cc33bb'
              assert part['digest'] == 'sha256:' + digest
              assert archive.stat().st_size == part['size_in_bytes']
              assert hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest() == digest
              root = Path(folder).resolve()
              with zipfile.ZipFile(archive) as z:
                  assert z.testzip() is None
                  for entry in z.infolist():
                      assert (root / entry.filename).resolve().is_relative_to(root)
                      assert not stat.S_ISLNK(entry.external_attr >> 16)
                  z.extractall(root)
          CHECK
          tar -xzf payload.tar.gz
          tar -xzf stage-linux-x64.tar.gz
          archive=$(ls kit-archive/mcppls-kit-*.tar.gz)
          name=$(basename "$archive" .tar.gz)
          version=${name##*-}; target=${name%-*}; target=${target#mcppls-kit-}
          store="$HOME/.xlings/data/xpkgs/xim-x-mcppls-kit-$target/$version"
          mkdir -p "$store"
          tar -xzf "$archive" -C "$store" --strip-components 1
          test -f "$store/kit.json"
      - name: Original cold stage with pinned log inodes
        run: |
          set -euo pipefail
          nproc
          cat /proc/loadavg
          mkdir -p "$RUNNER_TEMP/ux-results" "$RUNNER_TEMP/ux-work"
          python3 .github/scripts/capture_rotating_logs.py \
            --cache-dir "$RUNNER_TEMP/ux-work/cache-a" \
            --output "$RUNNER_TEMP/ux-results/cold-log-history" -- \
            stage/mcppls-conformance run --server payload/bin/mcppls.okb --payload payload \
            --fixture conformance/fixtures/${{ matrix.fixture }} \
            --workspace-dir "$RUNNER_TEMP/ux-work/workspace" --cache-dir "$RUNNER_TEMP/ux-work/cache-a" \
            --stage cold --timeout 900 --measure "$RUNNER_TEMP/ux-results/${{ matrix.fixture }}-cold.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frozen-cold-${{ matrix.fixture }}
          path: |
            ${{ runner.temp }}/ux-results
            frozen-parts/*.json
            ${{ runner.temp }}/ux-work/workspace/mcpp.lock
          retention-days: 7
