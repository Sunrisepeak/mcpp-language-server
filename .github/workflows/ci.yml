name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

# The caller's name is part of the group on purpose. `github.workflow` is the CALLING workflow's
# name inside a `workflow_call`, so Release's copy of these jobs groups as `ci-Release-<ref>` and a
# push-triggered run as `ci-CI-<ref>`. Without that they share one group on `main` and, with
# cancel-in-progress, the release's own verification and the merge's CI cancel each other —
# whichever started second wins, and a release that lost is a release with nothing verified.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The build pins live in .github/versions.env and are exported by .github/actions/setup-mcpp,
  # so a bump lands in one file instead of three. A job may still set one to override it.
  XLINGS_NON_INTERACTIVE: '1'
  PAYLOAD_CACHE: ${{ github.workspace }}/.payload-cache

jobs:
  # ---------------------------------------------------------------------------
  # The specifications' schemas, examples and the fixtures' simulated producer data (docs/specs/tools/validate.py).
  # The one Python this repository keeps (docs/93-devtools.md "What is not C++"): JSON Schema 2020-12
  # validation, which no C++ package in the mcpp index provides yet.
  specifications:
    name: specifications
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Schemas, examples, text blocks and links
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/specs"
          "$RUNNER_TEMP/specs/bin/pip" install --quiet 'jsonschema>=4.18'
          "$RUNNER_TEMP/specs/bin/python" docs/specs/tools/validate.py | grep -v '^PASS'

  # ---------------------------------------------------------------------------
  # Unit tests on each host, and every executable starts. `--workspace` reaches every member:
  # modules/base, platform and pack, tools/devtools, and tools/model-gateway, whose tests run the
  # gateway against a mock provider (tools/model-gateway/README.md "Tests") -- so the gateway is
  # built and tested on each host's openkal target here, with no job of its own.
  build-test:
    name: build and unit tests (${{ matrix.os }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Each host's dev and release profiles side by side: the two share no build, so one
        # machine running them in turn only added their times.
        include:
          - { os: ubuntu-24.04, target: '', profile: dev }
          - { os: ubuntu-24.04, target: '', profile: release }
          # A macOS host resolves the Apple-native triple by default; openkal's
          # macOS implementation is reached through aarch64-macos.
          - { os: macos-14, target: '--target aarch64-macos', profile: dev }
          - { os: macos-14, target: '--target aarch64-macos', profile: release }
          # A Windows host defaults to the MSVC target; openkal's Windows
          # implementation is reached through the GNU target.
          - { os: windows-2022, target: '--target x86_64-windows-gnu', profile: dev }
          - { os: windows-2022, target: '--target x86_64-windows-gnu', profile: release }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mcpp
      - name: Build
        if: matrix.profile == 'dev'
        run: |
          mcpp build ${{ matrix.target }}
          mcpp build -p devtools ${{ matrix.target }}
      - name: Executables run
        if: matrix.profile == 'dev'
        run: |
          set -euo pipefail
          for exe in mcppls mcppls-conformance mcppls-lspgen mcppls-devtools; do
            path=$(find target tools/devtools/target -type f \( -name "$exe" -o -name "$exe.exe" \) -path '*/bin/*' | head -1)
            echo "$exe -> $path"
            if [ "$exe" = mcppls-devtools ]; then "$path" --help > /dev/null; else "$path" version; fi
          done
      - name: Unit tests
        if: matrix.profile == 'dev'
        run: |
          mcpp test ${{ matrix.target }}
          mcpp test --workspace ${{ matrix.target }}
      # The payloads ship release builds, and every release-only defect found so
      # far (design 12.9, K7 and K13) was invisible to the dev profile.
      - name: Unit tests (release)
        if: matrix.profile == 'release'
        run: |
          mcpp test --profile release ${{ matrix.target }}
          mcpp test --workspace --profile release ${{ matrix.target }}
      # The repository's invariants (docs/93-devtools.md): versions agree everywhere, the platform
      # surface is six constants, members depend only downward and nothing but devtools reaches
      # packaging, no script outside the allowlist -- and the server's own symbol table carries no
      # archive or TLS code, which is the one of these a green build cannot show.
      - name: Repository invariants
        if: runner.os == 'Linux' && matrix.profile == 'dev'
        run: |
          set -euo pipefail
          devtools=$(find tools/devtools/target -type f -name mcppls-devtools -path '*/bin/*' | head -1)
          server=$(find target -type f -name mcppls -path '*/bin/*' | head -1)
          "$devtools" check all
          "$devtools" check binary --server "$server"
      - name: Generated protocol is fresh
        if: runner.os == 'Linux' && matrix.profile == 'dev'
        run: |
          mcpp run mcppls-lspgen -- generate --meta-model vendor/lsp-metamodel/metaModel-3.18.json --out src/lsp
          git diff --exit-code src/lsp

  # ---------------------------------------------------------------------------
  # One Linux host builds the server for every platform (design 12.4, usable plan W11):
  # the release executables built here are the ones the Windows, macOS and Linux arm64
  # payloads carry, so conformance, clean-machine and end-to-end jobs test what was
  # cross-built. On the arm64 runners these are also the tools: mcpp is not installed there.
  cross-build:
    name: cross-build from Linux (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-windows-gnu, exe: '.exe' }
          - { target: aarch64-macos,      exe: '' }
          - { target: aarch64-linux-musl, exe: '' }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mcpp
      - name: Build for ${{ matrix.target }}
        run: |
          mcpp build --profile release --target ${{ matrix.target }}
          mcpp build -p devtools --profile release --target ${{ matrix.target }}
      - name: Artifacts have the expected format
        run: |
          set -euo pipefail
          mkdir -p cross
          for exe in mcppls mcppls-conformance mcppls-lspgen mcppls-mock-mcpp mcppls-mock-model mcppls-devtools; do
            path=$(find target tools/devtools/target -type f -name "$exe${{ matrix.exe }}" -path '*/bin/*' -newer mcpp.toml | head -1)
            file "$path"
            case "${{ matrix.target }}" in
              *windows*) file "$path" | grep -q 'PE32+ executable' ;;
              *macos*)   file "$path" | grep -q 'Mach-O 64-bit arm64' ;;
              *linux*)   file "$path" | grep -q 'ELF 64-bit LSB executable, ARM aarch64' ;;
            esac
            cp "$path" cross/
          done
          (cd cross && sha256sum * | tee SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: cross-${{ matrix.target }}
          path: cross
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Payloads: the server, trimmed clangd 23.1 and the mcppls-kit (design 15.2).
  # linux-x64 and win32-x64 are assembled on Linux; darwin-arm64 needs a macOS host
  # for lipo and the libc++ configure; linux-arm64 an arm64 Linux host, whose dpkg has
  # the aarch64 C headers the kit carries. The Windows, macOS and Linux arm64
  # executables come from the cross-build job, unchanged (W11). `cross-tools` marks a
  # runner with no mcpp, where the cross-built devtools does the packaging.
  payload:
    name: payload (${{ matrix.platform }})
    needs: cross-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64,    os: ubuntu-24.04,     cross: '',                   exe: '' }
          - { platform: linux-arm64,  os: ubuntu-24.04-arm, cross: aarch64-linux-musl,   exe: '', cross-tools: true }
          - { platform: win32-x64,    os: ubuntu-24.04,     cross: x86_64-windows-gnu,   exe: '.exe' }
          - { platform: darwin-arm64, os: macos-14,         cross: aarch64-macos,        exe: '' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mcpp
        if: '!matrix.cross-tools'
      - name: Build tools for the kit configure
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q && sudo apt-get install -y -q ninja-build libc6-dev linux-libc-dev
            command -v cmake > /dev/null || sudo apt-get install -y -q cmake
          fi
          if [ "$RUNNER_OS" = macOS ]; then brew install ninja; fi
          cmake --version | head -1; ninja --version
      - name: Cache upstream inputs
        uses: actions/cache@v6
        with:
          path: .payload-cache
          key: payload-inputs-${{ matrix.platform }}-${{ hashFiles('packaging/payload.lock.json') }}
      # Release builds: openkal-llvm-runtime 0.9.6 carries the fixes for the two
      # release-only defects beneath the server (design 12.9, K7 and K13).
      - name: Build the server
        if: matrix.cross == ''
        run: |
          set -euo pipefail
          mcpp build --profile release
          mcpp build -p devtools --profile release
          mkdir -p cross
          for exe in mcppls mcppls-conformance mcppls-mock-mcpp mcppls-mock-model mcppls-devtools; do
            cp "$(find target tools/devtools/target -type f -name "$exe" -path '*/bin/*' -newer mcpp.toml | head -1)" cross/
          done
      - name: The cross-built server
        if: matrix.cross != ''
        uses: actions/download-artifact@v8
        with:
          name: cross-${{ matrix.cross }}
          path: cross
      # The packaging tool has to run on THIS host. On macOS and arm64 Linux that is the
      # cross-built one; a Linux runner assembling the Windows payload builds its own (the
      # cross-built one is a .exe).
      - name: The packaging tool for this host
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ] && [ -n '${{ matrix.cross }}' ] && [ -z '${{ matrix.cross-tools }}' ]; then
            mcpp build -p devtools --profile release
            cp "$(find tools/devtools/target -type f -name mcppls-devtools -path '*/bin/*' -newer mcpp.toml | head -1)" host-devtools
          else
            cp cross/mcppls-devtools host-devtools
          fi
          chmod +x host-devtools cross/*
      # Fetch, trim clangd, build the semantic kit, assemble and verify: one command, the one a
      # developer runs (docs/93-devtools.md), with the cross-built server named.
      - name: Assemble
        run: |
          set -euo pipefail
          server="cross/mcppls${{ matrix.exe }}"
          runner="cross/mcppls-conformance${{ matrix.exe }}"
          mock="cross/mcppls-mock-mcpp${{ matrix.exe }}"
          mockModel="cross/mcppls-mock-model${{ matrix.exe }}"
          packer="cross/mcppls-devtools${{ matrix.exe }}"
          ./host-devtools payload --platform ${{ matrix.platform }} --server "$server" --out payload --cache "$PAYLOAD_CACHE"
          ./host-devtools payload --verify payload --json > "$RUNNER_TEMP/verify.json"
          cat "$RUNNER_TEMP/verify.json"
          if [ -f cross/SHA256SUMS ]; then
            # The payload carries the cross-built executable byte for byte.
            want=$(grep " mcppls${{ matrix.exe }}\$" cross/SHA256SUMS | cut -d' ' -f1)
            got=$(grep -o '"sha256": *"[0-9a-f]*"' "$RUNNER_TEMP/verify.json" | head -1 | grep -o '[0-9a-f]\{64\}')
            echo "cross-built $want, payload $got"
            [ "$want" = "$got" ]
          fi
          mkdir -p stage && cp "$runner" "$mock" "$mockModel" "$packer" stage/
          # A tarball keeps executable bits and links, which an artifact zip does not.
          tar -czf payload-${{ matrix.platform }}.tar.gz payload stage
          du -sh payload payload-${{ matrix.platform }}.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: payload-${{ matrix.platform }}
          path: payload-${{ matrix.platform }}.tar.gz
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The specifications' executable part, against real toolchains (conformance/README.md).
  conformance:
    name: conformance (${{ matrix.platform }}${{ matrix.part && format(', {0}', matrix.part) || '' }})
    needs: payload
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux and Windows run their fixtures in two parts side by side, balanced on measured
          # times. `extras` marks the part that also runs the job's other checks (review fixtures,
          # startup timing, the cached model, a linked workspace), which need running only once.
          - platform: linux-x64
            part: 1 of 2
            os: ubuntu-24.04
            fixtures: mcpp-split mcpp-all-cppm verify-changes mingw mcpp-split-gcc mcpp-watch multi-root mcpp-llvm mcpp-watch@polling mcpp-emit s1-two-sets compdb-lto-msvc failure-at-base@vscode generated-module-negotiated typing-import typing-import-spin workaround-canaries
          - platform: linux-x64
            part: 2 of 2
            os: ubuntu-24.04
            extras: true
            fixtures: inferred inferred-bom engine-none module-faults untrusted mcpp-gcc mcpp-gcc@plain mcpp-emit-package-std mcpp-emit-broken mcpp-emit-unavailable mcpp-emit-hang mcpp-emit-needs-download mcpp-emit-watch mcpp-emit-watch@polling cmake-clang cmake-clang-bdb watch-polling payload-corrupt clangd-cannot-load generated-module generated-module@vscode generated-module-old-mcpp generated-module-old-mcpp@neovim module-faults@zed failure-at-base failure-at-base@neovim
          # generated-module{,-old-mcpp,-negotiated}'s mcpp-mock.json bakes in a POSIX driver path
          # (${env:HOME}/.mcpp/registry/..., no {exe}); it resolves the same way here as on Linux, so
          # these run on macOS but are left off win32-x64 below rather than fixed unverified.
          - platform: darwin-arm64
            os: macos-14
            extras: true
            fixtures: inferred inferred-bom engine-none module-faults untrusted mcpp-llvm mcpp-split mcpp-all-cppm verify-changes mcpp-watch multi-root failure-at-base clangd-cannot-load failure-at-base@zed generated-module generated-module-old-mcpp generated-module-negotiated typing-import typing-import-spin workaround-canaries
          # No mcpp on the arm64 runner (its tools are the cross-built ones), so the fixtures that
          # need no build tool and no compiler of their own: the semantic kit, clangd and the server
          # on aarch64, with module faults, a corrupt payload and polling included.
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            cross-tools: true
            fixtures: inferred inferred-bom engine-none module-faults untrusted payload-corrupt clangd-cannot-load failure-at-base watch-polling typing-import typing-import-spin workaround-canaries
          - platform: win32-x64
            part: 1 of 2
            os: windows-2022
            fixtures: mcpp-split mcpp-all-cppm verify-changes mcpp-split-msvc cmake-msvc-std compdb-clangxx-msvc-std multi-root compdb-clang-cl-std mcpp-llvm-msvc failure-at-base@vscode typing-import typing-import-spin workaround-canaries
          - platform: win32-x64
            part: 2 of 2
            os: windows-2022
            extras: true
            fixtures: inferred inferred-bom engine-none module-faults mcpp-emit-hang inferred-msvc untrusted mingw cmake-msvc cmake-msvc-bdb cmake-clangxx-msvc cmake-clang-cl mcpp-msvc mcpp-watch failure-at-base clangd-cannot-load
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mcpp
        if: '!matrix.cross-tools'
      - name: Toolchains the fixtures build with
        run: |
          set -euo pipefail
          case " ${{ matrix.fixtures }} " in *" mcpp-gcc "*|*" mcpp-split-gcc "*|*" mingw "*) mcpp toolchain install gcc 16.1.0 ;; esac
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -q && sudo apt-get install -y -q ninja-build; fi
      # usable plan W3, closing the loop with mcpp itself: what `mcpp emit build-database` prints for
      # each of this host's mcpp fixtures, against the S1 and S2 schemas, S1's semantic rules and the
      # contract of mcpp-community/mcpp#636 (docs/specs/tools/validate.py). The fixtures below then have the
      # server consume the same answers. A fixture with mcpp-mock.json simulates mcpp and is skipped.
      - name: mcpp's own build databases against the specifications
        if: '!matrix.cross-tools'
        env:
          PYTHONUTF8: '1'
        run: |
          set -euo pipefail
          temp="$RUNNER_TEMP"; python=python3
          if [ "$RUNNER_OS" = Windows ]; then temp=$(cygpath -u "$RUNNER_TEMP"); python=python; fi
          "$python" -m venv "$temp/specs"
          venv="$temp/specs/bin/python"; [ "$RUNNER_OS" = Windows ] && venv="$temp/specs/Scripts/python.exe"
          "$venv" -m pip install --quiet --disable-pip-version-check 'jsonschema>=4.18'
          envelopes=()
          for fixture in ${{ matrix.fixtures }}; do
            fixture=${fixture%@*}
            case "$fixture" in mcpp-*) ;; *) continue ;; esac
            source="conformance/fixtures/$fixture"
            [ -f "$source/mcpp.toml" ] && [ ! -f "$source/mcpp-mock.json" ] || continue
            [ -e "$temp/mcpp-emit/$fixture.json" ] && continue
            mkdir -p "$temp/mcpp-emit" && cp -R "$source" "$temp/mcpp-emit/$fixture"
            (cd "$temp/mcpp-emit/$fixture" && mcpp emit build-database --format json > "$temp/mcpp-emit/$fixture.json")
            envelopes+=("$temp/mcpp-emit/$fixture.json")
          done
          "$venv" docs/specs/tools/validate.py ${envelopes[@]+"${envelopes[@]}"} | grep -v '^PASS'
      # cmake-clang-bdb and cmake-msvc-bdb need CMake's build-database export,
      # which only merges correctly from CMake 4.4 on (usable plan W4, E16);
      # these hosts' own CMake is the 3.31.6 the runner images ship, so a
      # matching official build is installed just for those two fixtures.
      # It is deliberately NOT put first on PATH for the whole job: CMake
      # rotates its experimental-feature UUIDs on its own schedule, and
      # cmake-msvc-std already pins 3.31.6's CMAKE_EXPERIMENTAL_CXX_IMPORT_STD
      # UUID as its default, which differs under 4.4 (E1/E7-E11); each
      # bdb fixture gets CMake 4.4.2 individually below instead.
      - name: Cache CMake 4.4.2 (cmake-clang-bdb, cmake-msvc-bdb)
        if: matrix.platform == 'linux-x64' || matrix.platform == 'win32-x64'
        id: cmake-bdb-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/cmake-4.4.2
          key: cmake-bdb-4.4.2-${{ runner.os }}
      - name: Install CMake 4.4.2
        if: (matrix.platform == 'linux-x64' || matrix.platform == 'win32-x64') && steps.cmake-bdb-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cmake-4.4.2"
          if [ "$RUNNER_OS" = Linux ]; then
            curl -sfL https://github.com/Kitware/CMake/releases/download/v4.4.2/cmake-4.4.2-linux-x86_64.tar.gz -o "$RUNNER_TEMP/cmake-4.4.2.tar.gz"
            tar -xzf "$RUNNER_TEMP/cmake-4.4.2.tar.gz" -C "$RUNNER_TEMP/cmake-4.4.2" --strip-components 1
          else
            curl -sfL https://github.com/Kitware/CMake/releases/download/v4.4.2/cmake-4.4.2-windows-x86_64.zip -o "$RUNNER_TEMP/cmake-4.4.2.zip"
            # A bash step, so $RUNNER_TEMP (bash-expanded below) rather than
            # pwsh's own $env:RUNNER_TEMP, which bash would try to expand itself.
            pwsh -NoProfile -Command "Expand-Archive -Path '$RUNNER_TEMP/cmake-4.4.2.zip' -DestinationPath '$RUNNER_TEMP/cmake-4.4.2-zip' -Force"
            mv "$RUNNER_TEMP"/cmake-4.4.2-zip/cmake-4.4.2-windows-x86_64/* "$RUNNER_TEMP/cmake-4.4.2/"
          fi
      - name: CMake 4.4.2 is there and reports its version
        if: matrix.platform == 'linux-x64' || matrix.platform == 'win32-x64'
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then "$RUNNER_TEMP/cmake-4.4.2/bin/cmake.exe" --version; else "$RUNNER_TEMP/cmake-4.4.2/bin/cmake" --version; fi
      # The MSVC fixtures build inside a developer environment; the server under test
      # runs without one, as it does when an editor starts it (usable plan D30).
      - name: The MSVC developer environment, for the fixtures' own builds
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Set-Content -Path "$env:RUNNER_TEMP\capture-msvc.cmd" -Value "@call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul`r`n@set"
          cmd /d /c "$env:RUNNER_TEMP\capture-msvc.cmd" | Out-File -Encoding utf8 "$env:RUNNER_TEMP\msvc.env"
          Select-String -Path "$env:RUNNER_TEMP\msvc.env" -Pattern '^(VCToolsInstallDir|WindowsSDKVersion)='
          # A second snapshot, only for cmake-msvc-bdb and cmake-clang-cl: the same developer
          # environment with CMake 4.4.2 first on PATH, so that fixture's own
          # prepare steps use it while every other MSVC fixture keeps using
          # the runner's own CMake untouched.
          $env:PATH = "$env:RUNNER_TEMP\cmake-4.4.2\bin;$env:PATH"
          cmd /d /c "$env:RUNNER_TEMP\capture-msvc.cmd" | Out-File -Encoding utf8 "$env:RUNNER_TEMP\msvc-bdb.env"
      - uses: actions/download-artifact@v8
        with:
          name: payload-${{ matrix.platform }}
      - name: Unpack the payload
        run: tar -xzf payload-${{ matrix.platform }}.tar.gz && ls payload stage
      - name: Run the fixtures
        env:
          CONFORMANCE_CLANGXX: ${{ runner.os == 'Linux' && !matrix.cross-tools && '~/.mcpp/registry/data/xpkgs/xim-x-llvm/22.1.8/bin/clang++' || '' }}
        run: |
          set -euo pipefail
          export CONFORMANCE_CLANGXX="${CONFORMANCE_CLANGXX/#\~/$HOME}"
          exe=''; extra=()
          if [ "$RUNNER_OS" = Windows ]; then exe='.exe'; extra=(--msvc-env "$RUNNER_TEMP/msvc.env"); fi
          # cmake-clang-bdb and cmake-msvc-bdb are the only fixtures that need
          # CMake 4.4.2 (see the steps above): a PATH prefix for the former, a
          # developer environment captured with it first on PATH for the
          # latter, so every other fixture keeps using the runner's own CMake.
          run_fixture() {
            local fixture="$1"; shift
            local path_prefix=''
            local -a fixture_extra=(${extra[@]+"${extra[@]}"})
            case "$fixture" in
              cmake-clang-bdb) path_prefix="$RUNNER_TEMP/cmake-4.4.2/bin:" ;;
              cmake-msvc-bdb|cmake-clang-cl) fixture_extra=(--msvc-env "$RUNNER_TEMP/msvc-bdb.env") ;;
              # usable plan W9.3: the fallback runs only when the client never declares
              # didChangeWatchedFiles.dynamicRegistration. NAME@polling runs fixture NAME that way.
              watch-polling|*@polling) fixture_extra+=(--no-dynamic-watch) ;;
              # Cold-start plan 4.1: NAME@plain runs fixture NAME as a client that declares no
              # `experimental.cxxModules` — which is every editor but this repository's own VS Code
              # extension. It asserts standard `$/progress` still arrives. Nothing covered that,
              # which is how progress came to be sent only to the one client that already had it.
              *@plain) fixture_extra+=(--plain-client) ;;
              # Real-project plan RP0: NAME@vscode/@neovim/@zed
              # run fixture NAME with the capabilities that editor actually sends
              # (conformance/README.md "Client profiles").
              *@vscode) fixture_extra+=(--client vscode) ;;
              *@neovim) fixture_extra+=(--client neovim) ;;
              *@zed) fixture_extra+=(--client zed) ;;
            esac
            PATH="$path_prefix$PATH" "stage/mcppls-conformance$exe" run --server "payload/bin/mcppls$exe" --payload payload \
                ${fixture_extra[@]+"${fixture_extra[@]}"} --fixture "conformance/fixtures/${fixture%@*}" "$@"
          }
          failed=''
          for fixture in ${{ matrix.fixtures }}; do
            echo "::group::$fixture"
            if ! run_fixture "$fixture" --timeout 180; then
              failed="$failed $fixture"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::failed fixtures:$failed"
            # Rerun the first failure with the server's log, for the record.
            first=${failed# }; first=${first%% *}
            run_fixture "$first" --timeout 60 --verbose 2>&1 | tail -200 || true
            exit 1
          fi

      # The review of changes (overall design 7.4, 10.3, work item RV5): every tools/bench/review fixture's change
      # reviewed by the payload's server; a missing finding or one a fixture rules out fails the job, and
      # the precision and recall of each rule are printed.
      - name: Review fixtures
        if: matrix.extras
        run: |
          set -euo pipefail
          exe=''; [ "$RUNNER_OS" = Windows ] && exe='.exe'
          "stage/mcppls-devtools$exe" bench review --server "payload/bin/mcppls$exe" --payload payload --mock-model "stage/mcppls-mock-model$exe" \
              --report "$RUNNER_TEMP/review-${{ matrix.platform }}.json"

      # Startup timing (usable plan W7): the timing fixture cold, then warm with the same
      # workspace and cache. A warm start must reuse the std module the cold one built
      # (SC4). Only severe regressions fail here; nightly.yml records the medians. The
      # budgets hold on every host: first runs measured cold 6.2, 4.5 and 8.7 s and warm
      # 1.8, 1.9 and 3.5 s on Linux, macOS and Windows runners.
      # Build description design 4.1: the second session plans with the model the first one cached,
      # before the producer has said anything, and only then confirms it. The check reads which of
      # the two the session started from, so "it felt fast" is not the evidence.
      - name: The cached model is what the next session starts from
        if: matrix.extras && runner.os == 'Linux'
        run: |
          set -euo pipefail
          cached="$RUNNER_TEMP/cached"
          rm -rf "$cached"
          start() {
            stage/mcppls-conformance run --server payload/bin/mcppls --payload payload \
                --fixture conformance/fixtures/mcpp-emit --workspace-dir "$cached/workspace" \
                --cache-dir "$cached/cache" --timeout 180 "$@"
          }
          start
          start --expect-warm

      - name: Cold and warm start
        if: matrix.extras
        run: |
          set -euo pipefail
          exe=''; [ "$RUNNER_OS" = Windows ] && exe='.exe'
          timing="$RUNNER_TEMP/timing"
          rm -rf "$timing"
          start() {
            "stage/mcppls-conformance$exe" run --server "payload/bin/mcppls$exe" --payload payload --fixture conformance/fixtures/timing \
                --workspace-dir "$timing/workspace" --cache-dir "$timing/cache" --timeout 120 "$@"
          }
          start --measure "$timing/cold.json" --navigation-budget 15
          start --measure "$timing/warm.json" --navigation-budget 5 --expect-warm
          cat "$timing/cold.json" "$timing/warm.json"
      - uses: actions/upload-artifact@v7
        if: always() && matrix.extras
        with:
          name: timing-${{ matrix.platform }}
          path: ${{ runner.temp }}/timing/*.json
          if-no-files-found: ignore

      # A workspace reached through a symbolic link, which is where every macOS
      # temporary directory is (/var is /private/var): mcpp names files by their
      # resolved path, and an unsaved edit must still reach the modules that
      # import it (check C7).
      - name: A workspace reached through a symbolic link
        if: matrix.extras && runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/real"
          ln -sfn "$RUNNER_TEMP/real" "$RUNNER_TEMP/link"
          TMPDIR="$RUNNER_TEMP/link" stage/mcppls-conformance run --server payload/bin/mcppls --payload payload \
              --fixture conformance/fixtures/mcpp-llvm --timeout 180

  # ---------------------------------------------------------------------------
  # Clean machines (usable plan W5, design 20.2): no compiler, no Visual Studio, no
  # Command Line Tools. Linux runs in a bare container; the Windows and macOS images
  # cannot be emptied, so their toolchains are hidden and asserted invisible first.
  # The conformance fixture and the packaged extension's end-to-end suite both run there.
  clean-machine:
    name: clean machine (${{ matrix.platform }})
    needs: payload
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64,    os: ubuntu-24.04, exe: '' }
          - { platform: win32-x64,    os: windows-2022, exe: '.exe' }
          - { platform: darwin-arm64, os: macos-14,     exe: '' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: payload-${{ matrix.platform }}
      - name: Unpack the payload
        run: tar -xzf payload-${{ matrix.platform }}.tar.gz
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Package the extension, as the other end-to-end jobs do
        run: |
          set -euo pipefail
          stage/mcppls-devtools${{ matrix.exe }} extension --editor vscode \
              --payload "$PWD/payload" --out "$RUNNER_TEMP/mcpp-language-server.vsix"
      - name: A container without a compiler
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/w" -w /w ubuntu:24.04 bash -c '
            set -euo pipefail
            for tool in c++ g++ gcc cc clang++ clang; do
              if command -v "$tool"; then echo "::error::$tool is on PATH"; exit 1; fi
            done
            stage/mcppls-conformance run --server payload/bin/mcppls --payload payload \
                --fixture conformance/fixtures/inferred-discover --timeout 180'
      - name: The extension in the same kind of container
        if: runner.os == 'Linux'
        timeout-minutes: 40
        run: |
          # Each phase is timed and bounded, so a stall names itself: this step sat silent for the
          # whole job timeout twice, in package configuration. Non-interactive: libgtk-3-0's
          # dependencies would otherwise ask. PKGSYSTEM_ENABLE_FSYNC=0: shared-mime-info's
          # update-mime-database syncs every file it writes, which on a container's overlay file
          # system can take longer than the job; dpkg's own syncs are skipped the same way.
          docker run --rm -e DEBIAN_FRONTEND=noninteractive -e PKGSYSTEM_ENABLE_FSYNC=0 -v "$PWD:/w" -v "$RUNNER_TEMP:/t" -w /w/editors/vscode \
              node:22-bookworm-slim bash -c '
            set -euo pipefail
            phase() { echo "[$(date +%T)] $*"; }
            phase "apt-get update"
            timeout -k 30s 5m apt-get update -qq
            phase "apt-get install"
            if ! timeout -k 30s 15m apt-get install -y -q --no-install-recommends -o Dpkg::Use-Pty=0 -o Dpkg::Options::=--force-unsafe-io \
                xvfb xauth ca-certificates libnss3 libatk1.0-0 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2 libxss1 libxkbfile1 \
                libsecret-1-0 > /t/apt.log 2>&1; then
              tail -60 /t/apt.log; echo "::error::the packages the extension host needs did not install"; exit 1
            fi
            phase "no compiler on PATH"
            for tool in c++ g++ gcc cc clang++ clang; do
              if command -v "$tool"; then echo "::error::$tool is on PATH"; exit 1; fi
            done
            phase "npm test"
            MCPPLS_E2E_VSIX=/t/mcpp-language-server.vsix timeout -k 30s 20m xvfb-run -a npm test
            phase "done"'
      - name: Visual Studio hidden and no compiler on PATH
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          NODE_PATH_FOR_E2E="$(command -v node)"
          mv "/c/Program Files (x86)/Microsoft Visual Studio/Installer" "/c/Program Files (x86)/Microsoft Visual Studio/Installer.hidden"
          export PATH="/c/Windows/system32:/c/Windows:/c/Windows/System32/Wbem:/usr/bin"
          for tool in vswhere cl clang-cl clang++ g++ c++ gcc; do
            if command -v "$tool"; then echo "::error::$tool is still visible"; exit 1; fi
          done
          stage/mcppls-conformance.exe run --server payload/bin/mcppls.exe --payload payload \
              --fixture conformance/fixtures/inferred-discover --timeout 180
          # The packaged extension with the same machine view; node stays reachable for the test runner.
          # Git's /usr/bin goes first: npm starts through `env bash`, and System32's bash.exe is WSL's.
          export PATH="/usr/bin:$(dirname "$NODE_PATH_FOR_E2E"):/c/Windows/system32:/c/Windows:/c/Windows/System32/Wbem"
          cd editors/vscode && MCPPLS_E2E_VSIX="$RUNNER_TEMP/mcpp-language-server.vsix" npm test

      # U7: the kit needs the macOS SDK, which is gone with the Command Line Tools. The server
      # degrades with the install command and runs no developer-tool shim; the extension asks
      # once and not again after a restart.
      - name: Command Line Tools and Xcode hidden
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          sudo mv /Library/Developer/CommandLineTools /Library/Developer/CommandLineTools.hidden
          for app in /Applications/Xcode*.app; do sudo mv "$app" "${app%.app}.hidden"; done
          sudo xcode-select --reset || true
          if [ -e /Library/Developer/CommandLineTools ] || compgen -G "/Applications/Xcode*.app" > /dev/null; then
            echo "::error::developer tools are still visible"; exit 1
          fi
          stage/mcppls-conformance run --server payload/bin/mcppls --payload payload \
              --fixture conformance/fixtures/inferred-no-sdk --timeout 120
          cd editors/vscode
          MCPPLS_E2E_VSIX="$RUNNER_TEMP/mcpp-language-server.vsix" MCPPLS_E2E_ONLY=sdk-missing.test.js MCPPLS_E2E_EXPECT_SDK_MISSING=1 npm test

  # ---------------------------------------------------------------------------
  # VS Code → extension → mcppls → clangd, and the platform VSIX (design 16).
  vscode-e2e:
    name: VS Code end to end (${{ matrix.platform }})
    needs: payload
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64,    os: ubuntu-24.04,     exe: '' }
          - { platform: linux-arm64,  os: ubuntu-24.04-arm, exe: '' }
          - { platform: darwin-arm64, os: macos-14,         exe: '' }
          - { platform: win32-x64,    os: windows-2022,     exe: '.exe' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # The arm64 image is not the x64 one: the display server and the libraries VS Code's
      # Electron loads are installed rather than assumed.
      - name: What VS Code needs on arm64 Linux
        if: matrix.platform == 'linux-arm64'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb xauth libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 \
              libgtk-3-0t64 libgbm1 libasound2t64 libxss1 libxkbfile1 libsecret-1-0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: payload-${{ matrix.platform }}
      # One tool does what a developer does locally (docs/00-install.md): put the payload in, build
      # the extension, package it. Packaged first (W6.3): the suites below test the installed VSIX,
      # not the development folder, so the package has to exist before they run.
      - name: Build and package the extension
        run: |
          set -euo pipefail
          tar -xzf payload-${{ matrix.platform }}.tar.gz
          stage/mcppls-devtools${{ matrix.exe }} extension --editor vscode \
              --payload "$PWD/payload" --out "$PWD/editors/vscode/mcppls-${{ matrix.platform }}.vsix"
      # The extension's own logic that needs no VS Code (src/serverLog.ts), in plain Node: a
      # regression there reads here in seconds, before the end-to-end suites.
      - name: Unit tests
        working-directory: editors/vscode
        run: npm run test:unit
      - name: End-to-end tests (VSIX form)
        working-directory: editors/vscode
        env:
          MCPPLS_E2E_VSIX: ${{ github.workspace }}/editors/vscode/mcppls-${{ matrix.platform }}.vsix
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm test; else npm test; fi
      # Conflicting-extension detection (W6.4/U10): a separate scenario, its
      # own pair of stub extensions, and its own workspace-unchanged
      # allowance for .vscode/settings.json (see test/runTest.ts).
      - name: End-to-end tests (conflicts scenario)
        working-directory: editors/vscode
        env:
          MCPPLS_E2E_VSIX: ${{ github.workspace }}/editors/vscode/mcppls-${{ matrix.platform }}.vsix
          MCPPLS_E2E_SCENARIO: conflicts
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm test; else npm test; fi
      # Seeded random use through VS Code's own provider commands (real-project plan RP0): every
      # request answered, none past its budget, p90 within five seconds.
      - name: End-to-end tests (stress scenario)
        working-directory: editors/vscode
        env:
          MCPPLS_E2E_VSIX: ${{ github.workspace }}/editors/vscode/mcppls-${{ matrix.platform }}.vsix
          MCPPLS_E2E_SCENARIO: stress
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm test; else npm test; fi
      - uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ matrix.platform }}
          path: editors/vscode/mcppls-${{ matrix.platform }}.vsix
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The Neovim plugin (editors/nvim) through Neovim's own LSP client, on each host's payload and on
  # the oldest and newest Neovim it supports: require('mcppls').setup() on every version, and
  # vim.lsp.enable('mcppls') (lsp/mcppls.lua) from 0.11 on. Neovim comes from xlings like every
  # other tool here (`nvim` in xim-pkgindex), each version installed and selected with `xlings use`.
  neovim:
    name: Neovim (${{ matrix.platform }})
    needs: payload
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64,    os: ubuntu-24.04, versions: 0.10.4 0.11.5 0.12.5 }
          - { platform: darwin-arm64, os: macos-14,     versions: 0.10.4 0.12.5 }
          - { platform: win32-x64,    os: windows-2022, versions: 0.10.4 0.12.5 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mcpp
      - uses: actions/download-artifact@v8
        with:
          name: payload-${{ matrix.platform }}
      - name: Unpack the payload
        run: tar -xzf payload-${{ matrix.platform }}.tar.gz
      - name: Neovim from xlings
        run: |
          set -euo pipefail
          for version in ${{ matrix.versions }}; do
            for attempt in 1 2 3; do
              if xlings install "nvim@$version" -y -g; then break; fi
              [ "$attempt" = 3 ] && { echo "::error::nvim@$version could not be installed"; exit 1; }
              sleep 30
            done
          done
      - name: The plugin on each Neovim
        run: |
          set -euo pipefail
          server="$PWD/payload/bin/mcppls"; [ "$RUNNER_OS" = Windows ] && server="$(cygpath -w "$PWD/payload/bin/mcppls.exe")"
          failed=''
          for version in ${{ matrix.versions }}; do
            xlings use nvim "$version"
            nvim --version | head -1
            # No `timeout` wrapper: macOS has none, and every wait in smoke.lua is bounded already.
            for mode in setup enable; do
              echo "::group::Neovim $version, $mode"
              if ! MCPPLS_SERVER="$server" nvim --headless --clean -l editors/nvim/tests/smoke.lua "$mode"; then
                failed="$failed $version:$mode"
              fi
              echo "::endgroup::"
            done
          done
          if [ -n "$failed" ]; then echo "::error::failed:$failed"; exit 1; fi

  # ---------------------------------------------------------------------------
  # The agent task benchmark's baseline/reference pairs (tools/bench/README.md, design
  # §10.2, work item A2): no agent and no API key, just `mcpp build`/`mcpp test`
  # (and a declarative content check) against each task's baseline project copy,
  # expected to fail at least one check, and its reference-patched copy,
  # expected to pass every check.
  bench-validate:
    name: bench-validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mcpp
      - name: GCC toolchain (two of the ten tasks pin gcc@16.1.0)
        run: mcpp toolchain install gcc 16.1.0
      - name: Validate every task's baseline/reference pair
        run: mcpp run -p devtools -- bench tasks validate

  # ---------------------------------------------------------------------------
  # A pull request that changes release packaging is checked the way a release is: after every job
  # above has passed, release-checks.yml runs on this run's own payloads and VSIX files. It used to
  # be prerelease.yml on its own trigger, which ran all of CI a second time for the same commit.
  # The paths are the ones that decide what a release builds, stages or checks.
  packaging-changes:
    name: does the pull request change release packaging
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.files.outputs.changed }}
    steps:
      # The merge commit and its first parent, the base it merges into: their difference is what
      # the pull request changes, with no API call and no permission beyond reading the repository.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: files
        run: |
          set -euo pipefail
          changed=false
          while read -r file; do
            case "$file" in
              .github/workflows/release.yml|.github/workflows/prerelease.yml|.github/workflows/release-checks.yml|\
              packaging/release.manifest.json|packaging/payload.lock.json|editors/zed/*|editors/clion/*|\
              tools/devtools/src/editors.*|tools/devtools/src/packaging.*|tools/devtools/src/release.*)
                echo "release packaging: $file"; changed=true ;;
            esac
          done < <(git diff --name-only HEAD^1 HEAD)
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  release-checks:
    name: release checks
    needs: [packaging-changes, specifications, build-test, cross-build, payload, conformance, clean-machine, vscode-e2e, neovim, bench-validate]
    if: needs.packaging-changes.outputs.changed == 'true'
    uses: ./.github/workflows/release-checks.yml
