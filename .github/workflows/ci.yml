name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mcpp_ref:
        description: "A branch of mcpp-community/mcpp to build and test with (empty: .github/versions.env's MCPP_SOURCE_REF, else the released mcpp)"
        required: false
        default: ''
      native:
        description: "Also build and test the native server of every platform (it is not distributed)"
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      mcpp_ref:
        description: "A branch of mcpp-community/mcpp to build and test with (empty: .github/versions.env's)"
        type: string
        required: false
        default: ''
      native:
        description: "Also build and test the native server of every platform (it is not distributed)"
        type: boolean
        required: false
        default: false

# The caller's name is part of the group on purpose. `github.workflow` is the CALLING workflow's
# name inside a `workflow_call`, so Release's copy of these jobs groups as `ci-Release-<ref>` and a
# push-triggered run as `ci-CI-<ref>`. Without that they share one group on `main` and, with
# cancel-in-progress, the release's own verification and the merge's CI cancel each other —
# whichever started second wins, and a release that lost is a release with nothing verified.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The build pins live in .github/versions.env and are exported by .github/actions/setup-mcpp,
  # so a bump lands in one file instead of three. A job may still set one to override it.
  XLINGS_NON_INTERACTIVE: '1'
  PAYLOAD_CACHE: ${{ github.workspace }}/.payload-cache
  # A branch of mcpp under review: a dispatch's `mcpp_ref`, else the repository variable, else versions.env's
  # MCPP_SOURCE_REF (setup-mcpp reads it when this is empty).
  MCPP_SOURCE_REF: ${{ inputs.mcpp_ref || vars.MCPP_SOURCE_REF || '' }}
  # The tools mcpp.toml's [xlings.workspace] declares for packaging (`when = "dev"`: Node for the VS Code
  # extension, Rust for Zed) are the runner's in this workflow (mcpp's `MCPP_XLINGS_OVERRIDE_<NS>_<NAME>`):
  # no job here packages through `mcpp run -p devtools -- extension` -- the ones that run npm set Node up
  # -- yet every `mcpp build` and `mcpp pack` at the root provisioned both, and the download of Node
  # stalled past xlings' deadline on job after job (2026-10-28). release-checks' plugins job, a workflow
  # of its own, still provisions them: that is what it shows.
  MCPP_XLINGS_OVERRIDE_XIM_NODE: path:node
  MCPP_XLINGS_OVERRIDE_XIM_RUST: path:cargo

jobs:
  # ---------------------------------------------------------------------------
  # WHAT THE CHANGE REACHES (docs/92-release.md "Versions"; .github/components.tsv). A pull request runs
  # the jobs of the components it changes: the server's change runs everything, a plugin's runs that
  # plugin's jobs, the documentation's its checks. A push, a dispatch, a release or a pull request from
  # or into a release branch runs everything. A plugin's jobs test it over the payload of the server it
  # is changed against: the payload main built from the same server inputs (`digest`), lent by that
  # run (`lend`, its artifacts kept 7 days); when there is none, the server is built as well.
  changes:
    name: what the change reaches
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      server: ${{ steps.classify.outputs.server }}
      vscode: ${{ steps.classify.outputs.vscode }}
      clion: ${{ steps.classify.outputs.clion }}
      zed: ${{ steps.classify.outputs.zed }}
      nvim: ${{ steps.classify.outputs.nvim }}
      agents: ${{ steps.classify.outputs.agents }}
      zed_real: ${{ steps.classify.outputs.zed_real }}
      packaging: ${{ steps.classify.outputs.packaging }}
      digest: ${{ steps.classify.outputs.digest }}
      lend: ${{ steps.classify.outputs.lend }}
    steps:
      # The merge commit and its first parent, the base it merges into: their difference is what the pull
      # request changes, with no API call.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: The classification's own cases
        run: bash .github/scripts/test_changes.sh
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/changed.txt"
          if [ "$EVENT" = pull_request ]; then git diff --name-only HEAD^1 HEAD > "$changed"; else : > "$changed"; fi
          bash .github/scripts/changes.sh "$changed" > "$RUNNER_TEMP/reached.txt"
          cat "$RUNNER_TEMP/reached.txt"
          get() { sed -n "s/^$1=//p" "$RUNNER_TEMP/reached.txt"; }
          lend=""
          if [ "$(get server)" = false ]; then
            plugins=false
            for c in vscode clion zed nvim agents; do [ "$(get "$c")" = true ] && plugins=true; done
            if [ "$plugins" = true ]; then
              # The newest main run that built the payload from these server inputs, still within its artifacts' days.
              lend=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=server-digest-$(get digest)&per_page=20" \
                       --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")][0].workflow_run.id // ""')
              if [ -z "$lend" ]; then
                echo "no main run lends the payload of these server inputs: the server is built as well"
                sed -i 's/^\(server\|vscode\|clion\|zed\|nvim\|agents\)=.*/\1=true/' "$RUNNER_TEMP/reached.txt"
              else
                echo "the payload of run $lend, built from the same server inputs"
              fi
            fi
          fi
          cat "$RUNNER_TEMP/reached.txt" >> "$GITHUB_OUTPUT"
          echo "lend=$lend" >> "$GITHUB_OUTPUT"

  # The repository's invariants (docs/93-devtools.md) when the server is not built: the build job checks
  # them where it builds devtools anyway.
  invariants:
    name: repository invariants
    needs: changes
    if: needs.changes.outputs.server != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mcpp
      - run: |
          set -euo pipefail
          mcpp build -p devtools
          devtools=$(find target -type f -name mcppls-devtools -path '*/bin/*' | head -1)
          "$devtools" check all

  # ---------------------------------------------------------------------------
  # The specifications' schemas, examples and the fixtures' simulated producer data (docs/specs/tools/validate.py).
  # The one Python this repository keeps (docs/93-devtools.md "What is not C++"): JSON Schema 2020-12
  # validation, which no C++ package in the mcpp index provides yet.
  specifications:
    name: specifications
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Schemas, examples, text blocks and links
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/specs"
          "$RUNNER_TEMP/specs/bin/pip" install --quiet 'jsonschema>=4.18'
          "$RUNNER_TEMP/specs/bin/python" docs/specs/tools/validate.py | grep -v '^PASS'
      - name: Every action a workflow names resolves
        shell: bash
        run: python3 .github/scripts/check-action-refs.py

  # The server and its tests can compile while a candidate engine finishes. Only
  # payload assembly waits: every part and its provenance must be ready first.
  engine-candidate-parts:
    name: engine candidate parts
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
      - name: Candidate admission controls
        run: python3 .github/scripts/test_wait_engine_candidate.py
      - name: Complete, verified candidate parts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -f packaging/engine-candidate.json ] || exit 0
          python3 .github/scripts/wait-engine-candidate.py \
            --candidate packaging/engine-candidate.json \
            --output "$RUNNER_TEMP/engine-candidate-admission.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: engine-candidate-admission
          path: ${{ runner.temp }}/engine-candidate-admission.json
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The mcpp every job builds with, on each system: the pinned release, or a branch of mcpp under review
  # (MCPP_SOURCE_REF). Each consumer also calls setup-mcpp and restores its own compiler cache.
  # Keep these per-host warmers independent: a queued host must not serialize other hosts' builds.
  mcpp:
    name: mcpp (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mcpp
      - run: mcpp --version

  # ---------------------------------------------------------------------------
  # BUILT ONCE, ON LINUX (ecosystem design 2026-10-29 §3.4): every platform's server program, tools and unit
  # tests are built here, the tests written as archives (`mcpp test --no-run --archive`, mcpp SPEC-015 §4) that
  # the `test` job runs on the platform's own system. The release rows also give the platform's test tools
  # (stage/: the conformance runner and its cases, the mocks, devtools) that every later job of that platform runs. The
  # targets are packaging/payload.lock.json's `server-target`s; `mcppls-devtools check platforms` holds this
  # matrix to them. `--workspace` cannot write an archive, so each package with tests writes its own.
  build:
    name: build (${{ matrix.platform }}, ${{ matrix.profile }})
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Every platform's release row builds its test tools (stage/), which every later job of the platform
      # runs against the okb; the dev rows, and the native server's tests outside Linux x64, are a run's that
      # asks for `native` (the server is distributed only as the ok image). The release rows are the base;
      # the Linux x64 dev row is added by its own include, which merges into the base when `native` adds
      # every dev row.
      matrix:
        platform:
          - linux-x64
          - linux-arm64
          - darwin-arm64
          - win32-x64
        profile: ${{ inputs.native && fromJSON('["dev","release"]') || fromJSON('["release"]') }}
        include:
          - { platform: linux-x64,    target: x86_64-linux-gnu,   exe: '' }
          - { platform: linux-arm64,  target: aarch64-linux-musl, exe: '' }
          - { platform: darwin-arm64, target: aarch64-macos,      exe: '' }
          - { platform: win32-x64,    target: x86_64-windows-gnu, exe: '.exe' }
          - { platform: linux-x64,    target: x86_64-linux-gnu,   exe: '', profile: dev }
    env:
      # Whether this row builds its native server's tests for the `test` job.
      NATIVE_TESTS: ${{ (inputs.native || matrix.platform == 'linux-x64') && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mcpp
      - name: Build the server, its tools and devtools for ${{ matrix.target }}
        run: |
          set -euo pipefail
          mcpp build --profile ${{ matrix.profile }} --target ${{ matrix.target }}
          mcpp build -p devtools --profile ${{ matrix.profile }} --target ${{ matrix.target }}
          mcpp build -p mcppls-cts --profile ${{ matrix.profile }} --target ${{ matrix.target }}
          mcpp build -p mcppls-bench --profile ${{ matrix.profile }} --target ${{ matrix.target }}
      - name: The executables are programs of ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p stage
          for exe in mcppls mcppls-conformance mcppls-cts mcppls-bench mcppls-lspgen mcppls-mock-mcpp mcppls-mock-model mcppls-devtools; do
            path=$(find target/${{ matrix.target }} -type f -name "$exe${{ matrix.exe }}" -path '*/bin/*' | head -1)
            [ -n "$path" ] || { echo "::error::no $exe was built"; exit 1; }
            file "$path"
            case "${{ matrix.target }}" in
              *windows*)      file "$path" | grep -q 'PE32+ executable' ;;
              *macos*)        file "$path" | grep -q 'Mach-O 64-bit arm64' ;;
              aarch64-linux*) file "$path" | grep -q 'ELF 64-bit LSB .*ARM aarch64' ;;
              x86_64-linux*)  file "$path" | grep -q 'ELF 64-bit LSB .*x86-64' ;;
            esac
            case "$exe" in mcppls|mcppls-lspgen) ;; *) cp "$path" stage/ ;; esac
          done
          (cd stage && sha256sum * | tee SHA256SUMS)
      # Reuse this native build for early CLion runtime regression. It must not
      # wait for candidate engine admission or rebuild LLVM for an adapter test.
      - name: The current native Linux server
        if: matrix.platform == 'linux-x64' && matrix.profile == 'release'
        run: |
          set -euo pipefail
          mkdir -p native-server
          server=$(find target/${{ matrix.target }} -type f -name mcppls -path '*/bin/*' -print -quit)
          test -n "$server"
          cp "$server" native-server/mcppls
          native-server/mcppls version
          (cd native-server && sha256sum mcppls > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        if: matrix.platform == 'linux-x64' && matrix.profile == 'release'
        with:
          name: native-server-linux-x64
          path: native-server
          if-no-files-found: error
          retention-days: 7
      - name: The tests, built once and archived
        if: env.NATIVE_TESTS == 'yes' && (matrix.platform != 'win32-x64' || matrix.profile != 'dev')
        run: |
          set -euo pipefail
          mkdir -p test-archives
          common=(--profile ${{ matrix.profile }} --target ${{ matrix.target }} --no-run)
          # The server's own tests, then each member's that has tests. The server's dev tests with their debug
          # information are more than 4 GiB, one gzip member since mcpp 2026.10.30.1.
          echo "::group::mcppls"
          mcpp test "${common[@]}" --archive test-archives/mcppls.tar.gz
          echo "::endgroup::"
          for package in pack devtools model-gateway harness; do
            echo "::group::$package"
            mcpp test -p "$package" "${common[@]}" --archive "test-archives/$package.tar.gz"
            echo "::endgroup::"
          done
          ls -l test-archives
      - name: The Windows dev tests, archived before reclaiming their executable space
        if: env.NATIVE_TESTS == 'yes' && matrix.platform == 'win32-x64' && matrix.profile == 'dev'
        env:
          ARCHIVE_TARGET: ${{ matrix.target }}
          ARCHIVE_PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          # Keep every dev test and its debug information. Bounded raw groups
          # become one verified container per package before native execution.
          python3 .github/scripts/test_archive_tests.py
          python3 .github/scripts/archive-tests.py \
            --target "$ARCHIVE_TARGET" --profile "$ARCHIVE_PROFILE"
      # The repository's invariants (docs/93-devtools.md): versions agree everywhere, the platform
      # surface is six constants, members depend only downward and nothing but devtools reaches
      # packaging, no script outside the allowlist -- and the server's own symbol table carries no
      # archive or TLS code, which is the one of these a green build cannot show.
      - name: Repository invariants
        if: matrix.platform == 'linux-x64' && matrix.profile == 'dev'
        run: |
          set -euo pipefail
          devtools=$(find target -type f -name mcppls-devtools -path '*/bin/*' | head -1)
          server=$(find target -type f -name mcppls -path '*/bin/*' | head -1)
          "$devtools" check all
          "$devtools" check binary --server "$server"
      - name: Generated protocol is fresh
        if: matrix.platform == 'linux-x64' && matrix.profile == 'dev'
        run: |
          mcpp run mcppls-lspgen -- generate --meta-model vendor/lsp-metamodel/metaModel-3.18.json --out src/lsp
          git diff --exit-code src/lsp
      - uses: actions/upload-artifact@v7
        if: env.NATIVE_TESTS == 'yes'
        with:
          name: tests-${{ matrix.platform }}-${{ matrix.profile }}
          path: test-archives
          compression-level: 0
          retention-days: 7
      # A tarball keeps executable bits, which an artifact zip does not.
      - name: The test tools of ${{ matrix.platform }}
        if: matrix.profile == 'release'
        run: tar -czf stage-${{ matrix.platform }}.tar.gz stage
      - uses: actions/upload-artifact@v7
        if: matrix.profile == 'release'
        with:
          name: stage-${{ matrix.platform }}
          path: stage-${{ matrix.platform }}.tar.gz
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The unit tests, on each platform's own system, from the archives `build` wrote: the bytes built once
  # on Linux, run where they will run (mcpp SPEC-015 §4). The payloads ship release builds, and every
  # release-only defect found so far (design 12.9, K7 and K13) was invisible to the dev profile.
  test:
    name: unit tests (${{ matrix.platform }}, ${{ matrix.profile }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64,    os: ubuntu-24.04,     profile: dev }
          - { platform: linux-x64,    os: ubuntu-24.04,     profile: release }
          - { platform: linux-arm64,  os: ubuntu-24.04-arm, profile: dev }
          - { platform: linux-arm64,  os: ubuntu-24.04-arm, profile: release }
          - { platform: darwin-arm64, os: macos-15,         profile: dev }
          - { platform: darwin-arm64, os: macos-15,         profile: release }
          - { platform: win32-x64,    os: windows-2022,     profile: dev }
          - { platform: win32-x64,    os: windows-2022,     profile: release }
    # The native server is not distributed: its tests run on the other systems only in a run that asks for
    # `native`, and a row of another system does nothing otherwise. The okb is tested on every system by
    # `openkal-test` and the jobs that take the payload.
    env:
      NATIVE_ROW: ${{ (inputs.native || matrix.platform == 'linux-x64') && 'yes' || 'no' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        if: env.NATIVE_ROW == 'yes'
      - uses: ./.github/actions/setup-mcpp
        if: env.NATIVE_ROW == 'yes'
      - uses: actions/download-artifact@v8
        if: env.NATIVE_ROW == 'yes'
        with:
          name: tests-${{ matrix.platform }}-${{ matrix.profile }}
          path: test-archives
      - name: Run the archived tests
        if: env.NATIVE_ROW == 'yes'
        run: |
          set -euo pipefail
          failed=''
          for archive in test-archives/*.tar.gz; do
            echo "::group::$archive"
            # The released mcpp can leave a long Windows test path behind when
            # it removes this extraction directory. Use the host's filesystem
            # implementation before the next archive; every test still runs.
            # Windows may briefly retain an executable after its test exits.
            # Retry sharing violations only, within a fixed cleanup budget.
            python - <<'PYCODE'
          from pathlib import Path
          import shutil
          import time
          extraction = Path('target/.test-archive/run')
          deadline = time.monotonic() + 10
          while extraction.exists():
              try:
                  shutil.rmtree(extraction)
              except OSError as error:
                  if getattr(error, 'winerror', None) not in (32, 33) or time.monotonic() >= deadline:
                      raise
                  time.sleep(0.1)
          PYCODE
            if ! mcpp test --archive "$archive"; then failed="$failed $(basename "$archive" .tar.gz)"; fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::failed:$failed"; exit 1; fi
      - uses: ./.github/actions/test-report
        if: always() && env.NATIVE_ROW == 'yes'
        with:
          name: mtest-unit-${{ matrix.platform }}-${{ matrix.profile }}

  # ---------------------------------------------------------------------------
  # THE SERVER'S UNIT TESTS AS USERS RUN IT: the ok images `server` built, on each platform's own system through its
  # runner, the leg of the system's architecture (mcpp SPEC-015 §4). The distributed server is the okb; these are
  # its tests in the same form, and the native `test` rows are the tools' and the native build's.
  openkal-test:
    name: unit tests (${{ matrix.platform }}, openkal)
    needs: server
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64,    os: ubuntu-24.04 }
          - { platform: linux-arm64,  os: ubuntu-24.04-arm }
          - { platform: darwin-arm64, os: macos-15 }
          - { platform: win32-x64,    os: windows-2022 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mcpp
      - uses: actions/download-artifact@v8
        with:
          name: tests-openkal
          path: test-archives
      - name: Run the archived tests through this system's runner
        run: mcpp test --archive test-archives/mcppls.tar.gz
      - uses: ./.github/actions/test-report
        if: always()
        with:
          name: mtest-unit-${{ matrix.platform }}-openkal

  # THE UNIT TESTS OF EVERY SYSTEM AS ONE REPORT: each job's runs, taken into one store, reported together
  # (`mtest ci report`, the workflow run's group): the summary, the failures, the slowest cases and the
  # critical path of each run.
  unit-test-report:
    name: unit tests (report)
    needs: [test, openkal-test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/mtest
      - uses: actions/download-artifact@v8
        with:
          pattern: mtest-unit-*
          path: ${{ runner.temp }}/stores
      - name: Every job's runs, reported together
        run: |
          set -euo pipefail
          found=0
          for store in "$RUNNER_TEMP"/stores/*/; do
            [ -f "$store/index.ndjson" ] || continue
            "$MTEST" store import --from "$store"
            found=1
          done
          if [ "$found" = 0 ]; then echo "no job kept a run of the unit tests" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          "$MTEST" ci report --out "$RUNNER_TEMP/unit-tests.md"

  # ---------------------------------------------------------------------------
  # THE HOST GRAPH ON THE PLATFORM (mcpp SPEC-013 §6): with `--host-platform openkal-platform@0.24.0`
  # every build program of the graph -- openkal-platform's and openkal-musl's build.mcpp -- compiles as
  # an ok image of this machine's architecture, with one toolchain on each system, and runs through the
  # platform's runner. The server and the tools built over them are the same programs, and start.
  host-platform:
    name: build programs as images (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: '' }
          - { os: macos-15,     target: '--target aarch64-macos' }
          - { os: windows-2022, target: '--target x86_64-windows-gnu' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mcpp
      - name: Build with the host graph's platform
        run: |
          set -euo pipefail
          mcpp build --host-platform openkal-platform@0.24.0 ${{ matrix.target }} 2>&1 | tee build.log
          grep -q 'Host platform openkal-platform 0.24.0 (--host-platform): build programs are [a-z0-9_]*-openkal images run by okrun' build.log
          mcpp build -p devtools --host-platform openkal-platform@0.24.0 ${{ matrix.target }}
          for exe in mcppls mcppls-devtools; do
            path=$(find target -type f \( -name "$exe" -o -name "$exe.exe" \) -path '*/bin/*' -newer mcpp.toml | head -1)
            echo "$exe -> $path"
            if [ "$exe" = mcppls-devtools ]; then "$path" --help > /dev/null; else "$path" version; fi
          done

  # ---------------------------------------------------------------------------
  # THE SERVER OF EVERY SYSTEM AND ARCHITECTURE (mcpp SPEC-014 2.0 §4.2–§4.4; ecosystem design 2026-10-29 §9):
  # `mcpp pack --target openkal` packs the `openkal` set -- x86_64-openkal and aarch64-openkal -- as one tree:
  # both images under `lib/<arch>/`, the POSIX launcher `bin/mcppls` and the Windows launcher program
  # `bin/mcppls.exe`, and with `--mode self-contained --systems all` the platform's runner of every system it
  # builds one for under `libexec/okrun/<system>-<arch>/`; its mcpp-package.json says where it runs by itself
  # (`runs_on.self`). One build writes the tree's zip and the okb every payload carries (`--pkg-format
  # zip,okb`); the single files cover every leg and system (`--pkg-format single-file --systems all`).
  server:
    name: the server (one tree, one okb, the single files)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mcpp
      - name: Pack the tree and the okb
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version *= *"\(.*\)"$/\1/p' mcpp.toml | head -1)
          mcpp pack --profile release --target openkal --mode self-contained --systems all --pkg-format zip,okb \
              -o "$PWD/packed/" --message-format json > pack.json
          jq '.data | {pkgFormats, legs, systems, runsOn, artifacts}' pack.json
          mkdir -p server
          for artifact in $(jq -r '.data.artifacts[].path' pack.json); do
            case "$artifact" in
              *.okb) cp "$artifact" "server/mcppls-$version.okb" ;;
              *.zip) cp "$artifact" "server/mcppls-$version-openkal.zip" ;;
            esac
          done
          ls -l server
          test -f "server/mcppls-$version.okb" && test -f "server/mcppls-$version-openkal.zip"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      # Where it runs by itself is every platform of packaging/payload.lock.json, and the tree is what it says.
      - name: The tree runs on every system it carries a runner for
        run: |
          set -euo pipefail
          python3 - "server/mcppls-$VERSION-openkal.zip" <<'PY'
          import hashlib, json, sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          top = z.namelist()[0].split("/")[0]
          d = json.loads(z.read(f"{top}/mcpp-package.json"))
          self_ = d["runs_on"]["self"]
          assert self_ == ["linux-aarch64", "linux-x86_64", "macos-aarch64", "windows-x86_64"], self_
          assert sorted(d["legs"]) == ["aarch64-openkal", "x86_64-openkal"], d["legs"]
          names = set(z.namelist())
          for launcher in ("bin/mcppls", "bin/mcppls.exe"):
              assert f"{top}/{launcher}" in names, launcher
          assert f"{top}/bin/mcppls.cmd" not in names, "no .cmd launcher"
          for system in self_:
              runner = f"{top}/libexec/okrun/{system}/okrun" + (".exe" if system.startswith("windows") else "")
              assert runner in names, runner
          for f in d["files"]:
              assert hashlib.sha256(z.read(f"{top}/{f['path']}")).hexdigest() == f["sha256"], f["path"]
          print(top, "runs on", self_, "with okrun", d["runs_on"].get("with"), len(d["files"]), "files")
          PY
          mkdir -p tree && python3 -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "server/mcppls-$VERSION-openkal.zip" tree
          top=$(ls -d tree/*/)
          chmod +x "$top/bin/mcppls" "$top"/libexec/okrun/*/okrun
          env -i HOME="$HOME" PATH=/usr/bin:/bin "$top/bin/mcppls" version | tee version.txt
          grep -q '^mcppls ' version.txt
          echo "TREE=$top" >> "$GITHUB_ENV"
      - name: The images carry no archive or TLS code
        run: |
          set -euo pipefail
          mcpp build -p devtools
          devtools=$(find target -type f -name mcppls-devtools -path '*/bin/*' | head -1)
          for arch in x86_64 aarch64; do "$devtools" check binary --server "$TREE/lib/$arch/mcppls.oke"; done
      # One okb of both architectures (openkal-platform's `okb` format; okb v1 is openkal-image's): what the payload,
      # and so every editor's plugin, carries as its server. Its images are the tree's, stored as they are.
      - name: The okb
        run: |
          set -euo pipefail
          mcpp toolchain install --target x86_64-openkal
          tools=$(mcpp self env --target x86_64-openkal --format json | jq -c '.data.tools')
          okld=$(jq -r .okld <<< "$tools"); okrun=$(jq -r .okrun <<< "$tools")
          "$okld" bundle check "server/mcppls-$VERSION.okb"
          python3 - "server/mcppls-$VERSION.okb" "$TREE" <<'PY'
          import hashlib, sys, zipfile
          okb = zipfile.ZipFile(sys.argv[1])
          for arch in ("x86_64", "aarch64"):
              want = hashlib.sha256(open(f"{sys.argv[2]}/lib/{arch}/mcppls.oke", "rb").read()).hexdigest()
              got = hashlib.sha256(okb.read(f"{arch}/mcppls.oke")).hexdigest()
              assert want == got, (arch, want, got)
              assert okb.getinfo(f"{arch}/mcppls.oke").compress_type == zipfile.ZIP_STORED, arch
          print("okb images:", [i.filename for i in okb.infolist()])
          PY
          "$okrun" "server/mcppls-$VERSION.okb" version
      # The command line's server as one file per system and architecture: the platform's carrier with the image
      # inside, which loads it from memory (SPEC-014 §5.2), for every leg and system this mcpp builds a carrier for.
      - name: Single files
        run: |
          set -euo pipefail
          mcpp pack --profile release --target openkal --pkg-format single-file --systems all -o "$PWD/single-packed/" \
              --message-format json > single.json
          for file in $(jq -r '.data.artifacts[].path' single.json); do
            name=$(basename "$file")
            cp "$file" "server/mcppls-$VERSION-${name#mcpp-language-server-$VERSION-}"
          done
          for file in linux-x86_64 linux-aarch64 macos-aarch64 windows-x86_64.exe; do
            test -f "server/mcppls-$VERSION-$file" || { echo "::error::no single file for $file"; exit 1; }
          done
          "server/mcppls-$VERSION-linux-x86_64" version
          (cd server && sha256sum * | tee SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: server
          path: server
          retention-days: 7
      # The server's unit tests as what users run: ok images of both architectures, built once here and run on
      # every system by `openkal-test` (mcpp `test --archive`, SPEC-015 §4). The release profile is the one shipped.
      - name: The server's tests, as ok images
        run: |
          set -euo pipefail
          mkdir -p openkal-tests
          mcpp test --profile release --target openkal --no-run --archive openkal-tests/mcppls.tar.gz
          ls -l openkal-tests
      - uses: actions/upload-artifact@v7
        with:
          name: tests-openkal
          path: openkal-tests
          compression-level: 0
          retention-days: 7

  # ---------------------------------------------------------------------------
  # THE TARGET KITS (spec S4; ecosystem design 2026-10-29 §9.2): the semantic kit of each platform's own target,
  # which the server installs with xlings once the editor asks, and the release publishes for a machine without
  # the network. linux-x64 and win32-x64 are made on Linux; darwin-arm64 needs a macOS host for the libc++
  # configure; linux-arm64 an arm64 Linux host, whose dpkg has the aarch64 C headers the kit carries. The tool is
  # each platform's devtools from `build`'s release row.
  kits:
    name: kit (${{ matrix.platform }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64,    os: ubuntu-24.04,     tools: linux-x64 }
          - { platform: linux-arm64,  os: ubuntu-24.04-arm, tools: linux-arm64 }
          - { platform: darwin-arm64, os: macos-15,         tools: darwin-arm64 }
          - { platform: win32-x64,    os: ubuntu-24.04,     tools: linux-x64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Build tools for the kit configure
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q && sudo apt-get install -y -q ninja-build libc6-dev linux-libc-dev
            command -v cmake > /dev/null || sudo apt-get install -y -q cmake
          fi
          if [ "$RUNNER_OS" = macOS ]; then brew install ninja; fi
          cmake --version | head -1; ninja --version
      - name: Cache upstream inputs
        uses: actions/cache@v6
        with:
          path: .payload-cache
          key: kit-inputs-${{ matrix.platform }}-${{ hashFiles('packaging/payload.lock.json') }}
      - uses: actions/download-artifact@v8
        with:
          name: stage-${{ matrix.tools }}
      - name: The kit
        run: |
          set -euo pipefail
          tar -xzf stage-${{ matrix.tools }}.tar.gz
          stage/mcppls-devtools kit --platform ${{ matrix.platform }} --out kit --archive kits --cache "$PAYLOAD_CACHE"
          stage/mcppls-devtools kit --verify kit
          ls -l kits
      - uses: actions/upload-artifact@v7
        with:
          name: kit-${{ matrix.platform }}
          path: kits
          retention-days: 7

  # ---------------------------------------------------------------------------
  # THE PAYLOAD, ONE FOR EVERY PLATFORM (ecosystem design 2026-10-29 §9.1): the server's okb, the runner of every
  # system from the tree, each platform's clangd (mcppls-clangd: native, or the ok image clangd.okb its runner starts,
  # as the platform's lock row selects), and the openkal kit, made
  # from mcpp's build database of each openkal target. Assembled and verified on Linux; every later job of every
  # platform takes this one payload and its platform's entry.
  payload:
    name: payload
    needs: [server, build, engine-candidate-parts]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mcpp
      - name: Cache upstream inputs
        uses: actions/cache@v6
        with:
          path: .payload-cache
          key: payload-inputs-${{ hashFiles('packaging/payload.lock.json') }}
      - uses: actions/download-artifact@v8
        with:
          name: server
          path: server
      - uses: actions/download-artifact@v8
        with:
          name: stage-linux-x64
      # A candidate engine (docs/92-release.md, "A new engine"): packaging/engine-candidate.json names
      # a mcppls-clangd PR's CI run, whose packaged parts replace the lock's clangd, so the two are
      # tested together before the engine is released. Only a pull request, or a manual CI or nightly
      # run of a branch other than main, may: the nightly's ux rounds are where an engine change to
      # idle memory or typing latency shows, and they have to see the engine before it is released.
      - name: Candidate engine
        id: candidate
        run: |
          set -euo pipefail
          file=packaging/engine-candidate.json
          [ -f "$file" ] || exit 0
          manual=no
          if [ '${{ github.event_name }}' = workflow_dispatch ] && [ '${{ github.ref }}' != refs/heads/main ]; then
            case '${{ github.workflow }}' in CI|nightly) manual=yes ;; esac
          fi
          if [ '${{ github.event_name }}' != pull_request ] && [ "$manual" = no ]; then
            echo "::error::$file names an unreleased engine; it is for a pull request's CI, not ${{ github.workflow }} (${{ github.event_name }}). Release the engine, switch packaging/payload.lock.json to it and remove the file."
            exit 1
          fi
          echo "repository=$(jq -r .repository "$file")" >> "$GITHUB_OUTPUT"
          echo "run-id=$(jq -r '.["run-id"]' "$file")" >> "$GITHUB_OUTPUT"
          jq . "$file"
      - uses: actions/download-artifact@v8
        if: steps.candidate.outputs.run-id != ''
        with:
          pattern: clangd-*
          repository: ${{ steps.candidate.outputs.repository }}
          run-id: ${{ steps.candidate.outputs.run-id }}
          github-token: ${{ github.token }}
          path: candidate
      # The openkal kit the payload carries, checked by compiling the std and std.compat modules and a unit with it
      # for both targets (the LLVM the build uses, which is clangd's major).
      - name: The openkal kit
        run: |
          set -euo pipefail
          tar -xzf stage-linux-x64.tar.gz
          stage/mcppls-devtools kit --openkal --out kit-openkal --archive kits
          clang="$HOME/.mcpp/registry/data/xpkgs/xim-x-llvm/$LLVM_VERSION/bin/clang++"
          printf 'import std;\n#include <stdio.h>\n#include <unistd.h>\nint main() { std::println("{}", sizeof(long)); }\n' > "$RUNNER_TEMP/unit.cpp"
          for target in x86_64-openkal aarch64-openkal; do
            args=$(jq -r --arg t "$target" '.targets[$t] | (["--target=" + .target] + .arguments + [.["system-include-directories"][] | "-isystem" + .]) | join(" ")' kit-openkal/kit.json)
            (cd kit-openkal && "$clang" --no-default-config -std=c++23 $args -Wno-reserved-module-identifier --precompile share/libc++/v1/std.cppm -o "$RUNNER_TEMP/std.pcm")
            (cd kit-openkal && "$clang" --no-default-config -std=c++23 $args -Wno-reserved-module-identifier -fmodule-file=std="$RUNNER_TEMP/std.pcm" \
                --precompile share/libc++/v1/std.compat.cppm -o "$RUNNER_TEMP/std.compat.pcm")
            (cd kit-openkal && "$clang" --no-default-config -std=c++23 $args -fmodule-file=std="$RUNNER_TEMP/std.pcm" -fsyntax-only "$RUNNER_TEMP/unit.cpp")
            echo "$target: std, std.compat and a unit compile with the kit"
          done
      # Fetch the engines, assemble and verify: one command, the one a developer runs (docs/93-devtools.md).
      - name: Assemble
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version *= *"\(.*\)"$/\1/p' mcpp.toml | head -1)
          engine=()
          if [ -d candidate ]; then
            # The ok image's part (clangd-openkal) is its release archive; its engine.json names openkal.
            for archive in candidate/clangd-openkal/*.tar.gz; do
              [ -f "$archive" ] && tar -xzf "$archive" -C candidate/clangd-openkal
            done
            for part in $(find candidate -path '*clangd/engine.json' -exec dirname {} \;); do
              platform=$(jq -r .platform "$part/engine.json")
              chmod +x "$part"/bin/*
              jq '{platform, version: .["engine-version"], fork: .["fork-commit"], sha256}' "$part/engine.json"
              engine+=(--clangd "$platform=$part")
            done
            engine+=(--candidate)
          fi
          stage/mcppls-devtools payload --server-image "server/mcppls-$version.okb" --server-tree "server/mcppls-$version-openkal.zip" \
              --kit kit-openkal ${engine[@]+"${engine[@]}"} --out payload --cache "$PAYLOAD_CACHE"
          stage/mcppls-devtools payload --verify payload --json > "$RUNNER_TEMP/verify.json"
          cat "$RUNNER_TEMP/verify.json"
          # The payload carries the one okb byte for byte, and an entry for every platform.
          want=$(sha256sum "server/mcppls-$version.okb" | cut -d' ' -f1)
          got=$(jq -r '.server.sha256' "$RUNNER_TEMP/verify.json")
          echo "okb $want, payload $got"
          [ "$want" = "$got" ]
          [ "$(jq -r '.platforms | sort | join(" ")' "$RUNNER_TEMP/verify.json")" = 'darwin-arm64 linux-arm64 linux-x64 win32-x64' ]
          # A tarball keeps executable bits and links, which an artifact zip does not.
          tar -czf payload.tar.gz payload
          du -sh payload payload.tar.gz kits/*
      - uses: actions/upload-artifact@v7
        with:
          name: payload
          path: payload.tar.gz
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: kit-openkal
          path: kits
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The VS Code extension, one VSIX for every system: the one payload inside it, no target platform. Every editor
  # job below installs this file, which is what a release ships.
  vsix:
    name: the VS Code extension (one VSIX)
    needs: [changes, payload]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.vscode == 'true' }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: ./.github/actions/payload
        with:
          platform: linux-x64
          run-id: ${{ needs.changes.outputs.lend }}
      - name: Build and package the extension
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version *= *"\(.*\)"$/\1/p' mcpp.toml | head -1)
          mkdir -p vsix
          stage/mcppls-devtools extension --editor vscode --payload "$PWD/payload" --out "$PWD/vsix/mcppls-$version.vsix"
          unzip -l "vsix/mcppls-$version.vsix" | tail -1
          ! unzip -p "vsix/mcppls-$version.vsix" extension.vsixmanifest | grep -q 'TargetPlatform=' || { echo "::error::the VSIX names a target platform"; exit 1; }
      # The extension's own logic that needs no VS Code (src/serverLog.ts, src/kitAsk.ts), in plain Node.
      - name: Unit tests
        working-directory: editors/vscode
        run: npm run test:unit
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: vsix
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The specifications' executable part, against real toolchains (tests/cts/README.md). The cases are the objects of
  # tests/cts's topic files: each states the platforms it runs on (`on:<platform>`), what it holds and how the runner
  # drives it; a row runs the cases of its platform, Linux and Windows in two parts side by side (`--shard`, by the
  # times the store keeps).
  conformance:
    name: conformance (${{ matrix.platform }}${{ matrix.part && format(', {0}', matrix.part) || '' }})
    needs: [payload, kits]
    permissions:
      contents: read
      actions: read   # the stores main's last run kept, which divide the cases by time
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, part: 1 of 2, shard: 1/2, os: ubuntu-24.04 }
          - { platform: linux-x64, part: 2 of 2, shard: 2/2, os: ubuntu-24.04 }
          - { platform: darwin-arm64, os: macos-15 }
          # The arm64 row takes no mcpp: the server and mock producers are built on Linux. Most fixtures use the
          # semantic kit; the SDK-free target fixtures probe distribution clang, installed below.
          - { platform: linux-arm64, os: ubuntu-24.04-arm, cross-tools: true }
          - { platform: win32-x64, part: 1 of 2, shard: 1/2, os: windows-2022 }
          - { platform: win32-x64, part: 2 of 2, shard: 2/2, os: windows-2022 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mcpp
        if: '!matrix.cross-tools'
      # The one payload, this platform's test tools, and its target kit installed as on a machine whose person agreed
      # to install it: the fixtures read loose sources with this system's own target, as before the openkal kit.
      - uses: ./.github/actions/payload
        with:
          platform: ${{ matrix.platform }}
          kit: 'true'
      # mtest runs the cases: the release .github/versions.env pins, its sha256 checked.
      - uses: ./.github/actions/mtest
      # The store of the first attempt, so that a second runs only what failed.
      - uses: actions/cache/restore@v6
        id: attempt-store
        with:
          path: .mtest
          key: conformance-mtest-${{ github.run_id }}-${{ matrix.platform }}-${{ matrix.part || 'full' }}-${{ github.run_attempt }}
          restore-keys: conformance-mtest-${{ github.run_id }}-${{ matrix.platform }}-${{ matrix.part || 'full' }}-
      # A first attempt takes the stores main's last successful run kept for this platform, every part's: both parts
      # read the same history, so `--shard` divides the cases by measured time the same way in each. Without them the
      # cases are divided by count, and this run's stores become the next run's history.
      - name: The stores of main's last run
        if: steps.attempt-store.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status success --limit 1 \
                  --json databaseId -q '.[0].databaseId' 2>/dev/null || true)
          [ -n "$run" ] || { echo "no successful run of main: the cases are divided by count"; exit 0; }
          rm -rf "$RUNNER_TEMP/cts-stores"
          if ! gh run download "$run" -R "$GITHUB_REPOSITORY" -p "conformance-mtest-${{ matrix.platform }}-*" -D "$RUNNER_TEMP/cts-stores" 2>/dev/null; then
            echo "main's run $run kept no store for ${{ matrix.platform }}: the cases are divided by count"; exit 0
          fi
          for store in "$RUNNER_TEMP"/cts-stores/*/; do "$MTEST" store import --from "$store"; done
      # The cases of this row: its platform's, in its part. The steps below install what they build with.
      - name: The cases of this row
        run: |
          set -euo pipefail
          exe=''; [ "$RUNNER_OS" != Windows ] || exe='.exe'
          select=(--tag "on:${{ matrix.platform }}")
          [ -z "${{ matrix.shard }}" ] || select+=(--shard "${{ matrix.shard }}")
          echo "CTS_SELECT=${select[*]}" >> "$GITHUB_ENV"
          echo "CTS=stage/mcppls-cts$exe" >> "$GITHUB_ENV"
          "$MTEST" plan --json "${select[@]}" "stage/mcppls-cts$exe" > "$RUNNER_TEMP/cts-plan.json"
          cases=$(jq -r '[.units[].cases[].case] | join(" ")' "$RUNNER_TEMP/cts-plan.json")
          fixtures=$(jq -r '[.units[].cases[].case | split("@")[0]] | unique | join(" ")' "$RUNNER_TEMP/cts-plan.json")
          echo "$cases" | tr ' ' '\n' | sed 's/^/  /'
          echo "CTS_FIXTURES= $fixtures " >> "$GITHUB_ENV"
      - name: Toolchains the fixtures build with
        run: |
          set -euo pipefail
          # GCC 16 for the fixtures that build with it.
          gcc=no
          case "$CTS_FIXTURES" in *" mcpp-gcc "*|*" mcpp-split-gcc "*|*" mingw "*) gcc=yes ;; esac
          [ "$gcc" = no ] || mcpp toolchain install gcc 16.1.0
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -q && sudo apt-get install -y -q ninja-build; fi
          # The native mock target fixtures need only a compiler probe and SDK-free module sources.
          # arm64 has no mcpp toolchain store; its distribution clang is sufficient for these fixtures.
          if [ "${{ matrix.cross-tools }}" = true ]; then sudo apt-get install -y -q clang; fi
          # ux-modules-qt: Qt 5's headers in module units' global module fragments, from the distribution.
          case "$CTS_FIXTURES" in *" ux-modules-qt "*) sudo apt-get install -y -q qtbase5-dev ;; esac
      # 0.0.8 part 2 X-7: the xmake fixtures run xmake itself (pinned in .github/versions.env, from xlings like every other
      # tool here) with GCC 16 first on PATH: xmake picks the compiler it finds, and only GCC 16 has libstdc++'s std module.
      - name: xmake and GCC 16 for the xmake fixtures
        if: runner.os == 'Linux' && contains(env.CTS_FIXTURES, ' xmake-')
        run: |
          set -euo pipefail
          for package in "xmake@$XMAKE_VERSION" gcc@16.1.0; do
            for attempt in 1 2 3; do
              if xlings install "$package" -y -g; then break; fi
              [ "$attempt" = 3 ] && { echo "::error::$package could not be installed"; exit 1; }
              sleep 30
            done
          done
          xmake --version | head -1
          g++ --version | head -1
      # A fixture that needs a newer mcpp than the pinned one says so in its scenario.json ("requires-mcpp"; the runner
      # checks the version and says what it found). That release is installed beside the pinned one, which stays the
      # default, and named to the fixtures by MCPPLS_REAL_MCPP.
      - name: The mcpp the fixtures that require one run with
        if: '!matrix.cross-tools'
        run: |
          set -euo pipefail
          wanted=no
          for fixture in $CTS_FIXTURES; do
            grep -q '"requires-mcpp"' "tests/cts/fixtures/$fixture/scenario.json" 2>/dev/null && wanted=yes
          done
          [ "$wanted" = yes ] || exit 0
          # From mcpp's own release, its checksum checked: the index snapshot the pinned xlings syncs can lag a new mcpp
          # by days (2026.10.11.1 was in xim-pkgindex, not yet in the snapshot), and the pinned mcpp stays the default.
          case "$RUNNER_OS-$(uname -m)" in
            Linux-x86_64) platform=linux-x86_64; ext=tar.gz ;;
            Linux-aarch64) platform=linux-aarch64; ext=tar.gz ;;
            macOS-arm64) platform=macosx-arm64; ext=tar.gz ;;
            Windows-*) platform=windows-x86_64; ext=zip ;;
            *) echo "::error::no mcpp release for $RUNNER_OS-$(uname -m)"; exit 1 ;;
          esac
          archive="mcpp-$MCPP_FIXTURE_VERSION-$platform.$ext"
          base="https://github.com/mcpp-community/mcpp/releases/download/v$MCPP_FIXTURE_VERSION"
          temp="$RUNNER_TEMP"; python=python3
          if [ "$RUNNER_OS" = Windows ]; then temp=$(cygpath -u "$RUNNER_TEMP"); python=python; fi
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$temp/$archive" "$base/$archive"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$temp/$archive.sha256" "$base/$archive.sha256"
          expected=$(cut -d' ' -f1 "$temp/$archive.sha256")
          actual=$("$python" -c "import hashlib,sys; print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "$temp/$archive")
          [ "$expected" = "$actual" ] || { echo "::error::$archive: sha256 $actual, the release says $expected"; exit 1; }
          rm -rf "$temp/mcpp-fixture" && mkdir -p "$temp/mcpp-fixture"
          "$python" -c "import shutil,sys; shutil.unpack_archive(sys.argv[1], sys.argv[2])" "$temp/$archive" "$temp/mcpp-fixture"
          exe=''; [ "$RUNNER_OS" = Windows ] && exe='.exe'
          mcpp="$temp/mcpp-fixture/mcpp-$MCPP_FIXTURE_VERSION-$platform/bin/mcpp$exe"
          chmod +x "$mcpp" 2>/dev/null || true
          "$mcpp" --version
          mcpp --version
          if [ "$RUNNER_OS" = Windows ]; then mcpp=$(cygpath -m "$mcpp"); fi
          echo "MCPPLS_REAL_MCPP=$mcpp" >> "$GITHUB_ENV"
      # usable plan W3, closing the loop with mcpp itself: what `mcpp emit build-database` prints for
      # each of this host's mcpp fixtures, against the S1 and S2 schemas, S1's semantic rules and the
      # contract of mcpp-community/mcpp#636 (docs/specs/tools/validate.py). The fixtures below then have the
      # server consume the same answers. A fixture with mcpp-mock.json simulates mcpp and is skipped.
      - name: mcpp's own build databases against the specifications
        if: '!matrix.cross-tools'
        env:
          PYTHONUTF8: '1'
        run: |
          set -euo pipefail
          temp="$RUNNER_TEMP"; python=python3
          if [ "$RUNNER_OS" = Windows ]; then temp=$(cygpath -u "$RUNNER_TEMP"); python=python; fi
          "$python" -m venv "$temp/specs"
          venv="$temp/specs/bin/python"; [ "$RUNNER_OS" = Windows ] && venv="$temp/specs/Scripts/python.exe"
          "$venv" -m pip install --quiet --disable-pip-version-check 'jsonschema>=4.18'
          envelopes=()
          for fixture in $CTS_FIXTURES; do
            case "$fixture" in mcpp-*) ;; *) continue ;; esac
            source="tests/cts/fixtures/$fixture"
            [ -f "$source/mcpp.toml" ] && [ ! -f "$source/mcpp-mock.json" ] || continue
            [ -e "$temp/mcpp-emit/$fixture.json" ] && continue
            mkdir -p "$temp/mcpp-emit" && cp -R "$source" "$temp/mcpp-emit/$fixture"
            emit=mcpp; grep -q '"requires-mcpp"' "$source/scenario.json" && emit="${MCPPLS_REAL_MCPP:-mcpp}"
            (cd "$temp/mcpp-emit/$fixture" && "$emit" emit build-database --format json > "$temp/mcpp-emit/$fixture.json")
            envelopes+=("$temp/mcpp-emit/$fixture.json")
          done
          "$venv" docs/specs/tools/validate.py ${envelopes[@]+"${envelopes[@]}"} | grep -v '^PASS'
      # cmake-clang-bdb, cmake-msvc-bdb and cmake-clang-cl need CMake 4.4 (the build-database export merges
      # correctly from 4.4 on, usable plan W4, E16; clang-cl module scanning, W1.8); these hosts' own CMake is the
      # 3.31.6 the runner images ship. Each states it (`requires-cmake`, CONFORMANCE_CMAKE), and the runner puts
      # this CMake first on the PATH of that fixture's prepare steps only: CMake rotates its experimental-feature
      # UUIDs, and cmake-msvc-std pins 3.31.6's CMAKE_EXPERIMENTAL_CXX_IMPORT_STD UUID (E1/E7-E11).
      - name: Cache CMake 4.4.2 (cmake-clang-bdb, cmake-msvc-bdb, cmake-clang-cl)
        if: matrix.platform == 'linux-x64' || matrix.platform == 'win32-x64'
        id: cmake-bdb-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/cmake-4.4.2
          key: cmake-bdb-4.4.2-${{ runner.os }}
      - name: Install CMake 4.4.2
        if: (matrix.platform == 'linux-x64' || matrix.platform == 'win32-x64') && steps.cmake-bdb-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cmake-4.4.2"
          if [ "$RUNNER_OS" = Linux ]; then
            curl -sfL https://github.com/Kitware/CMake/releases/download/v4.4.2/cmake-4.4.2-linux-x86_64.tar.gz -o "$RUNNER_TEMP/cmake-4.4.2.tar.gz"
            tar -xzf "$RUNNER_TEMP/cmake-4.4.2.tar.gz" -C "$RUNNER_TEMP/cmake-4.4.2" --strip-components 1
          else
            curl -sfL https://github.com/Kitware/CMake/releases/download/v4.4.2/cmake-4.4.2-windows-x86_64.zip -o "$RUNNER_TEMP/cmake-4.4.2.zip"
            # A bash step, so $RUNNER_TEMP (bash-expanded below) rather than
            # pwsh's own $env:RUNNER_TEMP, which bash would try to expand itself.
            pwsh -NoProfile -Command "Expand-Archive -Path '$RUNNER_TEMP/cmake-4.4.2.zip' -DestinationPath '$RUNNER_TEMP/cmake-4.4.2-zip' -Force"
            mv "$RUNNER_TEMP"/cmake-4.4.2-zip/cmake-4.4.2-windows-x86_64/* "$RUNNER_TEMP/cmake-4.4.2/"
          fi
      - name: CMake 4.4.2 is there and reports its version
        if: matrix.platform == 'linux-x64' || matrix.platform == 'win32-x64'
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then "$RUNNER_TEMP/cmake-4.4.2/bin/cmake.exe" --version; else "$RUNNER_TEMP/cmake-4.4.2/bin/cmake" --version; fi
      # The MSVC fixtures build inside a developer environment; the server under test
      # runs without one, as it does when an editor starts it (usable plan D30).
      - name: The MSVC developer environment, for the fixtures' own builds
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Set-Content -Path "$env:RUNNER_TEMP\capture-msvc.cmd" -Value "@call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul`r`n@set"
          cmd /d /c "$env:RUNNER_TEMP\capture-msvc.cmd" | Out-File -Encoding utf8 "$env:RUNNER_TEMP\msvc.env"
          Select-String -Path "$env:RUNNER_TEMP\msvc.env" -Pattern '^(VCToolsInstallDir|WindowsSDKVersion)='
      - name: The packaged mock producer starts on this host
        run: |
          set -euo pipefail
          exe=''; [ "$RUNNER_OS" != Windows ] || exe='.exe'
          "stage/mcppls-mock-mcpp$exe" --protocol-version
      - name: Run the fixtures
        env:
          # LLVM_VERSION (.github/versions.env) is put in below: one pin for the toolchain and this path.
          CONFORMANCE_CLANGXX: ${{ runner.os == 'Linux' && !matrix.cross-tools && '~/.mcpp/registry/data/xpkgs/xim-x-llvm/LLVM_VERSION/bin/clang++' || '' }}
        run: |
          set -euo pipefail
          # A cross-tools row has no setup-mcpp, so no versions.env, and no path to fill in.
          CONFORMANCE_CLANGXX="${CONFORMANCE_CLANGXX/LLVM_VERSION/${LLVM_VERSION:-}}"
          export CONFORMANCE_CLANGXX="${CONFORMANCE_CLANGXX/#\~/$HOME}"
          if [ "${{ matrix.cross-tools }}" = true ]; then
            # S1 toolchain drivers are absolute paths; this host has distribution clang,
            # rather than an mcpp LLVM store for the mock's compiler placeholder.
            CONFORMANCE_CLANGXX=$(command -v clang++)
            [[ "$CONFORMANCE_CLANGXX" = /* ]]
            test -x "$CONFORMANCE_CLANGXX"
            export CONFORMANCE_CLANGXX
            "$CONFORMANCE_CLANGXX" --version
          fi
          # The cases of this row (above), each in a process of its own and two at a time; a case that holds the
          # machine runs alone. A failing case runs once more with the server's log, kept in the store and named by
          # `mtest explain` (the cases' `diagnose`). A second attempt of this job runs only the cases that failed.
          export MCPPLS_CTS_MEASURES="$RUNNER_TEMP/conformance-measures" MCPPLS_CTS_BUNDLES="$RUNNER_TEMP/bundles"
          export MCPPLS_CTS_EVIDENCE="$RUNNER_TEMP/evidence"
          if [ "$RUNNER_OS" = Windows ]; then
            export MCPPLS_CTS_MSVC_ENV="$RUNNER_TEMP/msvc.env" CONFORMANCE_CMAKE="$RUNNER_TEMP/cmake-4.4.2/bin/cmake.exe"
          elif [ "${{ matrix.platform }}" = linux-x64 ]; then
            export CONFORMANCE_CMAKE="$RUNNER_TEMP/cmake-4.4.2/bin/cmake"
          fi
          status=0
          if [ "${{ github.run_attempt }}" -gt 1 ] && [ -f .mtest/index.ndjson ]; then
            "$MTEST" rerun --junit "$RUNNER_TEMP/conformance.xml" "$CTS" || status=$?
          else
            # shellcheck disable=SC2086 # CTS_SELECT is words
            "$MTEST" run --isolate --jobs "${CONFORMANCE_JOBS:-2}" --junit "$RUNNER_TEMP/conformance.xml" $CTS_SELECT "$CTS" || status=$?
          fi
          if [ "$status" != 0 ]; then
            "$MTEST" explain || true
            for out in .mtest/runs/*/diagnoses/*/out.txt; do
              [ -f "$out" ] || continue
              echo "::group::diagnosis $(dirname "$out")"; tail -200 "$out"; echo "::endgroup::"
            done
            exit 1
          fi

      - uses: actions/cache/save@v6
        if: always()
        with:
          path: .mtest
          key: conformance-mtest-${{ github.run_id }}-${{ matrix.platform }}-${{ matrix.part || 'full' }}-${{ github.run_attempt }}
      # The store alone, so its files are the artifact's (a hidden directory is uploaded only when asked).
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conformance-mtest-${{ matrix.platform }}-${{ matrix.part || 'full' }}
          path: .mtest
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conformance-junit-${{ matrix.platform }}-${{ matrix.part || 'full' }}
          path: ${{ runner.temp }}/conformance.xml
          if-no-files-found: ignore

      # Preserve the first producer envelopes even when schema validation stops
      # the job before any LSP fixture starts.
      - uses: actions/upload-artifact@v7
        if: always() && !matrix.cross-tools
        with:
          name: producer-envelopes-${{ matrix.platform }}-${{ matrix.part || 'full' }}
          path: ${{ runner.temp }}/mcpp-emit/*.json
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conformance-measures-${{ matrix.platform }}-${{ matrix.part || 'full' }}
          path: ${{ runner.temp }}/conformance-measures/*.json
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        if: always() && contains(env.CTS_FIXTURES, ' mcpp-target-windows-real ')
        with:
          name: real-mcpp-target-cdb-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/evidence/mcpp-target-windows-real*/workspace/mcpp-target-windows-real/recorded-*.json
            ${{ runner.temp }}/evidence/mcpp-target-windows-real*/workspace/mcpp-target-windows-real/compile_commands.json
            ${{ runner.temp }}/evidence/mcpp-target-windows-real*/cache/logs/*.log
            ${{ runner.temp }}/evidence/mcpp-target-windows-real*/cache/workspaces/**/model.mcpp.json
          if-no-files-found: ignore

      # Issue #23 fix plan F18: the bundles diagnostic-bundle exported on this runner's own account, whose
      # name is in every path of it (runneradmin and RUNNER~1 on Windows). The fixture already held each
      # to its manifest and found no user name and no home directory in it; here another program's zip
      # reader opens them and checks every entry's CRC, and they are kept to look at.
      - name: The diagnostic bundles open with another program's zip reader
        if: always() && contains(env.CTS_FIXTURES, ' diagnostic-bundle ')
        env:
          PYTHONUTF8: '1'
        run: |
          set -euo pipefail
          temp="$RUNNER_TEMP"; python=python3
          if [ "$RUNNER_OS" = Windows ]; then temp=$(cygpath -u "$RUNNER_TEMP"); python=python; fi
          shopt -s nullglob
          bundles=("$temp"/bundles/*.zip)
          [ ${#bundles[@]} -gt 0 ] || { echo "::error::diagnostic-bundle left no bundle"; exit 1; }
          for bundle in "${bundles[@]}"; do "$python" -m zipfile -t "$bundle"; "$python" -m zipfile -l "$bundle"; done
      - uses: actions/upload-artifact@v7
        if: always() && contains(env.CTS_FIXTURES, ' diagnostic-bundle ')
        with:
          name: diagnostic-bundle-${{ matrix.platform }}
          path: ${{ runner.temp }}/bundles/*.zip
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # termux / PRoot is a supported environment (issue #32, 0.0.7 plan §1, §10.2), so it is tested,
  # not assumed: the server runs under termux's PRoot, built here from a pinned commit, in both of
  # PRoot's modes -- its default (a seccomp filter takes the fast path, and rewrites registers it
  # does not restore) and PROOT_NO_SECCOMP=1 (ptrace stops on every call). Two defects of openkal-linux
  # 0.15.0 showed up as "cannot start ...: not supported" and "program is outside every preopened
  # directory" on every start; vendor/README.md has both. A regression of either fails the fixtures
  # below, which is what this job is for.
  #
  # The server under test is the payload's own -- this platform's runner starting its okb
  # (`payload/libexec/okrun/<system>-<arch>/okrun payload/bin/mcppls.okb`) -- wrapped: a wrapper script generated here runs it under proot, which
  # is how the conformance runner (--server) and the VS Code extension
  # (MCPPLS_SERVER) are pointed at it. The payload's clangd, the kit and the fixtures' own
  # processes are started BY the server, so they run under proot too. The runner and the editor
  # stay outside.
  proot:
    name: proot (${{ matrix.platform }})
    needs: [payload, kits, vsix]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # The arm64 runner has no mcpp: its tools are the ones built on Linux (stage/), as in the
          # conformance job. VS Code's suite runs on linux-x64 only, as the
          # arm64 runner would need the display libraries installed for one more run of the same thing.
          - { platform: linux-x64,   os: ubuntu-24.04, vscode: true }
          - { platform: linux-arm64, os: ubuntu-24.04-arm }
    env:
      # termux/proot master at the time this was written. A pin, because a PRoot change must not
      # turn this job red without anyone having touched this repository.
      PROOT_COMMIT: d4d2a19081c3c07f75250e4ce2980b9fa2f5720f
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/payload
        with:
          platform: ${{ matrix.platform }}
          kit: 'true'
      - name: Cache termux/proot
        id: proot-cache
        uses: actions/cache@v6
        with:
          path: ~/proot-bin
          key: termux-proot-${{ env.PROOT_COMMIT }}-${{ runner.arch }}-v2
      - name: Build termux/proot at the pinned commit
        if: steps.proot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -q && sudo apt-get install -y -q libtalloc-dev build-essential
          src="$RUNNER_TEMP/termux-proot"
          mkdir -p "$src" && cd "$src"
          git init -q .
          git remote add origin https://github.com/termux/proot
          git fetch -q --depth 1 origin "$PROOT_COMMIT"
          git checkout -q FETCH_HEAD
          git log --oneline -1
          cd src
          # compat.h defines SYS_SECCOMP unless it is a macro, and a glibc that declares it as an enum
          # constant turns that into a syntax error. The definition is redundant there: drop it if,
          # and only if, the build needs it dropped.
          # No 32-bit loader (HAS_LOADER_32BIT empty): it needs a compiler for 32-bit ARM or x86, which the arm64
          # runner's gcc is not (`-m32`), and nothing here runs a 32-bit program.
          make -j"$(nproc)" HAS_LOADER_32BIT= || { sed -i '/^#    ifndef SYS_SECCOMP/,/^#    endif/d' compat.h && make -j"$(nproc)" HAS_LOADER_32BIT=; }
          mkdir -p ~/proot-bin && cp proot ~/proot-bin/proot
      # The cached binary links libtalloc, which the runner image no longer carries (ubuntu-24.04,
      # 2026-11-01: "libtalloc.so.2: cannot open shared object file"); the build step installs it
      # only when it builds.
      - name: The library proot links
        if: steps.proot-cache.outputs.cache-hit == 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q libtalloc2
      - name: proot itself works, and is the one we built
        run: |
          set -euo pipefail
          ~/proot-bin/proot -r / /bin/true
          PROOT_NO_SECCOMP=1 ~/proot-bin/proot -r / /bin/true
          file ~/proot-bin/proot
      # The two wrappers. `-r /`: no guest file system, only proot's translation of every call, which
      # is what a Debian rootfs under termux adds a root directory to.
      - name: Wrappers that run the server under proot, in each mode
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proot"
          for mode in seccomp noseccomp; do
            wrapper="$RUNNER_TEMP/proot/mcppls-$mode"
            {
              echo '#!/bin/sh'
              # A line per start, so a step can say the server it ran against really ran under proot.
              echo "echo started >> $RUNNER_TEMP/proot/started-$mode"
              if [ "$mode" = noseccomp ]; then echo 'export PROOT_NO_SECCOMP=1'; fi
              echo "exec $HOME/proot-bin/proot -r / $PWD/payload/$(jq -r '.platforms["${{ matrix.platform }}"].runner' payload/payload.json) $PWD/payload/bin/mcppls.okb \"\$@\""
            } > "$wrapper"
            chmod +x "$wrapper"
            cat "$wrapper"
          done
      # What the report says before any fixture runs: clangd started and is ready, and nothing in
      # the output or the log says a program could not be started.
      - name: mcppls report under proot, in each mode
        run: |
          set -euo pipefail
          for mode in seccomp noseccomp; do
            echo "::group::report ($mode)"
            work="$RUNNER_TEMP/report-$mode"
            rm -rf "$work" && mkdir -p "$work" && cp -R tests/cts/fixtures/inferred "$work/project"
            rm -f "$work/project/scenario.json"
            MCPPLS_CACHE_DIR="$work/cache" "$RUNNER_TEMP/proot/mcppls-$mode" report --root "$work/project" \
                --settle 20 --payload "$PWD/payload" > "$work/report.json" 2> "$work/report.err"
            tail -5 "$work/report.err"
            if grep -q -e 'not supported' -e 'outside every preopened' -e 'no preopened directory is named' "$work/report.json" "$work/report.err"; then
              grep -h -e 'not supported' -e 'outside every preopened' -e 'no preopened directory is named' "$work/report.json" "$work/report.err" | head
              echo "::error::the server could not start a program under proot ($mode)"; exit 1
            fi
            state=$(jq -r '[.roots[0].engines[] | select(.name == "clangd") | .state][0]' "$work/report.json")
            echo "clangd: $state"
            [ "$state" = ready ] || { echo "::error::clangd is '$state' under proot ($mode)"; exit 1; }
            echo "::endgroup::"
          done
      - name: Conformance fixtures under proot, in each mode
        run: |
          set -euo pipefail
          failed=''
          for mode in seccomp noseccomp; do
            for fixture in inferred typing-import completion-keywords diagnostic-bundle watch-polling; do
              echo "::group::$fixture ($mode)"
              extra=()
              # The polling fallback runs only when the client never declares dynamic watching.
              case "$fixture" in watch-polling) extra+=(--no-dynamic-watch) ;; esac
              if ! stage/mcppls-conformance run --server "$RUNNER_TEMP/proot/mcppls-$mode" --payload payload \
                     ${extra[@]+"${extra[@]}"} --fixture "tests/cts/fixtures/$fixture" --timeout 180; then
                failed="$failed $fixture@$mode"
              fi
              echo "::endgroup::"
            done
          done
          if [ -n "$failed" ]; then
            echo "::error::failed under proot:$failed"
            first=${failed# }; first=${first%% *}; mode=${first#*@}
            stage/mcppls-conformance run --server "$RUNNER_TEMP/proot/mcppls-$mode" --payload payload \
                --fixture "tests/cts/fixtures/${first%@*}" --timeout 60 --verbose 2>&1 | tail -200 || true
            exit 1
          fi
      # The editor's own suite, on the server under proot (the extension reads MCPPLS_SERVER; see
      # editors/vscode/src/payload.ts): what a person in termux with VS Code's server sees.
      - uses: actions/setup-node@v7
        if: matrix.vscode
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: actions/download-artifact@v8
        if: matrix.vscode
        with:
          name: vsix
          path: vsix
      - name: The extension's test harness
        if: matrix.vscode
        working-directory: editors/vscode
        run: npm ci --no-audit --no-fund && npm run compile
      - name: VS Code end-to-end suite with the server under proot
        if: matrix.vscode
        working-directory: editors/vscode
        run: |
          set -euo pipefail
          before=$(wc -l < "$RUNNER_TEMP/proot/started-seccomp")
          MCPPLS_E2E_VSIX=$(ls "$GITHUB_WORKSPACE"/vsix/mcppls-*.vsix) MCPPLS_SERVER="$RUNNER_TEMP/proot/mcppls-seccomp" xvfb-run -a npm test
          # The editor started the wrapper, not some other server.
          after=$(wc -l < "$RUNNER_TEMP/proot/started-seccomp")
          echo "the editor started the server under proot $((after - before)) times"
          [ "$after" -gt "$before" ]

  # ---------------------------------------------------------------------------
  # User-experience scenarios (0.0.7 plan 6.4, tests/cts/README.md "Scenario checks"): the mcpp and xlings
  # repositories at pinned commits, a person's first minutes and worst moments with them, on the size of
  # machine the plan measures against: this runner's 4 vCPU and 16 GB are the `taskset -c 0-3` tier of a
  # developer's laptop. The budgets in the fixtures are the merge gate. Each stage is a run of the fixture
  # (cold start, warm start on the same cache, typing and saves on that cache, faults on a cache of their
  # own); a stage that fails does not skip the ones after it, so a run says everything that is over budget,
  # and every stage's measure file is uploaded whether or not it passed, for the trend. The `long` stage
  # (ten idle minutes, a git checkout twenty commits back) is nightly's. ux-heavy-headers (0.0.9 plan M-2)
  # needs no checkout: it generates a project of heavy headers and holds completion through the server to
  # what clangd alone does on it, in its one stage.
  ux:
    name: ux (${{ matrix.fixture }})
    needs: [payload, kits]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        fixture: [ux-mcpp, ux-xlings, ux-heavy-headers]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mcpp
      - name: GCC 16, which the mcpp and xlings repositories build with
        if: matrix.fixture != 'ux-heavy-headers'
        run: mcpp toolchain install gcc 16.1.0
      # The mcpp repository's .xlings.json asks for the mcpp it is built with, and xlings runs that one
      # inside it, refusing to when it is not installed (nightly's self-hosting job does the same).
      - name: The mcpp the mcpp repository asks for
        if: matrix.fixture == 'ux-mcpp'
        run: |
          set -euo pipefail
          xlings install mcpp@2026.9.21.1 -y -g
          xlings use mcpp "$MCPP_VERSION"
          mcpp --version
      - uses: ./.github/actions/payload
        with:
          platform: linux-x64
          kit: 'true'
      - uses: ./.github/actions/mtest
      # The scenario's stages, each a case of mcppls-bench (tests/bench/ux.cpp), in order on one workspace.
      - name: The stages
        run: |
          set -euo pipefail
          nproc
          cat /proc/loadavg
          export MCPPLS_CTS_MEASURES="$RUNNER_TEMP/ux-results" MCPPLS_CTS_EVIDENCE="$RUNNER_TEMP/ux-work"
          status=0
          "$MTEST" run --case '${{ matrix.fixture }}' stage/mcppls-bench || status=$?
          "$MTEST" analyze trend --runs 1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          [ "$status" = 0 ] || { "$MTEST" explain || true; exit 1; }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ux-${{ matrix.fixture }}
          path: ${{ runner.temp }}/ux-results
      # The server's logs and incidents of a failed stage (each incident keeps clangd's log): what a stall, a
      # restart or a set-aside file was, which the measurements above only count.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ux-${{ matrix.fixture }}-server
          path: |
            ${{ runner.temp }}/ux-work/*/cache-*/logs
            ${{ runner.temp }}/ux-work/*/cache-*/workspaces/*/incidents
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Clean machines (usable plan W5, design 20.2): no compiler, no Visual Studio, no
  # Command Line Tools. Linux runs in a bare container; the Windows and macOS images
  # cannot be emptied, so their toolchains are hidden and asserted invisible first.
  # The conformance fixture and the packaged extension's end-to-end suite both run there.
  clean-machine:
    name: clean machine (${{ matrix.platform }})
    needs: [payload, kits, vsix]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux and Windows have no kit of their own target either: what a clean machine with no network has, the
          # openkal kit. macOS has its kit, whose SDK the hidden Command Line Tools take away (inferred-no-sdk).
          - { platform: linux-x64,    os: ubuntu-24.04, exe: '',     kit: 'false' }
          - { platform: win32-x64,    os: windows-2022, exe: '.exe', kit: 'false' }
          - { platform: darwin-arm64, os: macos-15,     exe: '',     kit: 'true' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/payload
        with:
          platform: ${{ matrix.platform }}
          kit: ${{ matrix.kit }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: vsix
          path: vsix
      - name: The extension, and its test harness
        run: |
          set -euo pipefail
          cp vsix/mcppls-*.vsix "$RUNNER_TEMP/mcpp-language-server.vsix"
          (cd editors/vscode && npm ci --no-audit --no-fund && npm run compile)
      - name: A container without a compiler
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/w" -w /w ubuntu:24.04 bash -c '
            set -euo pipefail
            for tool in c++ g++ gcc cc clang++ clang; do
              if command -v "$tool"; then echo "::error::$tool is on PATH"; exit 1; fi
            done
            stage/mcppls-conformance run --server payload/bin/mcppls.okb --payload payload \
                --fixture tests/cts/fixtures/inferred-discover --timeout 180'
      - name: The extension in the same kind of container
        if: runner.os == 'Linux'
        timeout-minutes: 40
        run: |
          # Each phase is timed and bounded, so a stall names itself: this step sat silent for the
          # whole job timeout twice, in package configuration. Non-interactive: libgtk-3-0's
          # dependencies would otherwise ask. PKGSYSTEM_ENABLE_FSYNC=0: shared-mime-info's
          # update-mime-database syncs every file it writes, which on a container's overlay file
          # system can take longer than the job; dpkg's own syncs are skipped the same way.
          docker run --rm -e DEBIAN_FRONTEND=noninteractive -e PKGSYSTEM_ENABLE_FSYNC=0 -v "$PWD:/w" -v "$RUNNER_TEMP:/t" -w /w/editors/vscode \
              node:22-bookworm-slim bash -c '
            set -euo pipefail
            phase() { echo "[$(date +%T)] $*"; }
            phase "apt-get update"
            timeout -k 30s 5m apt-get update -qq
            phase "apt-get install"
            if ! timeout -k 30s 15m apt-get install -y -q --no-install-recommends -o Dpkg::Use-Pty=0 -o Dpkg::Options::=--force-unsafe-io \
                xvfb xauth ca-certificates libnss3 libatk1.0-0 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2 libxss1 libxkbfile1 \
                libsecret-1-0 > /t/apt.log 2>&1; then
              tail -60 /t/apt.log; echo "::error::the packages the extension host needs did not install"; exit 1
            fi
            phase "no compiler on PATH"
            for tool in c++ g++ gcc cc clang++ clang; do
              if command -v "$tool"; then echo "::error::$tool is on PATH"; exit 1; fi
            done
            phase "npm test"
            MCPPLS_E2E_VSIX=/t/mcpp-language-server.vsix timeout -k 30s 20m xvfb-run -a npm test
            phase "done"'
      - name: Visual Studio hidden and no compiler on PATH
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          NODE_PATH_FOR_E2E="$(command -v node)"
          mv "/c/Program Files (x86)/Microsoft Visual Studio/Installer" "/c/Program Files (x86)/Microsoft Visual Studio/Installer.hidden"
          export PATH="/c/Windows/system32:/c/Windows:/c/Windows/System32/Wbem:/usr/bin"
          for tool in vswhere cl clang-cl clang++ g++ c++ gcc; do
            if command -v "$tool"; then echo "::error::$tool is still visible"; exit 1; fi
          done
          stage/mcppls-conformance.exe run --server payload/bin/mcppls.okb --payload payload \
              --fixture tests/cts/fixtures/inferred-discover --timeout 180
          # The packaged extension with the same machine view; node stays reachable for the test runner.
          # Git's /usr/bin goes first: npm starts through `env bash`, and System32's bash.exe is WSL's.
          export PATH="/usr/bin:$(dirname "$NODE_PATH_FOR_E2E"):/c/Windows/system32:/c/Windows:/c/Windows/System32/Wbem"
          cd editors/vscode && MCPPLS_E2E_VSIX="$RUNNER_TEMP/mcpp-language-server.vsix" npm test

      # U7: the kit needs the macOS SDK, which is gone with the Command Line Tools. The server
      # degrades with the install command and runs no developer-tool shim; the extension asks
      # once and not again after a restart.
      - name: Command Line Tools and Xcode hidden
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          sudo mv /Library/Developer/CommandLineTools /Library/Developer/CommandLineTools.hidden
          for app in /Applications/Xcode*.app; do sudo mv "$app" "${app%.app}.hidden"; done
          sudo xcode-select --reset || true
          if [ -e /Library/Developer/CommandLineTools ] || compgen -G "/Applications/Xcode*.app" > /dev/null; then
            echo "::error::developer tools are still visible"; exit 1
          fi
          stage/mcppls-conformance run --server payload/bin/mcppls.okb --payload payload \
              --fixture tests/cts/fixtures/inferred-no-sdk --timeout 120
          cd editors/vscode
          MCPPLS_E2E_VSIX="$RUNNER_TEMP/mcpp-language-server.vsix" MCPPLS_E2E_ONLY=sdk-missing.test.js MCPPLS_E2E_EXPECT_SDK_MISSING=1 npm test

  # ---------------------------------------------------------------------------
  # VS Code → extension → mcppls → clangd, the one VSIX on every system (design 16; ecosystem design 2026-10-29 §9.3).
  vscode-e2e:
    name: VS Code end to end (${{ matrix.platform }})
    needs: [changes, vsix, kits]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.vscode == 'true' }}
    permissions:
      contents: read
      actions: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64,    os: ubuntu-24.04,     exe: '' }
          - { platform: linux-arm64,  os: ubuntu-24.04-arm, exe: '' }
          - { platform: darwin-arm64, os: macos-15,         exe: '' }
          - { platform: win32-x64,    os: windows-2022,     exe: '.exe' }
    env:
      MCPPLS_LOG_LEVEL: debug
    defaults:
      run:
        shell: bash
    steps:
      - name: Set editor evidence directory on the allocated runner
        run: echo "MCPPLS_E2E_EVIDENCE_DIR=$RUNNER_TEMP/editor-e2e-evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      # The arm64 image is not the x64 one: the display server and the libraries VS Code's
      # Electron loads are installed rather than assumed.
      - name: What VS Code needs on arm64 Linux
        if: matrix.platform == 'linux-arm64'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb xauth libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 \
              libgtk-3-0t64 libgbm1 libasound2t64 libxss1 libxkbfile1 libsecret-1-0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      # The VSIX the `vsix` job packaged, the one a release ships (W6.3: the suites below test the installed VSIX,
      # not the development folder), and this platform's target kit, as on a machine whose person installed it.
      - uses: actions/download-artifact@v8
        with:
          name: vsix
          path: vsix
      - uses: actions/download-artifact@v8
        with:
          name: kit-${{ matrix.platform }}
          run-id: ${{ needs.changes.outputs.lend || github.run_id }}
          github-token: ${{ github.token }}
          path: kit-archive
      - name: The kit of this platform's target, installed
        run: |
          set -euo pipefail
          archive=$(ls kit-archive/mcppls-kit-*.tar.gz)
          name=$(basename "$archive" .tar.gz); version=${name##*-}; target=${name%-*}; target=${target#mcppls-kit-}
          store="$HOME/.xlings/data/xpkgs/xim-x-mcppls-kit-$target/$version"
          mkdir -p "$store" && tar -xzf "$archive" -C "$store" --strip-components 1 && test -f "$store/kit.json"
          cp vsix/mcppls-*.vsix "editors/vscode/mcppls.vsix"
      - name: The extension's test harness
        working-directory: editors/vscode
        run: npm ci --no-audit --no-fund && npm run compile
      - name: End-to-end tests (VSIX form)
        working-directory: editors/vscode
        env:
          MCPPLS_E2E_VSIX: ${{ github.workspace }}/editors/vscode/mcppls.vsix
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm test; else npm test; fi
      # Conflicting-extension detection (W6.4/U10): a separate scenario, its
      # own pair of stub extensions, and its own workspace-unchanged
      # allowance for .vscode/settings.json (see test/runTest.ts).
      - name: End-to-end tests (conflicts scenario)
        working-directory: editors/vscode
        env:
          MCPPLS_E2E_VSIX: ${{ github.workspace }}/editors/vscode/mcppls.vsix
          MCPPLS_E2E_SCENARIO: conflicts
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm test; else npm test; fi
      # Seeded random use through VS Code's own provider commands (real-project plan RP0): every
      # request answered, none past its budget, p90 within five seconds.
      - name: End-to-end tests (stress scenario)
        working-directory: editors/vscode
        env:
          MCPPLS_E2E_VSIX: ${{ github.workspace }}/editors/vscode/mcppls.vsix
          MCPPLS_E2E_SCENARIO: stress
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm test; else npm test; fi
      - name: Preserve editor request and engine failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vscode-e2e-evidence-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/editor-e2e-evidence/*.json
            ${{ runner.temp }}/editor-e2e-evidence/**/logs/**
            ${{ runner.temp }}/editor-e2e-evidence/**/incidents/**
            ${{ runner.temp }}/editor-e2e-evidence/**/crash-reports/**
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # ONE PACKAGE, EVERY SYSTEM (ecosystem design 2026-10-29 §9.3), on each system: the one VSIX carries exactly
  # one okb, the bytes `server` wrote, and this platform's entry names the runner that starts it here; the tree
  # starts the server here through its launcher with nothing installed -- the POSIX script, or on Windows the
  # launcher program `bin/mcppls.exe` (no .cmd), and the script hands over to it under Git Bash; and the single
  # file of this system and architecture runs here.
  distribution:
    name: one package, every system (${{ matrix.platform }})
    needs: [server, vsix]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64,    system: linux-x86_64,   os: ubuntu-24.04,     exe: '' }
          - { platform: linux-arm64,  system: linux-aarch64,  os: ubuntu-24.04-arm, exe: '' }
          - { platform: darwin-arm64, system: macos-aarch64,  os: macos-15,         exe: '' }
          - { platform: win32-x64,    system: windows-x86_64, os: windows-2022,     exe: '.exe' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: server
          path: server
      - uses: actions/download-artifact@v8
        with:
          name: vsix
          path: vsix
      - name: The VSIX carries the server's okb and the engine's, and this platform's runner starts them
        run: |
          set -euo pipefail
          python=python3; temp="$RUNNER_TEMP"
          if [ "$RUNNER_OS" = Windows ]; then python=python; temp=$(cygpath -u "$RUNNER_TEMP"); fi
          "$python" -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" vsix/mcppls-*.vsix "$temp/vsix"
          payload="$temp/vsix/extension/payload"
          jq -c '{server, platforms: (.platforms | keys)}' "$payload/payload.json"
          [ "$(jq -r .server.path "$payload/payload.json")" = bin/mcppls.okb ]
          runner=$(jq -r '.platforms["${{ matrix.platform }}"].runner' "$payload/payload.json")
          [ "$runner" = 'libexec/okrun/${{ matrix.system }}/okrun${{ matrix.exe }}' ] || { echo "::error::this platform's runner is $runner"; exit 1; }
          # The server's okb, and the engine's once where a platform's engine is the ok image (S4-4-12).
          okbs=$(cd "$payload" && find . -name '*.okb' | sed 's#^\./##' | sort | tr '\n' ' ')
          named=$({ echo bin/mcppls.okb; jq -r '.platforms[].engines.clangd | select(.runner) | .path' "$payload/payload.json" | tr -d '\r'; } | sort -u | tr '\n' ' ')
          echo "okbs: $okbs"
          [ "$okbs" = "$named" ] || { echo "::error::the VSIX carries $okbs; payload.json names $named"; exit 1; }
          want=$("$python" -c "import hashlib, sys; print(hashlib.sha256(open(sys.argv[1], 'rb').read()).hexdigest())" server/mcppls-*.okb)
          got=$("$python" -c "import hashlib, sys; print(hashlib.sha256(open(sys.argv[1], 'rb').read()).hexdigest())" "$payload/bin/mcppls.okb")
          echo "okb $want, VSIX $got"
          [ "$want" = "$got" ] || { echo "::error::the VSIX's okb is not the one okb"; exit 1; }
          chmod +x "$payload/$runner"
          "$payload/$runner" "$payload/bin/mcppls.okb" version | tee version.txt
          grep -q '^mcppls ' version.txt
          # An engine that is the ok image starts through the same runner and states the version the entry names.
          engine=$(jq -r '.platforms["${{ matrix.platform }}"].engines.clangd | select(.runner) | .path' "$payload/payload.json" | tr -d '\r')
          if [ -n "$engine" ]; then
            "$payload/$runner" "$payload/$engine" --version | tee engine.txt
            grep -qF "$(jq -r '.platforms["${{ matrix.platform }}"].engines.clangd.version' "$payload/payload.json" | tr -d '\r')" engine.txt
          fi
      - name: The tree starts the server here, with nothing installed
        run: |
          set -euo pipefail
          python=python3; temp="$RUNNER_TEMP"
          if [ "$RUNNER_OS" = Windows ]; then python=python; temp=$(cygpath -u "$RUNNER_TEMP"); fi
          "$python" -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" server/mcppls-*-openkal.zip "$temp/openkal"
          top=$(ls -d "$temp"/openkal/*/)
          if [ "$RUNNER_OS" = Windows ]; then
            system32="$(cygpath -u "$SYSTEMROOT")/System32"
            # The launcher program, from a directory with nothing on PATH but the system's.
            PATH="$system32" "$top/bin/mcppls.exe" version | tee version.txt
            # The POSIX script hands over to it under Git Bash, where `shell: bash` runs.
            "$top/bin/mcppls" version | tee -a version.txt
          else
            chmod +x "$top/bin/mcppls" "$top"/libexec/okrun/*/okrun
            env -i HOME="$HOME" PATH=/usr/bin:/bin "$top/bin/mcppls" version | tee version.txt
          fi
          grep -q '^mcppls ' version.txt
      - name: The single file of this system runs here
        run: |
          set -euo pipefail
          file=$(ls server/mcppls-*-${{ matrix.system }}${{ matrix.exe }})
          chmod +x "$file"
          "$file" version | tee version.txt
          grep -q '^mcppls ' version.txt
          ls -l "$file"

  # ---------------------------------------------------------------------------
  # The same extension, the same three suites, in a Code-OSS build (0.0.7 plan §7, O-2): VSCodium, at the
  # version in .github/versions.env, downloaded per architecture and cached. What differs from Microsoft's
  # build is what a Code-OSS user meets first (its own CLI name, `codium`; `vscode.env.appName`; the open
  # extension registry), and nothing in vscode-e2e above would notice. MCPPLS_E2E_EDITOR points the harness at
  # the unpacked editor (test/runTest.ts); the main suite checks the diagnostic environment names it.
  code-oss-e2e:
    name: Code-OSS (VSCodium) end to end (${{ matrix.platform }})
    needs: [changes, vsix, kits]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.vscode == 'true' }}
    permissions:
      contents: read
      actions: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64,   os: ubuntu-24.04 }
          - { platform: linux-arm64, os: ubuntu-24.04-arm }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # The arm64 image is not the x64 one: the display server and the libraries the editor's
      # Electron loads are installed rather than assumed (the same list vscode-e2e installs).
      - name: What the editor needs on arm64 Linux
        if: matrix.platform == 'linux-arm64'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb xauth libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 \
              libgtk-3-0t64 libgbm1 libasound2t64 libxss1 libxkbfile1 libsecret-1-0
      - name: The VSCodium version
        run: grep '^VSCODIUM_VERSION=' .github/versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Cache VSCodium
        id: vscodium-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/vscodium
          key: vscodium-${{ matrix.platform }}-${{ env.VSCODIUM_VERSION }}
      # The release publishes a checksum next to each archive; a download that does not match it
      # is not unpacked.
      - name: Download VSCodium
        if: steps.vscodium-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          archive="VSCodium-${{ matrix.platform }}-${VSCODIUM_VERSION}.tar.gz"
          base="https://github.com/VSCodium/vscodium/releases/download/${VSCODIUM_VERSION}"
          mkdir -p "$RUNNER_TEMP/vscodium"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 5 -o "$archive" "$base/$archive"
          curl -fsSL --retry 5 -o "$archive.sha256" "$base/$archive.sha256"
          sha256sum -c "$archive.sha256"
          tar -xzf "$archive" -C vscodium
      - name: Find the editor
        run: |
          set -euo pipefail
          test -x "$RUNNER_TEMP/vscodium/codium"
          test -x "$RUNNER_TEMP/vscodium/bin/codium"
          echo "MCPPLS_E2E_EDITOR=$RUNNER_TEMP/vscodium/codium" >> "$GITHUB_ENV"
          echo "MCPPLS_E2E_EXPECT_APP_NAME=VSCodium" >> "$GITHUB_ENV"
      # The one VSIX, as vscode-e2e takes it, and this platform's target kit installed: the suites test the installed VSIX.
      - uses: actions/download-artifact@v8
        with:
          name: vsix
          path: vsix
      - uses: actions/download-artifact@v8
        with:
          name: kit-${{ matrix.platform }}
          run-id: ${{ needs.changes.outputs.lend || github.run_id }}
          github-token: ${{ github.token }}
          path: kit-archive
      - name: The kit of this platform's target, installed, and the extension's test harness
        run: |
          set -euo pipefail
          archive=$(ls kit-archive/mcppls-kit-*.tar.gz)
          name=$(basename "$archive" .tar.gz); version=${name##*-}; target=${name%-*}; target=${target#mcppls-kit-}
          store="$HOME/.xlings/data/xpkgs/xim-x-mcppls-kit-$target/$version"
          mkdir -p "$store" && tar -xzf "$archive" -C "$store" --strip-components 1 && test -f "$store/kit.json"
          cp vsix/mcppls-*.vsix editors/vscode/mcppls.vsix
          (cd editors/vscode && npm ci --no-audit --no-fund && npm run compile)
      - name: End-to-end tests (VSIX form)
        working-directory: editors/vscode
        env:
          MCPPLS_E2E_VSIX: ${{ github.workspace }}/editors/vscode/mcppls.vsix
        run: xvfb-run -a npm test
      - name: End-to-end tests (conflicts scenario)
        working-directory: editors/vscode
        env:
          MCPPLS_E2E_VSIX: ${{ github.workspace }}/editors/vscode/mcppls.vsix
          MCPPLS_E2E_SCENARIO: conflicts
        run: xvfb-run -a npm test
      - name: End-to-end tests (stress scenario)
        working-directory: editors/vscode
        env:
          MCPPLS_E2E_VSIX: ${{ github.workspace }}/editors/vscode/mcppls.vsix
          MCPPLS_E2E_SCENARIO: stress
        run: xvfb-run -a npm test

  # ---------------------------------------------------------------------------
  # The Neovim plugin (editors/nvim) through Neovim's own LSP client, on each host's payload and on
  # the oldest and newest Neovim it supports: require('mcppls').setup() on every version, and
  # vim.lsp.enable('mcppls') (lsp/mcppls.lua) from 0.11 on. Neovim comes from xlings like every
  # other tool here (`nvim` in xim-pkgindex), each version installed and selected with `xlings use`.
  neovim:
    name: Neovim (${{ matrix.platform }})
    needs: [changes, payload, kits]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.nvim == 'true' }}
    permissions:
      contents: read
      actions: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64,    os: ubuntu-24.04, versions: 0.10.4 0.11.5 0.12.5 }
          - { platform: darwin-arm64, os: macos-15,     versions: 0.10.4 0.12.5 }
          - { platform: win32-x64,    os: windows-2022, versions: 0.10.4 0.12.5 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mcpp
      - uses: ./.github/actions/payload
        with:
          platform: ${{ matrix.platform }}
          run-id: ${{ needs.changes.outputs.lend }}
          kit: 'true'
      - name: Neovim from xlings
        run: |
          set -euo pipefail
          for version in ${{ matrix.versions }}; do
            for attempt in 1 2 3; do
              if xlings install "nvim@$version" -y -g; then break; fi
              [ "$attempt" = 3 ] && { echo "::error::nvim@$version could not be installed"; exit 1; }
              sleep 30
            done
          done
      - name: The plugin on each Neovim
        run: |
          set -euo pipefail
          # The payload's server: its okb, which the plugin starts through the runner the payload names.
          server="$PWD/payload/bin/mcppls.okb"; [ "$RUNNER_OS" = Windows ] && server="$(cygpath -w "$server")"
          failed=''
          for version in ${{ matrix.versions }}; do
            xlings use nvim "$version"
            nvim --version | head -1
            # No `timeout` wrapper: macOS has none, and every wait in smoke.lua is bounded already.
            for mode in setup enable; do
              echo "::group::Neovim $version, $mode"
              if ! MCPPLS_SERVER="$server" nvim --headless --clean -l editors/nvim/tests/smoke.lua "$mode"; then
                failed="$failed $version:$mode"
              fi
              echo "::endgroup::"
            done
          done
          if [ -n "$failed" ]; then echo "::error::failed:$failed"; exit 1; fi

  # ---------------------------------------------------------------------------
  # The Zed extension's choice of server (editors/zed/src/resolve.rs) as a plain Rust test on the
  # runner, and the crate still compiling to the wasm Zed loads. Every pull request: a few seconds.
  zed-unit:
    name: Zed extension (cargo test)
    needs: changes
    if: needs.changes.outputs.zed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests
        run: cargo test --manifest-path editors/zed/Cargo.toml
      - name: The wasm build Zed loads
        run: |
          rustup target add wasm32-wasip2
          cargo build --release --target wasm32-wasip2 --manifest-path editors/zed/Cargo.toml

  # A pull request that changes release packaging gets the same smoke from release-checks.yml, so
  # it is not run twice here. nightly.yml and every release candidate run it on their own.
  zed-smoke:
    name: real Zed
    needs: [changes, payload, kits]
    if: ${{ !cancelled() && !failure() && github.event_name == 'pull_request' && needs.changes.outputs.zed_real == 'true' && needs.changes.outputs.packaging != 'true' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/zed-smoke.yml
    with:
      payload-run: ${{ needs.changes.outputs.lend }}

  # ---------------------------------------------------------------------------
  # The CLion plugin (editors/clion), 0.0.8 part 2 CL-2 and CL-3. Gradle comes from xlings like the
  # rest of the tools here, and the JDK with it. The IDEs Gradle downloads (about 1.9 GB each) are
  # kept in the Gradle cache under a key that carries their versions, so they are fetched once per
  # bump, not once per run.
  #
  # verifyPlugin (the JetBrains Plugin Verifier) runs on every pull request: the plugin against CLion
  # 2026.1, the oldest build it claims, and against the one it is built on.
  clion-verify:
    name: CLion plugin verifier
    needs: changes
    if: needs.changes.outputs.clion == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mcpp
      - name: Gradle from xlings
        run: xlings install gradle -y -g
      - name: Cache the CLion downloads
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/modules-2
          key: gradle-clion-${{ hashFiles('editors/clion/gradle.properties', 'editors/clion/build.gradle.kts') }}
      - name: Verify the plugin
        working-directory: editors/clion
        run: gradle --no-daemon verifyPlugin
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: clion-verifier
          path: editors/clion/build/reports/pluginVerifier
          if-no-files-found: ignore
          retention-days: 7

  # CLion 2026.2.3 itself, headless, with the platform's test framework: the sandbox holds the plugin,
  # carrying the one payload this run built (MCPPLS_PAYLOAD), and the
  # plugin starts that payload's server with nothing on the PATH. The test asserts what a person sees
  # in an mcpp project -- the server Running, a diagnostic, a module-name completion, the process gone
  # when the project closes -- and the one-engine rule: a CMake project stays CLion's, and "mcppls
  # only" lowers a file to Syntax with mcppls's diagnostics kept (editors/clion/src/test). What CLion's
  # own engine answers for the same file is printed in the log.
  clion-e2e:
    name: CLion 2026.2.3 (headless)
    needs: [changes, payload, kits]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.clion == 'true' }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mcpp
      - name: Gradle from xlings
        run: xlings install gradle -y -g
      - uses: ./.github/actions/payload
        with:
          platform: linux-x64
          run-id: ${{ needs.changes.outputs.lend }}
          kit: 'true'
      - name: Cache the CLion downloads
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/modules-2
          key: gradle-clion-${{ hashFiles('editors/clion/gradle.properties', 'editors/clion/build.gradle.kts') }}
      # Issue #71: the project a person has after `mcpp build`, which CLion's Compilation Database must not take.
      - name: Build the mcpp-built fixture with mcpp
        working-directory: editors/clion/src/test/fixtures/mcpp-built
        run: mcpp build
      - name: Tests in CLion
        working-directory: editors/clion
        env:
          MCPPLS_PAYLOAD: ${{ github.workspace }}/payload
          MCPPLS_FIXTURES_BUILT: '1'
        run: |
          set -euo pipefail
          "$MCPPLS_PAYLOAD/libexec/okrun/linux-x86_64/okrun" "$MCPPLS_PAYLOAD/bin/mcppls.okb" version
          gradle --no-daemon test buildPlugin
      - uses: actions/upload-artifact@v7
        with:
          name: mcppls-clion-zip
          path: editors/clion/build/distributions/mcppls-clion-*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: clion-e2e
          path: |
            editors/clion/build/reports/tests
            editors/clion/build/test-results
            editors/clion/build/idea-sandbox/*/log
          if-no-files-found: ignore
          retention-days: 7

  # Test the current adapter and native server while an engine candidate is
  # unqualified, preserving the published 0.0.19 engine/kit bytes. This does not
  # qualify the candidate image or its final payload. The old server remains a
  # recorded negative control for request-lifecycle errors; it is not required
  # to pass a regression that checks the fix for those errors.
  clion-adapter-baseline-package:
    name: CLion current server with the published engine
    needs: [changes, build]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.clion == 'true' }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mcpp
      - name: Gradle from xlings
        run: xlings install gradle -y -g
      - uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/modules-2
          key: gradle-clion-${{ hashFiles('editors/clion/gradle.properties', 'editors/clion/build.gradle.kts') }}
      - name: The unchanged public payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p baseline-plugin
          gh release download v0.0.19 --repo Sunrisepeak/mcpp-language-server \
            --pattern 'mcppls-clion-0.0.19-linux-x64.zip' --dir baseline-plugin
          unzip -q baseline-plugin/mcppls-clion-0.0.19-linux-x64.zip -d baseline-plugin/unpacked
          jq -e '.server.version == "0.0.19"' baseline-plugin/unpacked/mcppls-clion/payload/payload.json
      - uses: actions/download-artifact@v8
        with:
          name: native-server-linux-x64
          run-id: ${{ needs.changes.outputs.lend || github.run_id }}
          github-token: ${{ github.token }}
          path: native-server
      - name: Replace only the published server with the current native build
        run: |
          set -euo pipefail
          (cd native-server && sha256sum --check SHA256SUMS)
          chmod +x native-server/mcppls
          native-server/mcppls version
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, shutil, subprocess, tomllib
          payload = pathlib.Path('baseline-plugin/unpacked/mcppls-clion/payload')
          manifest_path = payload / 'payload.json'
          manifest = json.loads(manifest_path.read_text())
          assert manifest['payload-version'] == 4 and manifest['platform'] == 'linux-x64'
          assert manifest['server']['version'] == '0.0.19'
          version = tomllib.loads(pathlib.Path('mcpp.toml').read_text())['package']['version']
          source = pathlib.Path('native-server/mcppls')
          assert subprocess.check_output([str(source.resolve()), 'version'], text=True).split()[:2] == ['mcppls', version]
          frozen = {str(p.relative_to(payload)): hashlib.sha256(p.read_bytes()).hexdigest()
                    for root in ('clangd', 'kit') for p in (payload / root).rglob('*') if p.is_file()}
          assert frozen and 'clangd/bin/clangd' in frozen and 'kit/kit.json' in frozen
          destination = payload / 'bin/mcppls'
          shutil.copy2(source, destination)
          manifest['server'] = {'path': 'bin/mcppls', 'version': version}
          manifest['build'] = {'source': 'from-source', 'commit': os.environ['GITHUB_SHA'], 'dirty': False}
          manifest['regression'] = {'frozen-engine-release': 'v0.0.19', 'candidate-qualified': False}
          manifest['files']['bin/mcppls'] = {'sha256': hashlib.sha256(destination.read_bytes()).hexdigest(),
                                            'size': destination.stat().st_size}
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')
          assert all(hashlib.sha256((payload / path).read_bytes()).hexdigest() == sha for path, sha in frozen.items())
          print('current native server:', version, '; preserved engine/kit members:', len(frozen))
          PYTHON
      - name: Package this adapter once with the current server and published engine
        run: |
          gradle --no-daemon --max-workers=4 -p editors/clion buildPlugin \
            -Pmcppls.payload="$PWD/baseline-plugin/unpacked/mcppls-clion/payload"
      - uses: actions/upload-artifact@v7
        with:
          name: mcppls-clion-current-server-zip
          path: editors/clion/build/distributions/mcppls-clion-*.zip
          if-no-files-found: error

  clion-stable-adapter:
    name: CLion stable current-server regression (public engine)
    needs: clion-adapter-baseline-package
    uses: ./.github/workflows/clion-stable.yml
    with:
      plugin_artifact: mcppls-clion-current-server-zip
      report_name: clion-stable-current-server

  # Both stable IDEs install the same candidate ZIP. This independent build has
  # no dependency on the plugin's source output or a per-IDE recompilation.
  clion-stable:
    needs: clion-e2e
    uses: ./.github/workflows/clion-stable.yml
    with:
      plugin_artifact: mcppls-clion-zip

  # ---------------------------------------------------------------------------
  # The measurements (tests/bench/README.md): the cases of mcppls-bench this platform runs (`on:<platform>`), the
  # release's own (`release`) and the user-experience scenarios (`ux`, the job below) left out: a session's start, cold and warm on one cache, with its first navigation
  # bounded; the review fixtures, each rule's precision and recall bounded; on Linux the semantic tokens of a large
  # file, whose checks are the design's criteria, and the agent task benchmark's data (each task's baseline fails a
  # check and its reference passes them, with mcpp and GCC 16 and no agent). The store takes main's last one, so
  # each metric is shown beside its history and its bounds (`mtest analyze trend`).
  bench:
    name: bench (${{ matrix.platform }})
    needs: [payload, kits]
    permissions:
      contents: read
      actions: read   # the store main's last run kept, each metric's history
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64,    os: ubuntu-24.04 }
          - { platform: darwin-arm64, os: macos-15 }
          - { platform: win32-x64,    os: windows-2022 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mcpp
      - name: GCC 16 (two of the ten tasks, and the review fixture toolchain-divergence, build with it)
        if: runner.os == 'Linux'
        run: mcpp toolchain install gcc 16.1.0
      - uses: ./.github/actions/payload
        with:
          platform: ${{ matrix.platform }}
          kit: 'true'
      - uses: ./.github/actions/mtest
      - name: The store of main's last run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status success --limit 1 \
                  --json databaseId -q '.[0].databaseId' 2>/dev/null || true)
          [ -n "$run" ] || { echo "no successful run of main: no history"; exit 0; }
          rm -rf "$RUNNER_TEMP/bench-store"
          if ! gh run download "$run" -R "$GITHUB_REPOSITORY" -n "bench-mtest-${{ matrix.platform }}" -D "$RUNNER_TEMP/bench-store" 2>/dev/null; then
            echo "main's run $run kept no store for ${{ matrix.platform }}: no history"; exit 0
          fi
          "$MTEST" store import --from "$RUNNER_TEMP/bench-store"
      - name: The measurements
        run: |
          set -euo pipefail
          exe=''; [ "$RUNNER_OS" != Windows ] || exe='.exe'
          export MCPPLS_CTS_MEASURES="$RUNNER_TEMP/bench-measures"
          status=0
          "$MTEST" run --junit "$RUNNER_TEMP/bench.xml" --tag "on:${{ matrix.platform }}" --exclude-tag release --exclude-tag ux \
              "stage/mcppls-bench$exe" || status=$?
          "$MTEST" analyze trend --runs 10 | tee -a "$GITHUB_STEP_SUMMARY" || true
          if [ "$status" != 0 ]; then
            "$MTEST" explain || true
            for out in .mtest/runs/*/diagnoses/*/out.txt; do
              [ -f "$out" ] || continue
              echo "::group::diagnosis $(dirname "$out")"; tail -200 "$out"; echo "::endgroup::"
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-mtest-${{ matrix.platform }}
          path: .mtest
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-results-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/bench.xml
            ${{ runner.temp }}/bench-measures/*.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # A pull request that changes release packaging (the `packaging` of `changes`) gets the release checks
  # after the CI it runs anyway: the plugins packaged, installed and removed, performance, stability, the
  # staged candidate.
  release-checks:
    name: release checks
    needs: [changes, specifications, build, test, openkal-test, server, kits, payload, vsix, conformance, clean-machine, vscode-e2e, distribution, neovim, bench]
    if: needs.changes.outputs.packaging == 'true'
    uses: ./.github/workflows/release-checks.yml

  # ---------------------------------------------------------------------------
  # Main lends what it built: a marker named after the server's inputs, which a pull request that changes
  # only a plugin finds (`changes`), and whose run's payload, stage and kits it then tests over.
  server-digest:
    name: lend the payload of these server inputs
    needs: [changes, build, kits, payload]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo '${{ needs.changes.outputs.digest }}' > "$RUNNER_TEMP/digest.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: server-digest-${{ needs.changes.outputs.digest }}
          path: ${{ runner.temp }}/digest.txt
          retention-days: 7

  # THE ONE CHECK A BRANCH REQUIRES. The jobs a change does not reach are skipped, so no job of them can be
  # required; this one is, and it fails when any job that ran failed or was cancelled.
  ci:
    name: ci
    if: always()
    needs: [changes, invariants, specifications, engine-candidate-parts, mcpp, build, test, openkal-test, unit-test-report, host-platform,
            server, kits, payload, vsix, conformance, proot, ux, clean-machine, vscode-e2e, distribution, code-oss-e2e,
            neovim, zed-unit, zed-smoke, clion-verify, clion-e2e, clion-adapter-baseline-package, clion-stable-adapter,
            clion-stable, bench, release-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            echo "::error::a job this change reaches failed or was cancelled"; exit 1
          fi
