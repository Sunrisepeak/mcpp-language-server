name: CLion stable runtime

on:
  workflow_call:
    inputs:
      plugin_artifact:
        type: string
        default: ''
      expected_server_version:
        type: string
        default: ''
      report_name:
        type: string
        default: clion-stable-candidate
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published plugin to test without rebuilding the server or engine
        type: string
        default: v0.0.19

env:
  XLINGS_NON_INTERACTIVE: '1'

permissions:
  contents: read

jobs:
  runtime:
    name: packaged plugin on CLion ${{ matrix.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        version: ['2026.1.5.2', '2026.2.4.1']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mcpp
      - name: Gradle and a virtual display
        run: |
          xlings install gradle -y -g
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
      - uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/modules-2
          key: clion-stable-runtime-${{ hashFiles('editors/clion/integration-tests/*.gradle.kts') }}
      - name: The candidate ZIP packaged once by CI
        if: inputs.plugin_artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.plugin_artifact }}
          path: stable-plugin
      - name: A published ZIP for an independent compatibility check
        if: inputs.plugin_artifact == ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'v0.0.19' }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p stable-plugin
          version="${RELEASE_TAG#v}"
          # 0.0.19 used platform ZIPs; later releases carry one universal payload.
          if ! gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "mcppls-clion-$version.zip" --dir stable-plugin; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "mcppls-clion-$version-linux-x64.zip" --dir stable-plugin
          fi
      - name: Run the actual packaged language features in the IDE
        env:
          IDE_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          mapfile -t plugins < <(find stable-plugin -maxdepth 1 -name 'mcppls-clion-*.zip' -print)
          test "${#plugins[@]}" -eq 1
          expected="${{ inputs.expected_server_version }}"
          if [ -z "$expected" ]; then
            if [ -n "${{ inputs.plugin_artifact }}" ]; then
              # The zip carries the server this repository builds, which a server patch
              # (docs/92-release.md "Versions") moves past the plugin's own version.
              expected="$(sed -n 's/^version *= *"\(.*\)"/\1/p' mcpp.toml)"
            else
              expected="${{ inputs.release_tag || 'v0.0.19' }}"; expected="${expected#v}"
            fi
          fi
          home="$RUNNER_TEMP/clion-stable-home"
          mkdir -p "$home"
          xvfb-run -a gradle --no-daemon --max-workers=4 \
            -p editors/clion/integration-tests test \
            -PpluginZip="$GITHUB_WORKSPACE/${plugins[0]}" \
            -PideVersion="$IDE_VERSION" \
            -PexpectedServerVersion="$expected" \
            -PtestHome="$home" \
            -Poutput="$RUNNER_TEMP/clion-stable-result"
      # Public versions, ZIP identity and assertion outcomes only. No raw IDE
      # logs, private user paths or arbitrary project contents are uploaded.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.report_name || 'clion-stable-release' }}-${{ matrix.version }}
          path: ${{ runner.temp }}/clion-stable-result/result.json
          if-no-files-found: warn
