name: Release

# One button. `workflow_dispatch` with a version runs the pre-release test (prerelease.yml: all of
# CI, the Zed and CLion plugins, installing them, performance and stability), and publishes the
# release candidate it staged and checked, as a GitHub release with the tag it created. A pushed
# tag does the same thing for people who prefer tagging first; `v*-rc*` tags run only the
# pre-release test.
#
# WHAT A RELEASE IS (docs/92-release.md "Versions"). A version is X.Y.Z: X.Y the series of the
# server and every plugin, Z each component's own patch. `component: all` releases the series,
# every component at X.Y.0, tagged `vX.Y.0`; a component releases its patch alone, tagged
# `<component>-vX.Y.Z` (`server-`, `vscode-`, `clion-`, `zed-`, `claude-code-`), carrying only its
# own files. Every release is tested as a whole: the candidate is always the whole product.
#
# The release is a draft unless asked otherwise, because it is verified before anyone gets it: the
# maintainer tries the draft's `mcppls-<platform>.vsix` files locally, then publishes the draft.
# Publishing it sends the same files to Open VSX and JetBrains through their
# `release: published` workflows. A release created already published calls both itself,
# since GITHUB_TOKEN does not trigger another workflow.
#
# What it deliberately does NOT do: upload to the VS Code Marketplace, which the maintainer does by
# hand after the same local verification, or publish to the xlings index. See docs/92-release.md.
# Everything a user needs is a file on the release page.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release: the series X.Y.0 for `all`, else the component''s X.Y.Z'
        required: true
      component:
        description: 'What is released: the series (all), or one component''s patch'
        type: choice
        default: all
        options: [all, server, vscode, clion, zed, claude-code]
      draft:
        description: 'Publish as a draft (uncheck to publish immediately)'
        type: boolean
        default: true
      prerelease:
        description: 'Mark as a pre-release'
        type: boolean
        default: true
  push:
    tags: ['v*', '!v*-rc*', 'server-v*', 'vscode-v*', 'clion-v*', 'zed-v*', 'claude-code-v*']

permissions:
  contents: write

env:
  XLINGS_NON_INTERACTIVE: '1'
  PAYLOAD_CACHE: ${{ github.workspace }}/.payload-cache

jobs:
  # The version the rest of the run uses, from whichever trigger fired. Resolved once so no later
  # step has to repeat the `inputs.version || ref_name` dance and get it subtly different.
  what:
    name: what is being released
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.pick.outputs.version }}
      tag: ${{ steps.pick.outputs.tag }}
      component: ${{ steps.pick.outputs.component }}
      heading: ${{ steps.pick.outputs.heading }}
    steps:
      - uses: actions/checkout@v7
      - id: pick
        run: |
          set -euo pipefail
          if [ -n '${{ github.event.inputs.version }}' ]; then
            version='${{ github.event.inputs.version }}'
            component='${{ github.event.inputs.component }}'
          else
            ref='${{ github.ref_name }}'
            case "$ref" in
              v*) component=all; version="${ref#v}" ;;
              *-v*) component="${ref%%-v*}"; version="${ref#*-v}" ;;
            esac
          fi
          if [ "$component" = all ]; then
            tag="v$version"; heading="[$version]"
            case "$version" in *.0) ;; *) echo "::error::a series release is X.Y.0; $version is a component's patch (choose its component)"; exit 1 ;; esac
          else
            tag="$component-v$version"; heading="[$component $version]"
          fi
          { echo "version=$version"; echo "component=$component"; echo "tag=$tag"; echo "heading=$heading"; } >> "$GITHUB_OUTPUT"
          echo "releasing $tag"
      # The version in the manifests is the one being released. Checked before anything is built,
      # because a mismatch found after the matrix has run has cost an hour to learn one line.
      - uses: ./.github/actions/setup-mcpp
      - name: Every version site agrees with it
        run: |
          set -euo pipefail
          mcpp build -p devtools
          devtools=$(find target -type f -name mcppls-devtools -path '*/bin/*' | head -1)
          "$devtools" version --check
          component='${{ steps.pick.outputs.component }}'
          version='${{ steps.pick.outputs.version }}'
          if [ "$component" = all ]; then
            # Every component at the series' X.Y.0.
            "$devtools" version --print --component all | while IFS== read -r name declared; do
              [ "$declared" = "$version" ] || {
                echo "::error::$name is $declared, but a series release has every component at $version."
                echo "::error::Run: mcpp run -p devtools -- version --series ${version%.0}"
                exit 1
              }
            done
          else
            declared=$("$devtools" version --print --component "$component")
            [ "$declared" = "$version" ] || {
              echo "::error::$component is $declared but the release asks for $version."
              echo "::error::Run: mcpp run -p devtools -- version --bump $component"
              exit 1
            }
          fi
          echo "manifests agree: releasing ${{ steps.pick.outputs.tag }}"
      # A release ships the engine the lock names, released and pinned; a candidate never does.
      - name: No candidate engine
        run: |
          [ ! -f packaging/engine-candidate.json ] || {
            echo "::error::packaging/engine-candidate.json names an unreleased engine. Release the engine, switch packaging/payload.lock.json to it and remove the file."
            exit 1
          }
      # CHANGELOG.md says a release's notes are its section, so the section has to exist before an
      # hour of pre-release testing, not be found missing after it.
      - name: CHANGELOG.md has this version's section
        run: |
          set -euo pipefail
          heading='## ${{ steps.pick.outputs.heading }}'
          grep -qF "$heading" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '$heading' section; a release's notes are that section."
            exit 1
          }

  # Exactly what the pre-release test builds and tests, so a release is what was tested, and its
  # staged candidate is what ships.
  prerelease:
    needs: what
    # ci.yml's jobs read the stores and payloads other runs kept (`actions: read`); a called workflow is
    # given no more than its caller's job, and this file's default is `contents: write` alone.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/prerelease.yml

  publish:
    name: publish ${{ needs.what.outputs.tag }}
    needs: [what, prerelease]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: candidate
      - uses: actions/download-artifact@v8
        with:
          name: stage-linux-x64
          path: stage-artifact
      # The candidate was checked against the manifest for the versions the sites declare, and `what`
      # checked that this is the version being released. A component's release is the candidate's files
      # of that component, with MANIFEST.md and SHA256SUMS of its own.
      - name: The files of this release
        run: |
          set -euo pipefail
          (cd candidate && sha256sum -c SHA256SUMS)
          if [ '${{ needs.what.outputs.component }}' = all ]; then
            mv candidate release
          else
            tar -xzf "$(find stage-artifact -name 'stage-linux-x64.tar.gz' | head -1)" stage/mcppls-devtools
            ./stage/mcppls-devtools release check --version '${{ needs.what.outputs.version }}' \
              --component '${{ needs.what.outputs.component }}' --from candidate --dir release --render
            (cd release && sha256sum * > SHA256SUMS)
            ./stage/mcppls-devtools release check --version '${{ needs.what.outputs.version }}' \
              --component '${{ needs.what.outputs.component }}' --dir release
          fi
          ls -l release
          ls release | grep -q -- '-${{ needs.what.outputs.version }}\.' || {
            echo "::error::the release carries no file of version ${{ needs.what.outputs.version }}"; exit 1; }
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ needs.what.outputs.tag }}'
          version='${{ needs.what.outputs.version }}'
          # The notes are what CHANGELOG.md promises (its section for this version, under "What
          # changed"), then the manifest under "Files": every file, what it is, how to install it.
          # The manifest's own table has no heading, and without one it reads as part of the
          # CHANGELOG section's last subsection. Written outside release/, whose every file is an asset.
          notes="$RUNNER_TEMP/notes.md"
          heading='## ${{ needs.what.outputs.heading }}'
          section=$(awk -v heading="$heading" 'index($0, heading) == 1 { on = 1; next } on && /^## \[/ { exit } on { print }' CHANGELOG.md)
          [ -n "$(printf '%s' "$section" | tr -d '[:space:]')" ] || { echo "::error::CHANGELOG.md has no $heading section"; exit 1; }
          { head -n 1 release/MANIFEST.md; printf '\n## What changed\n'; printf '%s\n' "$section"; printf '\n## Files\n'; tail -n +2 release/MANIFEST.md; } > "$notes"
          commit=$(git rev-parse HEAD)
          remote=$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}" | awk '
            /\^\{\}$/ { peeled=$1 } !/\^\{\}$/ { direct=$1 }
            END { print peeled ? peeled : direct }')
          if [ -n "$remote" ]; then
            [ "$remote" = "$commit" ] || { echo "::error::existing tag $tag names another commit"; exit 1; }
          else
            git tag "$tag" "$commit"
            git push origin "refs/tags/$tag"
          fi
          gh release create "$tag" release/* \
            --title "mcpp-language-server $tag" \
            --notes-file "$notes" \
            ${{ github.event.inputs.draft == 'false' && ' ' || '--draft' }} \
            ${{ github.event.inputs.prerelease == 'false' && ' ' || '--prerelease' }}

  # Only a release created already published: a draft reaches Open VSX when the maintainer publishes
  # it, through publish-openvsx.yml's own `release: published` trigger.
  openvsx:
    needs: [what, publish]
    if: github.event.inputs.draft == 'false' && contains(fromJSON('["all","vscode"]'), needs.what.outputs.component)
    uses: ./.github/workflows/publish-openvsx.yml
    with:
      tag: ${{ needs.what.outputs.tag }}
    secrets: inherit

  jetbrains:
    needs: [what, publish]
    if: github.event.inputs.draft == 'false' && contains(fromJSON('["all","clion"]'), needs.what.outputs.component)
    uses: ./.github/workflows/publish-jetbrains.yml
    with:
      tag: ${{ needs.what.outputs.tag }}
    secrets: inherit
