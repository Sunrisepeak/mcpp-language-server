name: nightly

# What is too slow or too variable for every commit (usable plan W7, W8): the whole CI,
# then three cold and warm starts per host with their medians, the self-hosting fixtures
# with their timings, and the mcpp fixtures with the latest mcpp. The measure files are uploaded.
# The whole CI includes the CLion plugin in a real CLion (ci.yml clion-verify and clion-e2e, which
# run on anything that is not a pull request).
on:
  schedule:
    - cron: '30 18 * * *'
  # A manual run can test what a pull request's CI already built, and only the ux rounds, as many
  # times as asked, beside a released server: a change is measured without being built again
  # (docs/92-release.md, "Measuring a change").
  workflow_dispatch:
    inputs:
      payload-run:
        description: A CI run of this branch whose payloads to test (its run id); empty builds them here
        default: ''
      scope:
        description: 'all: every job; ux: only the ux rounds (and their budgets and comparison)'
        type: choice
        options: [all, ux]
        default: all
      ux-repeat:
        description: How many times each ux round runs its edits stage, each in a new server session
        default: '1'
      ux-baseline:
        description: A release (v0.0.16) whose server runs the same stages beside this one, on the same machine
        default: ''
      engine-run:
        description: 'probe: a mcppls-clangd CI run whose native linux-x64 engine replaces the payload''s (same source, other format)'
        default: ''

permissions:
  contents: read
  actions: read   # another run's payload artifacts (payload-run)

env:
  # The build pins live in .github/versions.env and are exported by .github/actions/setup-mcpp,
  # so a bump lands in one file instead of three. A job may still set one to override it.
  XLINGS_NON_INTERACTIVE: '1'

jobs:
  ci:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.payload-run == '' }}
    uses: ./.github/workflows/ci.yml

  # The Zed extension in a real Zed (editors/zed/tests/smoke.sh), on the payload ci.yml just built.
  # Every night, so a Zed or lavapipe that stops working shows up here before a pull request meets it.
  zed:
    name: real Zed
    needs: ci
    if: ${{ !cancelled() && inputs.scope != 'ux' }}
    uses: ./.github/workflows/zed-smoke.yml
    with:
      payload-run: ${{ inputs.payload-run }}

  timing:
    name: startup timing (${{ matrix.platform }})
    needs: ci
    # Timings and self-hosting need only the payloads: a failure elsewhere in CI does not skip them.
    if: ${{ !cancelled() && inputs.scope != 'ux' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64,    os: ubuntu-24.04 }
          - { platform: darwin-arm64, os: macos-15 }
          - { platform: win32-x64,    os: windows-2022 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/payload
        with:
          platform: ${{ matrix.platform }}
          run-id: ${{ inputs.payload-run }}
          kit: 'true'
      - name: Three cold and warm starts
        run: |
          set -euo pipefail
          exe=''; [ "$RUNNER_OS" = Windows ] && exe='.exe'
          results="$RUNNER_TEMP/timing-results"
          mkdir -p "$results"
          for round in 1 2 3; do
            for start in cold warm; do
              warm=(); [ "$start" = warm ] && warm=(--expect-warm)
              "stage/mcppls-conformance$exe" run --server "payload/bin/mcppls.okb" --payload payload --fixture conformance/fixtures/timing \
                  --workspace-dir "$RUNNER_TEMP/timing-$round/workspace" --cache-dir "$RUNNER_TEMP/timing-$round/cache" --timeout 120 \
                  --measure "$results/$start-$round.json" ${warm[@]+"${warm[@]}"}
            done
          done
          "stage/mcppls-devtools$exe" measure summary "$results" | tee "$results/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-timing-${{ matrix.platform }}
          path: ${{ runner.temp }}/timing-results

  # usable plan 5.2: the mcpp fixtures with the newest mcpp the index has, so that a change on the
  # producer's side shows up here before the pinned MCPP_VERSION moves.
  mcpp-latest:
    name: mcpp fixtures with the latest mcpp (linux-x64)
    needs: ci
    if: ${{ !cancelled() && inputs.scope != 'ux' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MCPP_VERSION: latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mcpp
      - name: GCC 16, which mcpp-gcc builds with
        run: mcpp toolchain install gcc 16.1.0
      - uses: ./.github/actions/payload
        with:
          platform: linux-x64
          run-id: ${{ inputs.payload-run }}
          kit: 'true'
      - name: The mcpp fixtures
        run: |
          set -euo pipefail
          mcpp --version | tee -a "$GITHUB_STEP_SUMMARY"
          failed=''
          for fixture in mcpp-gcc mcpp-llvm mcpp-watch; do
            echo "::group::$fixture"
            if ! stage/mcppls-conformance run --server payload/bin/mcppls.okb --payload payload --fixture "conformance/fixtures/$fixture" --timeout 180; then
              failed="$failed $fixture"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::failed with the latest mcpp:$failed"
            exit 1
          fi

  # The environment issue #32's reporter has, as near as a runner gets: termux (its own userland and
  # its own PRoot, in termux/termux-docker), and inside it a Debian rootfs from proot-distro -- so the
  # server runs under a PRoot that has a guest root file system, its paths translated both ways, which
  # the `proot` job in ci.yml (`proot -r /`) does not have. The payload is the one CI built for
  # linux-arm64; nothing is built here.
  #
  # BEST EFFORT, AND WRITTEN WITHOUT BEING RUN. It needs Docker Hub, termux's package mirrors and
  # proot-distro's rootfs download, and the first run may need its commands adjusted. It does not
  # fail the nightly (continue-on-error); a red step here is a reason to read the log, and a green one
  # is a second opinion beside `proot`, which is the job that gates a change. A real device
  # (Android) is not in CI at all: the reporter tries the release candidate before each release.
  termux:
    name: termux + proot-distro Debian (linux-arm64)
    needs: ci
    if: ${{ !cancelled() && inputs.scope != 'ux' }}
    continue-on-error: true
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/payload
        with:
          platform: linux-arm64
          run-id: ${{ inputs.payload-run }}
      # The container's user is not the runner's: what it reads has to be readable.
      - run: chmod -R a+rX payload stage conformance
      # Runs in the Debian rootfs, as its root, with the checkout bound at /work. The same three
      # checks as the `proot` job, on a server started directly (there is no wrapper: the whole
      # session is already under proot).
      - name: The script that runs in Debian
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/in-debian.sh" <<'EOF'
          set -euo pipefail
          apt-get update -q
          apt-get install -y -q --no-install-recommends jq ca-certificates
          cd /work
          work=/tmp/termux-report
          rm -rf "$work" && mkdir -p "$work" && cp -R conformance/fixtures/inferred "$work/project"
          rm -f "$work/project/scenario.json"
          MCPPLS_CACHE_DIR="$work/cache" payload/libexec/okrun/linux-aarch64/okrun payload/bin/mcppls.okb report --root "$work/project" \
              --settle 20 --payload /work/payload > "$work/report.json" 2> "$work/report.err"
          tail -5 "$work/report.err"
          if grep -q -e 'not supported' -e 'outside every preopened' -e 'no preopened directory is named' "$work/report.json" "$work/report.err"; then
            grep -h -e 'not supported' -e 'outside every preopened' -e 'no preopened directory is named' "$work/report.json" "$work/report.err" | head
            echo "the server could not start a program"; exit 1
          fi
          state=$(jq -r '[.roots[0].engines[] | select(.name == "clangd") | .state][0]' "$work/report.json")
          echo "clangd: $state"
          [ "$state" = ready ]
          for fixture in inferred typing-import; do
            stage/mcppls-conformance run --server /work/payload/bin/mcppls.okb --payload /work/payload \
                --fixture "conformance/fixtures/$fixture" --timeout 300
          done
          EOF
          cat > "$RUNNER_TEMP/in-termux.sh" <<'EOF'
          set -eu
          # Use the official seed instead of pkg's randomly selected mirrors:
          # https://github.com/termux/termux-packages/wiki/Mirrors
          # A stale mirror previously advertised a proot-distro package it no longer served.
          printf '%s\n' 'deb https://packages.termux.dev/apt/termux-main stable main' > "$PREFIX/etc/apt/sources.list"
          apt-get update
          apt-get install -y proot-distro
          proot-distro install debian
          proot-distro login debian --bind /mnt/work:/work --bind /mnt/scripts:/mnt/scripts -- bash -c 'test -r /mnt/scripts/in-debian.sh && exec bash /mnt/scripts/in-debian.sh'
          EOF
          chmod a+r "$RUNNER_TEMP"/in-*.sh
      # /entrypoint.sh is termux-docker's: it prepares the termux environment (the Android-style
      # /system, $PREFIX, the user) and then runs the command it is given.
      - name: proot-distro Debian inside termux-docker
        run: |
          set -euo pipefail
          docker run --rm \
              -v "$PWD:/mnt/work" -v "$RUNNER_TEMP:/mnt/scripts:ro" \
              termux/termux-docker:aarch64 /entrypoint.sh bash /mnt/scripts/in-termux.sh

  # A real mcpp project at a fixed commit: the mcpp repository (usable plan W8).
  self-hosting:
    name: self-hosting (${{ matrix.fixture }}, ${{ matrix.platform }})
    needs: ci
    if: ${{ !cancelled() && inputs.scope != 'ux' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { fixture: self-mcpp,     platform: linux-x64,    os: ubuntu-24.04 }
          # This repository's own conformance: real-project plan RP0/RP3.4's acceptance evidence.
          - { fixture: self-mcppls,   platform: linux-x64,    os: ubuntu-24.04 }
          # xlings, as committed and with its old pinned mcpp: the real-project plan's own incident.
          - { fixture: real-xlings,          platform: linux-x64, os: ubuntu-24.04 }
          - { fixture: real-xlings-old-mcpp, platform: linux-x64, os: ubuntu-24.04 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mcpp
      - name: GCC 16, which the mcpp and xlings repositories build with
        if: matrix.fixture == 'self-mcpp' || startsWith(matrix.fixture, 'real-xlings')
        run: mcpp toolchain install gcc 16.1.0
      # The mcpp repository's .xlings.json asks for the mcpp it is built with, and xlings runs that one
      # inside it, refusing to when it is not installed. A developer sets the repository up with
      # `xlings install`; here the version it names is installed next to MCPP_VERSION, which stays the default.
      - name: The mcpp the mcpp repository asks for
        if: matrix.fixture == 'self-mcpp'
        run: |
          set -euo pipefail
          xlings install mcpp@2026.9.21.1 -y -g
          xlings use mcpp "$MCPP_VERSION"
          mcpp --version
      # xlings pins mcpp 2026.8.8.4, too old to emit a build database; real-xlings-old-mcpp makes the
      # pin take effect, so it has to be installed, beside MCPP_VERSION, which stays the default.
      - name: The old mcpp xlings pins
        if: matrix.fixture == 'real-xlings-old-mcpp'
        run: |
          set -euo pipefail
          xlings install mcpp@2026.8.8.4 -y -g
          xlings use mcpp "$MCPP_VERSION"
          mcpp --version
      - uses: ./.github/actions/payload
        with:
          platform: ${{ matrix.platform }}
          run-id: ${{ inputs.payload-run }}
          kit: 'true'
      - name: The fixture, timed
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/self"
          if ! stage/mcppls-conformance run --server payload/bin/mcppls.okb --payload payload --fixture conformance/fixtures/${{ matrix.fixture }} \
                --timeout 900 --measure "$RUNNER_TEMP/self/${{ matrix.fixture }}.json"; then
            stage/mcppls-conformance run --server payload/bin/mcppls.okb --payload payload --fixture conformance/fixtures/${{ matrix.fixture }} \
                --timeout 300 --verbose 2>&1 | tail -300 || true
            exit 1
          fi
          cat "$RUNNER_TEMP/self/${{ matrix.fixture }}.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-${{ matrix.fixture }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/self

  # The user-experience scenarios of ci.yml's `ux` job (0.0.7 plan 6.4), three times each, so that a budget missed
  # by runner noise shows as one failed round of three and a real regression as three; the `long` stage
  # (U13's ten idle minutes, U12's git checkout twenty commits back and forth) runs in the first round only.
  # A round on two cores, the plan's low tier, is recorded and never fails the workflow: it is here to see
  # how far a two-core machine is from the budgets, not to hold it to them. Measure files are uploaded.
  ux:
    name: ux (${{ matrix.fixture }}, ${{ matrix.round }})
    needs: ci
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    continue-on-error: ${{ matrix.round == 'two-core' }}
    strategy:
      fail-fast: false
      matrix:
        fixture: [ux-mcpp]
        round: ['1']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mcpp
      - name: GCC 16, which the mcpp and xlings repositories build with
        run: mcpp toolchain install gcc 16.1.0
      - name: The mcpp the mcpp repository asks for
        if: matrix.fixture == 'ux-mcpp'
        run: |
          set -euo pipefail
          xlings install mcpp@2026.9.21.1 -y -g
          xlings use mcpp "$MCPP_VERSION"
          mcpp --version
      - uses: ./.github/actions/payload
        with:
          platform: linux-x64
          run-id: ${{ inputs.payload-run }}
          kit: 'true'
      # ux-baseline: the release's own server and stage tools, beside this run's; its own workspace
      # and cache, since the two servers' caches are not each other's.
      - name: The baseline release
        if: inputs.ux-baseline != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/baseline"
          # A release's payload: one for every platform from 0.0.20 (mcppls-payload-<version>.tar.gz), one per platform before.
          gh release download '${{ inputs.ux-baseline }}' --repo '${{ github.repository }}' --pattern 'mcppls-payload-*.tar.gz' --dir "$RUNNER_TEMP/baseline" \
            || gh release download '${{ inputs.ux-baseline }}' --repo '${{ github.repository }}' --pattern payload-linux-x64.tar.gz --dir "$RUNNER_TEMP/baseline"
          tar -xzf "$(ls "$RUNNER_TEMP"/baseline/*payload*.tar.gz | head -1)" -C "$RUNNER_TEMP/baseline"
          # The release's server as its payload.json names it: a program, or an image and this platform's runner.
          baseline="$RUNNER_TEMP/baseline/payload"
          runner=$(jq -r '.platforms["linux-x64"].runner // .server.runner // empty' "$baseline/payload.json")
          ${runner:+"$baseline/$runner"} "$baseline/$(jq -r .server.path "$baseline/payload.json")" --version
      - uses: actions/download-artifact@v8
        if: inputs.engine-run != ''
        with:
          name: clangd-linux-x64-portable
          repository: Sunrisepeak/mcppls-clangd
          run-id: ${{ inputs.engine-run }}
          github-token: ${{ github.token }}
          path: native-engine
      - name: probe -- the native engine of the same source in the payload
        if: inputs.engine-run != ''
        run: |
          set -euo pipefail
          find native-engine -maxdepth 3 | head -20
          for a in native-engine/*.tar.gz; do [ -f "$a" ] && tar -xzf "$a" -C native-engine; done
          part=$(dirname "$(find native-engine -path '*clangd/engine.json' | head -1)")
          cat "$part/engine.json"
          rm -rf payload/clangd/linux-x64 && mkdir -p payload/clangd && cp -a "$part" payload/clangd/linux-x64
          chmod +x payload/clangd/linux-x64/bin/*
          python3 - <<'PY'
          import json, hashlib, os
          p = 'payload/payload.json'; d = json.load(open(p))
          e = json.load(open('payload/clangd/linux-x64/engine.json'))
          rel = 'clangd/linux-x64/bin/clangd'; b = open('payload/' + rel, 'rb').read()
          row = d['platforms']['linux-x64']
          row['engines']['clangd'] = {'path': rel, 'version': e['engine-version'], 'identity': e}
          row.setdefault('files', {})[rel] = {'sha256': hashlib.sha256(b).hexdigest(), 'size': len(b)}
          json.dump(d, open(p, 'w'), indent=2)
          print(json.dumps(row['engines'], indent=1)[:600])
          PY
      - name: Probe -- cold, then warm under perf, then warm under strace
        run: |
          set +e
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq strace linux-tools-common "linux-tools-$(uname -r)" >/dev/null || echo "::warning::perf not installed"
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0 >/dev/null || true
          nproc; cat /proc/loadavg
          out="$RUNNER_TEMP/probe"; work="$RUNNER_TEMP/ux-work"; mkdir -p "$out" "$work"
          stage() {
            stage/mcppls-conformance run --server "payload/$(jq -r .server.path payload/payload.json)" --payload payload \
              --fixture conformance/fixtures/ux-mcpp --workspace-dir "$work/workspace" --cache-dir "$work/cache-a" \
              --stage "$1" --timeout 900 --measure "$out/ux-mcpp-$1-$2.json" "${@:3}" > "$out/stage-$1-$2.txt" 2>&1
            echo "stage $1 $2: exit $?"; grep -E "U2-restarts|U2-bmi|first ready" "$out/stage-$1-$2.txt" | head -4
          }
          engine_pid() {
            # The ok image runs as okrun with clangd.okb in its arguments; the native engine is a process named clangd.
            for p in $(pgrep -f 'clangd.okb' || true); do grep -q okrun "/proc/$p/comm" 2>/dev/null && { echo "$p"; return; }; done
            for p in $(pgrep -f '/bin/clangd( |$)' || true); do echo "$p"; return; done
          }
          stage cold 1
          ( stage warm perf --expect-warm ) & st=$!
          for i in $(seq 1 200); do pid=$(engine_pid); [ -n "$pid" ] && break; sleep 0.1; done
          echo "engine pid=$pid"; ps -eo pid,comm,args | grep -i clangd | grep -v grep | cut -c1-200
          if [ -n "$pid" ]; then
            ( for k in 1 2 3 4 5 6; do sleep 3; cp "/proc/$pid/maps" "$out/maps-perf-$k.txt" 2>/dev/null; done ) &
            sudo perf stat -e task-clock,page-faults,minor-faults,major-faults,context-switches,cpu-migrations -p "$pid" -o "$out/perf-stat.txt" -- sleep 25 &
            sudo perf record -F 499 -g -p "$pid" -o "$out/perf.data" -- sleep 25 2> "$out/perf-record.txt" || true
            wait
            cp "/proc/$pid/maps" "$out/maps-perf-after.txt" 2>/dev/null || true
          fi
          wait $st
          sudo chmod a+r "$out/perf.data" 2>/dev/null || true
          sudo perf script -i "$out/perf.data" -F tid,time,ip,sym,dso 2>/dev/null | gzip > "$out/perf-script.txt.gz" || true
          sudo perf report -i "$out/perf.data" --no-children --sort dso --stdio 2>/dev/null | head -60 > "$out/perf-dso.txt" || true
          sudo perf report -i "$out/perf.data" --no-children --sort dso,sym --stdio -g none 2>/dev/null | head -200 > "$out/perf-sym.txt" || true
          ( stage warm strace --expect-warm ) & st=$!
          for i in $(seq 1 200); do pid=$(engine_pid); [ -n "$pid" ] && break; sleep 0.1; done
          echo "engine pid=$pid"
          [ -n "$pid" ] && sudo timeout 35 strace -f -c -p "$pid" -o "$out/strace-c.txt" || true
          wait $st
          cp -a "$work/cache-a/logs" "$out/logs" 2>/dev/null || true
          head -40 "$out/strace-c.txt" 2>/dev/null; cat "$out/perf-dso.txt" 2>/dev/null | head -40
          sudo chown -R "$(id -u):$(id -g)" "$out"; chmod -R a+r "$out"
          true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe-ux-mcpp
          path: ${{ runner.temp }}/probe
          retention-days: 3

  ux-budgets:
    name: ux budgets (the night's rounds)
    needs: ux
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/payload
        with:
          platform: linux-x64
          run-id: ${{ inputs.payload-run }}
          kit: 'true'
      - uses: actions/download-artifact@v8
        with:
          pattern: nightly-ux-ux-*-[123]
          path: ux-rounds
      - name: Distributions
        run: |
          set -euo pipefail
          stage/mcppls-devtools measure budgets ux-rounds | tee ux-budgets.md
          { echo '### ux budgets over the night'"'"'s rounds'; echo; cat ux-budgets.md; } >> "$GITHUB_STEP_SUMMARY"
      # ux-baseline: each scenario's numbers beside the release's, from the same machines and stages.
      - uses: actions/download-artifact@v8
        if: inputs.ux-baseline != ''
        with:
          pattern: nightly-ux-ux-*-[123]-baseline
          path: ux-baseline
      - name: Beside the baseline
        if: inputs.ux-baseline != ''
        run: |
          set -euo pipefail
          stage/mcppls-devtools measure compare ux-rounds ux-baseline | tee ux-compare.md
          { echo '### ux beside ${{ inputs.ux-baseline }}'; echo; cat ux-compare.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: nightly-ux-budgets
          path: ux-*.md
