name: Publish JetBrains

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published GitHub release tag, e.g. v0.0.20'
        required: true
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      JETBRAINS_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: publish-jetbrains-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the published release version
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          match = re.fullmatch(r'v(\d+\.\d+\.\d+)', os.environ['TAG'])
          assert match, 'Expected a versioned release tag'
          with Path(os.environ['GITHUB_ENV']).open('a') as out:
              out.write('VERSION=' + match[1] + '\n')
          PY
      - name: Download the immutable release ZIP and verify its checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAG" -p "mcppls-clion-$VERSION.zip" -p SHA256SUMS -D published
          (cd published && sha256sum -c --ignore-missing SHA256SUMS)
      - name: Submit the existing release file to JetBrains
        env:
          JETBRAINS_TOKEN: ${{ secrets.JETBRAINS_TOKEN }}
        run: |
          set -euo pipefail
          wanted=$(awk -v name="mcppls-clion-$VERSION.zip" '$2 == name { print $1 }' published/SHA256SUMS)
          python3 .github/scripts/publish-jetbrains.py --archive "published/mcppls-clion-$VERSION.zip" \
            --xml-id io.github.sunrisepeak.mcppls --version "$VERSION" --sha256 "$wanted" \
            --output published/jetbrains-receipt.json
      - uses: actions/upload-artifact@v8
        if: always()
        with:
          name: jetbrains-${{ inputs.tag || github.event.release.tag_name }}-receipt
          path: published/jetbrains-receipt.json
          if-no-files-found: warn
