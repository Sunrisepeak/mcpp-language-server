# TEMPORARY (issue 86) -- not for merging. The branch carries this workflow alone.
#
# The reporter's machine, on a hosted Windows runner: the project they had open (yizhinailong/systop, at the
# commit of their report), built by the mcpp they ran, and the released 0.22.0 payload they ran -- the same
# server, the same clangd image (sha256 47a09679...). Two experiments, each leaving what an analysis needs:
#
#   1. The session, replayed (.github/issue86/drive_lsp.py): the server started as the extension starts it,
#      the files opened, an editor's requests kept up, then the engine restarted until the sandbox's grant
#      table refuses a start. Leaves the server's logs, incidents and bundles, the engine database, clangd's
#      command line, and a dump of each okrun.exe that ends by an exception (Windows Error Reporting).
#   2. clangd --check on src/ui/monitor_view.cppm as a matrix (.github/issue86/check_matrix.py): the
#      reporter's reduction row by row, and the switches that say which part of clangd traps; a run that
#      ends by an exception is repeated under cdb, and symbolize.py names its frames from the image's ELF.
name: issue86-repro

on:
  pull_request:
  workflow_dispatch:
    inputs:
      session_seconds:
        description: 'How long the replayed session keeps up an editor''s requests before the restart loop'
        default: '420'

permissions:
  contents: read

concurrency:
  group: issue86-${{ github.ref }}
  cancel-in-progress: true

env:
  SYSTOP_REPOSITORY: yizhinailong/systop
  SYSTOP_COMMIT: b50613226647f4b6583d683f7a7e87dd6b405d0b
  MCPP_VERSION: 2026.11.10.2
  MCPP_SHA256: e158b07d38f73e26701b48a2cbf1b7eb50749447903672ddb3544b220747128c
  LLVM_VERSION: 23.1.3
  MCPPLS_VERSION: 0.22.0
  PAYLOAD_SHA256: 94269a69f8519c663a95e4b0674961bc42d12fa3fe2d3781cf02d7f5ee4ee6a2
  CLANGD_SHA256: 47a0967956dff5b6071c192fd210ad3a545b237255d2285799ca8bbb551df6d9
  PYTHONUTF8: '1'

jobs:
  repro:
    name: systop on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: The reporter's project
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SYSTOP_REPOSITORY }}
          ref: ${{ env.SYSTOP_COMMIT }}
          path: systop
          persist-credentials: false

      - name: The machine
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'evidence'
          New-Item -ItemType Directory -Force -Path $evidence, (Join-Path $env:RUNNER_TEMP 'dumps'), (Join-Path $env:RUNNER_TEMP 'wer') | Out-Null
          "EVIDENCE=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $machine = [ordered]@{
            os        = (Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber, OSArchitecture)
            processor = (Get-CimInstance Win32_Processor | Select-Object Name, Manufacturer, NumberOfCores, NumberOfLogicalProcessors, Description)
            memoryGB  = [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 1)
            python    = (python --version)
          }
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path $vswhere) { $machine.visualStudio = (& $vswhere -all -products * -format json | ConvertFrom-Json | Select-Object displayName, installationVersion, installationPath) }
          $machine.msvcTools = @(Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022\*\VC\Tools\MSVC' -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName; (Get-ChildItem $_.FullName).Name })
          $machine.windowsSdks = @((Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' -ErrorAction SilentlyContinue).Name)
          $machine | ConvertTo-Json -Depth 6 | Tee-Object -FilePath (Join-Path $evidence 'machine.json')

      - name: The debuggers
        run: |
          $ErrorActionPreference = 'Continue'
          $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          if (!(Test-Path $cdb)) {
            Write-Host 'cdb is not installed; asking Chocolatey for the debugging tools'
            choco install windows-sdk-10-version-2004-windbg -y --no-progress
          }
          if (Test-Path $cdb) {
            "CDB=$cdb" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            & $cdb -version
          } else {
            Write-Host '::warning::no cdb on this runner: a trap is captured by procdump as a dump only'
          }
          $zip = Join-Path $env:RUNNER_TEMP 'procdump.zip'
          try {
            Invoke-WebRequest -Uri 'https://download.sysinternals.com/files/Procdump.zip' -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'procdump') -Force
            "PROCDUMP=$(Join-Path $env:RUNNER_TEMP 'procdump\procdump64.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } catch { Write-Host "::warning::procdump was not downloaded: $_" }
          # A full dump of every okrun.exe that ends by an unhandled exception, the clangd of the replayed session included.
          $wer = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting'
          Set-ItemProperty -Path $wer -Name Disabled -Value 0 -Type DWord -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $wer -Name DontShowUI -Value 1 -Type DWord -ErrorAction SilentlyContinue
          $key = "$wer\LocalDumps\okrun.exe"
          New-Item -Path $key -Force | Out-Null
          Set-ItemProperty -Path $key -Name DumpFolder -Value (Join-Path $env:RUNNER_TEMP 'wer') -Type ExpandString
          Set-ItemProperty -Path $key -Name DumpType -Value 2 -Type DWord
          Set-ItemProperty -Path $key -Name DumpCount -Value 3 -Type DWord
          Get-ItemProperty -Path $key | Format-List DumpFolder, DumpType, DumpCount

      - name: The mcpp the reporter ran
        run: |
          $ErrorActionPreference = 'Stop'
          $archiveName = "mcpp-$env:MCPP_VERSION-windows-x86_64"
          $archivePath = Join-Path $env:RUNNER_TEMP "$archiveName.zip"
          $installRoot = Join-Path $env:RUNNER_TEMP $archiveName
          Invoke-WebRequest -Uri "https://github.com/mcpp-community/mcpp/releases/download/v$env:MCPP_VERSION/$archiveName.zip" -OutFile $archivePath
          if ((Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash -ne $env:MCPP_SHA256) { throw 'The mcpp release archive checksum does not match.' }
          Expand-Archive -LiteralPath $archivePath -DestinationPath $env:RUNNER_TEMP -Force
          $mcppBin = Join-Path $installRoot 'bin'
          "MCPP_HOME=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $mcppBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:MCPP_HOME = $installRoot
          & (Join-Path $mcppBin 'mcpp.exe') --version

      - name: The toolchain, and the project built once
        working-directory: systop
        run: |
          $ErrorActionPreference = 'Continue'
          mcpp toolchain install llvm $env:LLVM_VERSION
          mcpp toolchain default "llvm@$env:LLVM_VERSION"
          mcpp build 2>&1 | Tee-Object -FilePath (Join-Path $env:EVIDENCE 'mcpp-build.log')
          Write-Host "mcpp build ended $LASTEXITCODE"
          "mcpp build ended $LASTEXITCODE" | Out-File -FilePath (Join-Path $env:EVIDENCE 'mcpp-build.exit') -Encoding utf8
          exit 0

      - name: The released payload
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP "mcppls-payload-$env:MCPPLS_VERSION.tar.gz"
          Invoke-WebRequest -Uri "https://github.com/Sunrisepeak/mcpp-language-server/releases/download/v$env:MCPPLS_VERSION/mcppls-payload-$env:MCPPLS_VERSION.tar.gz" -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $env:PAYLOAD_SHA256) { throw 'The payload archive checksum does not match.' }
          tar -xzf $archive -C $env:RUNNER_TEMP
          $payload = Join-Path $env:RUNNER_TEMP 'payload'
          $image = Join-Path $payload 'clangd\openkal\bin\clangd.okb'
          if ((Get-FileHash -LiteralPath $image -Algorithm SHA256).Hash -ne $env:CLANGD_SHA256) { throw 'clangd.okb is not the image of the report.' }
          # The image's ELF of this architecture, whose symbol table names a trap's frames.
          python -c "import sys, zipfile; z = zipfile.ZipFile(sys.argv[1]); print(z.namelist()); z.extract('x86_64/clangd.oke', sys.argv[2]); open(sys.argv[2] + '/okb.json', 'wb').write(z.read('okb.json'))" $image (Join-Path $env:RUNNER_TEMP 'oke')
          Copy-Item (Join-Path $env:RUNNER_TEMP 'oke\okb.json') (Join-Path $env:EVIDENCE 'clangd-okb.json')
          Copy-Item (Join-Path $payload 'payload.json') (Join-Path $env:EVIDENCE 'payload.json')
          "PAYLOAD=$payload" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OKRUN=$(Join-Path $payload 'libexec\okrun\windows-x86_64\okrun.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CLANGD_ELF=$(Join-Path $env:RUNNER_TEMP 'oke\x86_64\clangd.oke')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MCPPLS_CACHE=$(Join-Path $env:RUNNER_TEMP 'mcppls-cache')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 1 - the session, replayed
        timeout-minutes: 30
        continue-on-error: true
        run: |
          $seconds = if ('${{ inputs.session_seconds }}') { '${{ inputs.session_seconds }}' } else { '420' }
          python .github/issue86/drive_lsp.py `
            --okrun $env:OKRUN --server (Join-Path $env:PAYLOAD 'bin\mcppls.okb') --payload $env:PAYLOAD `
            --root (Join-Path $env:GITHUB_WORKSPACE 'systop') --cache $env:MCPPLS_CACHE --out (Join-Path $env:EVIDENCE 'session') `
            --open src/ui/monitor_view.cppm src/main.cpp src/core/refresh_clock.cppm src/core/sampler.cppm src/systop.cppm `
            --duration $seconds --stop-after-exits 7 --restarts 22 --restart-wait 25
          if (Test-Path (Join-Path $env:EVIDENCE 'session\lsp-summary.md')) { Get-Content (Join-Path $env:EVIDENCE 'session\lsp-summary.md') | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append }

      - name: 2 - clangd --check, the matrix
        timeout-minutes: 40
        continue-on-error: true
        run: |
          $database = Get-ChildItem -Path (Join-Path $env:MCPPLS_CACHE 'workspaces') -Recurse -Filter compile_commands.json -ErrorAction SilentlyContinue |
            Where-Object { $_.DirectoryName -match '\\contexts\\[^\\]+\\cdb$' } | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$database) { Write-Host '::error::the replayed session left no engine database'; exit 1 }
          Write-Host "engine database: $($database.DirectoryName)"
          python .github/issue86/check_matrix.py `
            --okrun $env:OKRUN --image (Join-Path $env:PAYLOAD 'clangd\openkal\bin\clangd.okb') --elf $env:CLANGD_ELF `
            --project (Join-Path $env:GITHUB_WORKSPACE 'systop') --database $database.DirectoryName `
            --session (Join-Path $env:EVIDENCE 'session\lsp-summary.json') `
            --cdb "$env:CDB" --procdump "$env:PROCDUMP" --wer (Join-Path $env:RUNNER_TEMP 'wer') --dumps (Join-Path $env:RUNNER_TEMP 'dumps') `
            --out (Join-Path $env:EVIDENCE 'matrix') --timeout 300
          if (Test-Path (Join-Path $env:EVIDENCE 'matrix\matrix.md')) { Get-Content (Join-Path $env:EVIDENCE 'matrix\matrix.md') | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append }

      - name: What the server left
        if: always()
        shell: python
        run: |
          import os, shutil
          cache = os.environ.get("MCPPLS_CACHE", "")
          out = os.path.join(os.environ["EVIDENCE"], "server-cache")
          kept = 0
          for folder, folders, files in os.walk(cache):
              # The module caches and indexes are large and say nothing a log does not.
              folders[:] = [name for name in folders if name not in (".cache", "modules", "index", "clangd-memos", "trash")]
              for name in files:
                  path = os.path.join(folder, name)
                  if os.path.getsize(path) > 8 * 1024 * 1024:
                      continue
                  target = os.path.join(out, os.path.relpath(path, cache))
                  os.makedirs(os.path.dirname(target), exist_ok=True)
                  shutil.copy2(path, target)
                  kept += 1
          print(f"{kept} files of the server's cache kept")
          for name in ("wer", "dumps"):
              folder = os.path.join(os.environ["RUNNER_TEMP"], name)
              for entry in sorted(os.listdir(folder)) if os.path.isdir(folder) else []:
                  print(name, entry, os.path.getsize(os.path.join(folder, entry)))

      - name: The dumps, packed
        if: always()
        run: |
          $files = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'wer'), (Join-Path $env:RUNNER_TEMP 'dumps') -File -ErrorAction SilentlyContinue)
          if ($files.Count -gt 0) {
            7z a -t7z -mx=3 (Join-Path $env:RUNNER_TEMP 'issue86-dumps.7z') ($files | ForEach-Object { $_.FullName }) | Select-Object -Last 4
          } else { Write-Host 'no dumps were written' }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: issue86-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/evidence
          retention-days: 14
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: issue86-dumps-${{ matrix.os }}
          path: ${{ runner.temp }}/issue86-dumps.7z
          retention-days: 7
          compression-level: 0
          if-no-files-found: ignore
