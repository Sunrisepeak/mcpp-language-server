name: Release checks

# What a release adds to CI, run after CI in the same workflow run and on its artifacts (the
# payload, the VSIX, the server and the kits). Called from two places:
#
#   prerelease.yml   after its own run of ci.yml: release candidate tags, weekly, and Release
#   ci.yml           on a pull request that changes release packaging, after CI's own jobs, so such
#                    a pull request is checked the way a release is without running CI twice
#
#   (The CLion plugin inside a real CLion, clion-verify and clion-e2e, is in ci.yml: both callers run
#   all of it first, so the release checks have those results too.)
#
#   plugins       the Zed and CLion plugins, packaged exactly as a release ships them: the Zed
#                 extension once, the CLion plugin once with the one payload inside
#   install       each host: the Zed extension and the CLion package installed by devtools, Zed's
#                 server and the one the CLion package carries each answering a project through
#                 this platform's entry, and uninstall leaving nothing behind
#   zed           the Zed extension in a real Zed on Linux, under both the recommended settings and
#                 Zed's defaults (zed-smoke.yml)
#   performance   each host: five cold and five warm starts, medians against a budget; on Linux the
#                 server on this repository itself as well
#   stability     each host: the fixtures of the project shapes that matter most, three rounds in a
#                 row; one failure in any round fails the candidate
#   candidate     every asset staged, checked against packaging/release.manifest.json, checksummed,
#                 and kept as the `release-candidate` artifact — which is what Release publishes

on:
  workflow_call:

env:
  XLINGS_NON_INTERACTIVE: '1'
  PAYLOAD_CACHE: ${{ github.workspace }}/.payload-cache

jobs:
  # The Zed extension is wasm and carries no payload, so one archive serves every machine. The CLion
  # plugin carries its server: one package for every system, holding the one payload this run built
  # (ecosystem design 2026-10-29 §9.3).
  plugins:
    name: zed and clion plugins
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mcpp
      - name: The version being packaged
        id: version
        run: |
          set -euo pipefail
          mcpp build --release -p devtools
          devtools=$(find target -type f -name mcppls-devtools -path '*/bin/*' | head -1)
          "$devtools" version --check
          # Each package is named with its own component's version (docs/92-release.md "Versions").
          { echo "version=$("$devtools" version --print)"
            echo "zed=$("$devtools" version --print --component zed)"
            echo "clion=$("$devtools" version --print --component clion)"; } >> "$GITHUB_OUTPUT"
      # No rust or java action here on purpose. `[xlings.workspace]` declares what packaging needs
      # and `mcpp run` provisions it, so this job is the thing that proves that claim on a machine
      # which has neither.
      #
      # The crate goes in with the compiled extension: extension.toml says `kind = "Rust"`, and
      # Zed's "install dev extension" compiles a Rust extension from its Cargo.toml, so an archive
      # of extension.toml and extension.wasm alone cannot be installed the recommended way.
      - name: Zed extension
        run: |
          set -euo pipefail
          mcpp run --release -p devtools -- extension --editor zed
          tar -czf "mcppls-zed-${{ steps.version.outputs.zed }}.tar.gz" -C editors \
              --transform 's,^zed,mcppls-zed,' \
              zed/extension.toml zed/extension.wasm zed/README.md zed/Cargo.toml zed/Cargo.lock zed/src
          tar -tzf "mcppls-zed-${{ steps.version.outputs.zed }}.tar.gz"
      - uses: ./.github/actions/payload
        with:
          platform: linux-x64
      - name: CLion plugin
        run: |
          set -euo pipefail
          mcpp run --release --features clion -p devtools -- extension --editor clion --payload "$PWD/payload"
          cp target/pack/mcppls-clion-${{ steps.version.outputs.clion }}.zip .
          package=mcppls-clion-${{ steps.version.outputs.clion }}.zip
          echo "$package: $(unzip -l "$package" | tail -1)"
          unzip -p "$package" mcppls-clion/payload/payload.json | jq -e '.platforms | has("linux-x64") and has("linux-arm64") and has("darwin-arm64") and has("win32-x64")' 
      - uses: actions/upload-artifact@v7
        with:
          name: editor-plugins
          path: |
            mcppls-zed-*.tar.gz
            mcppls-clion-*.zip
          if-no-files-found: error
          retention-days: 7

  install:
    name: install and remove (${{ matrix.platform }})
    needs: plugins
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64,    os: ubuntu-24.04,     exe: '' }
          - { platform: linux-arm64,  os: ubuntu-24.04-arm, exe: '' }
          - { platform: darwin-arm64, os: macos-15,         exe: '' }
          - { platform: win32-x64,    os: windows-2022,     exe: '.exe' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/payload
        with:
          platform: ${{ matrix.platform }}
          kit: 'true'
      - uses: actions/download-artifact@v8
        with:
          name: editor-plugins
      - name: Install both plugins from the release archives, then remove them
        run: |
          set -euo pipefail
          # D5 (mcpp design 2026-10-30 part 2 §10): a user directory with a space and a name that is
          # not ASCII, which is where a person's editor installs the payload.
          t="$RUNNER_TEMP/editors with spaces/编辑器"; rm -rf "$RUNNER_TEMP/editors with spaces"; mkdir -p "$t/clion/CLion2026.2"
          # From inside the directory: GNU tar reads `D:` in a Windows `-C D:\...` as a remote host.
          archive="$PWD/$(ls mcppls-zed-*.tar.gz)"
          (cd "$t" && tar -xzf "$archive")
          dev="stage/mcppls-devtools${{ matrix.exe }}"
          where=(--server-dir "$t/server" --zed-dir "$t/zed" --clion-dir "$t/clion/CLion2026.2")

          "$dev" extension --editor zed --install --link --plugin "$t/mcppls-zed" --payload payload "${where[@]}"
          test -f "$t/zed/extensions/installed/mcppls/extension.wasm"
          "$dev" extension --editor clion --install --plugin "$(ls mcppls-clion-*.zip)" "${where[@]}"
          plugin="$t/clion/CLion2026.2/mcppls-clion"
          ls "$plugin"/lib/mcppls-clion-*.jar
          jq -e '.platforms | has("${{ matrix.platform }}")' "$plugin/payload/payload.json"

          # The server Zed falls back to, and the one the CLion package carries, each answer a project through this platform's entry.
          for server in "$t/server" "$plugin/payload"; do
            "$server/$(jq -r '.platforms["${{ matrix.platform }}"].runner' "$server/payload.json")" "$server/bin/mcppls.okb" --version
            "stage/mcppls-conformance${{ matrix.exe }}" run --server "$server/bin/mcppls.okb" --payload "$server" \
                --fixture tests/cts/fixtures/inferred --timeout 180
            # The status a program reads (S3 section 8), from the installed payload.
            "$server/$(jq -r '.platforms["${{ matrix.platform }}"].runner' "$server/payload.json")" "$server/bin/mcppls.okb" \
                status --root tests/cts/fixtures/inferred --format json | jq -e '.schema == 1 and (.capabilities | index("status"))'
          done

          "$dev" uninstall --editor zed "${where[@]}"
          if [ -e "$t/server" ]; then echo "::error::Zed's server outlived Zed: the CLion package carries its own"; exit 1; fi
          "$dev" uninstall --editor clion "${where[@]}"
          for gone in "$t/server" "$t/zed/extensions/installed/mcppls" "$t/clion/CLion2026.2/mcppls-clion"; do
            if [ -e "$gone" ]; then echo "::error::$gone is still there after uninstall"; exit 1; fi
          done
          # The source of a linked install is untouched by removing the link.
          test -f "$t/mcppls-zed/extension.toml"

  # Not the install above: this one starts Zed itself and asks the installed extension for mcppls.
  zed:
    name: real Zed
    uses: ./.github/workflows/zed-smoke.yml

  # The release's measurements (tests/bench/README.md): the cases of mcppls-bench tagged `release` that this platform
  # runs -- five cold and five warm starts, whose medians decide, and on Windows a project the size where module
  # checks cost (thirty module units with <windows.h>, built by MSVC), cold and then warm on one cache.
  performance:
    name: performance (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64,    os: ubuntu-24.04, exe: '' }
          - { platform: darwin-arm64, os: macos-15,     exe: '' }
          - { platform: win32-x64,    os: windows-2022, exe: '.exe' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/payload
        with:
          platform: ${{ matrix.platform }}
          kit: 'true'
      - uses: ./.github/actions/mtest
      - name: The MSVC developer environment, for the large project's own build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Set-Content -Path "$env:RUNNER_TEMP\capture-msvc.cmd" -Value "@call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul`r`n@set"
          cmd /d /c "$env:RUNNER_TEMP\capture-msvc.cmd" | Out-File -Encoding utf8 "$env:RUNNER_TEMP\msvc.env"
      - name: The release's measurements
        run: |
          set -euo pipefail
          export MCPPLS_CTS_MEASURES="$RUNNER_TEMP/timing"
          [ "$RUNNER_OS" != Windows ] || export MCPPLS_CTS_MSVC_ENV="$RUNNER_TEMP/msvc.env"
          status=0
          "$MTEST" run --tag "on:${{ matrix.platform }}&release" "stage/mcppls-bench${{ matrix.exe }}" || status=$?
          "$MTEST" analyze trend --runs 1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          [ "$status" = 0 ] || { "$MTEST" explain || true; exit 1; }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: prerelease-timing-${{ matrix.platform }}
          path: ${{ runner.temp }}/timing
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: prerelease-mtest-${{ matrix.platform }}
          path: .mtest
          include-hidden-files: true
          if-no-files-found: ignore

  # The mcpp repository (at the fixed commit the self-mcpp fixture names) opened in the server: a
  # real mcpp project, the size a fixture is not.
  self-hosting:
    name: performance on a real project (linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mcpp
      - name: GCC 16, which the mcpp repository builds with
        run: mcpp toolchain install gcc 16.1.0
      # The mcpp repository's .xlings.json asks for the mcpp it is built with, and xlings runs that
      # one inside it; it is installed next to MCPP_VERSION, which stays the default.
      - name: The mcpp the mcpp repository asks for
        run: |
          set -euo pipefail
          xlings install mcpp@2026.9.21.1 -y -g
          xlings use mcpp "$MCPP_VERSION"
          mcpp --version
      - uses: ./.github/actions/payload
        with:
          platform: linux-x64
          kit: 'true'
      - name: mcppls on the mcpp repository, timed
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/self"
          if ! stage/mcppls-conformance run --server payload/bin/mcppls.okb --payload payload --fixture tests/cts/fixtures/self-mcpp \
                --timeout 900 --measure "$RUNNER_TEMP/self/self-mcpp.json"; then
            stage/mcppls-conformance run --server payload/bin/mcppls.okb --payload payload --fixture tests/cts/fixtures/self-mcpp \
                --timeout 300 --verbose 2>&1 | tail -300 || true
            exit 1
          fi
          { echo '```json'; cat "$RUNNER_TEMP/self/self-mcpp.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # Real-project plan RP0/RP3.4: this repository's own conformance, at a fixed commit.
      - name: mcppls on its own repository, timed
        run: |
          set -euo pipefail
          if ! stage/mcppls-conformance run --server payload/bin/mcppls.okb --payload payload --fixture tests/cts/fixtures/self-mcppls \
                --timeout 900 --measure "$RUNNER_TEMP/self/self-mcppls.json"; then
            stage/mcppls-conformance run --server payload/bin/mcppls.okb --payload payload --fixture tests/cts/fixtures/self-mcppls \
                --timeout 300 --verbose 2>&1 | tail -300 || true
            exit 1
          fi
          { echo '```json'; cat "$RUNNER_TEMP/self/self-mcppls.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # Real-project plan RP0/RP2.1: xlings with its pinned mcpp 2026.8.8.4, too old to emit a build
      # database -- the incident the plan starts from. It must be described by the newer installed mcpp.
      - name: mcppls on xlings with its old pinned mcpp, timed
        run: |
          set -euo pipefail
          xlings install mcpp@2026.8.8.4 -y -g
          xlings use mcpp "$MCPP_VERSION"
          # The project's own mcpp is the one xlings starts for its pin: an mcpp under review that stands
          # first on PATH (MCPP_SOURCE_REF) would answer for it, and nothing would be negotiated.
          PATH=$(printf '%s' "$PATH" | tr ':' '\n' | grep -vx "$HOME/mcpp-under-review" | paste -sd: -)
          if ! stage/mcppls-conformance run --server payload/bin/mcppls.okb --payload payload --fixture tests/cts/fixtures/real-xlings-old-mcpp \
                --timeout 900 --measure "$RUNNER_TEMP/self/real-xlings-old-mcpp.json"; then
            stage/mcppls-conformance run --server payload/bin/mcppls.okb --payload payload --fixture tests/cts/fixtures/real-xlings-old-mcpp \
                --timeout 300 --verbose 2>&1 | tail -300 || true
            exit 1
          fi
          { echo '```json'; cat "$RUNNER_TEMP/self/real-xlings-old-mcpp.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: prerelease-self-mcpp
          path: ${{ runner.temp }}/self

  # The project shapes users have (all-.cppm, .cppm/.cpp split, watched edits, a broken module, a
  # hung build tool) run three times over with fresh workspaces. CI runs each once; a fixture that
  # passes once and fails on a rerun is exactly what a release should not carry.
  stability:
    name: stability (${{ matrix.platform }}${{ matrix.part && format(', {0}', matrix.part) || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux and Windows split their fixtures in two parts that run side by side, balanced on
          # measured times; each fixture still runs its three rounds in a row on one machine.
          - platform: linux-x64
            part: 1 of 2
            os: ubuntu-24.04
            exe: ''
            fixtures: mcpp-split multi-root mcpp-llvm mcpp-watch inferred module-faults mcpp-target-selection mcpp-target-explicit mcpp-target-project mcpp-target-invalid mcpp-target-windows mcpp-producer-identity mcpp-target-race mcpp-target-live mcpp-target-mismatch mcpp-target-mismatch-cold mcpp-target-build-tool-off mcpp-target-provider-excluded mcpp-target-discovery-off mcpp-target-auto-fallback mcpp-producer-file-identity mcpp-producer-relative-path mcpp-target-selection@polling mcpp-producer-identity@polling mcpp-polling-watch-inputs@polling mcpp-target-fallback-mismatch mcpp-target-fallback-preserve
          - platform: linux-x64
            part: 2 of 2
            os: ubuntu-24.04
            exe: ''
            fixtures: verify-changes mcpp-all-cppm mcpp-watch@polling mcpp-emit-hang mcpp-emit-watch
          - platform: darwin-arm64
            os: macos-15
            exe: ''
            fixtures: inferred module-faults verify-changes multi-root mcpp-llvm mcpp-split mcpp-all-cppm mcpp-watch mcpp-target-selection mcpp-target-explicit mcpp-target-project mcpp-target-invalid mcpp-target-windows mcpp-producer-identity mcpp-target-race mcpp-target-live mcpp-target-mismatch mcpp-target-mismatch-cold mcpp-target-build-tool-off mcpp-target-provider-excluded mcpp-target-discovery-off mcpp-target-auto-fallback mcpp-producer-file-identity mcpp-producer-relative-path mcpp-polling-watch-inputs@polling mcpp-target-fallback-mismatch mcpp-target-fallback-preserve
          - platform: win32-x64
            part: 1 of 2
            os: windows-2022
            exe: '.exe'
            fixtures: mcpp-split inferred module-faults mcpp-watch mcpp-target-selection mcpp-target-explicit mcpp-target-project mcpp-target-invalid mcpp-target-windows mcpp-producer-identity mcpp-target-race mcpp-target-live mcpp-target-mismatch mcpp-target-mismatch-cold mcpp-target-build-tool-off mcpp-target-provider-excluded mcpp-target-discovery-off mcpp-target-auto-fallback mcpp-producer-file-identity mcpp-producer-relative-path mcpp-polling-watch-inputs@polling mcpp-target-fallback-mismatch mcpp-target-fallback-preserve
          - platform: win32-x64
            part: 2 of 2
            os: windows-2022
            exe: '.exe'
            fixtures: verify-changes mcpp-all-cppm multi-root mcpp-emit-hang
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: ./.github/actions/setup-mcpp
      - uses: ./.github/actions/payload
        with:
          platform: ${{ matrix.platform }}
          kit: 'true'
      - name: Three rounds
        run: |
          set -euo pipefail
          failed=''
          evidence="$RUNNER_TEMP/stability-evidence"
          mkdir -p "$evidence"
          for round in 1 2 3; do
            for fixture in ${{ matrix.fixtures }}; do
              extra=()
              case "$fixture" in *@polling) extra=(--no-dynamic-watch) ;; esac
              echo "::group::round $round: $fixture"
              started=$(date +%s)
              key="$round-${fixture//@/-}"
              scratch="$RUNNER_TEMP/stability-scratch/$key"
              if ! python3 .github/scripts/stability_evidence.py --output "$evidence/$key" --scratch "$scratch" -- \
                    "stage/mcppls-conformance${{ matrix.exe }}" run --server "payload/bin/mcppls.okb" --payload payload \
                    ${extra[@]+"${extra[@]}"} --fixture "tests/cts/fixtures/${fixture%@*}" --timeout 180 \
                    --workspace-dir "$scratch/workspace" --cache-dir "$scratch/cache" --keep --measure "$scratch/measure.json"; then
                failed="$failed $round:$fixture"
              fi
              echo "::endgroup::"
              echo "round $round $fixture $(( $(date +%s) - started )) s" | tee -a "$RUNNER_TEMP/stability.txt"
            done
          done
          { echo '| round | fixture | seconds (runner + diagnostics) |'; echo '|---|---|---|'
            awk '{ printf "| %s | %s | %s |\n", $2, $3, $4 }' "$RUNNER_TEMP/stability.txt"; } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$failed" ]; then
            echo "::error::failed (round:fixture):$failed"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stability-evidence-${{ matrix.platform }}-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/stability-evidence
            ${{ runner.temp }}/stability.txt
          if-no-files-found: warn


  # Everything a release would publish, staged and checked. Release takes this artifact as it is.
  candidate:
    name: release candidate
    needs: [plugins, install, zed, performance, self-hosting, stability]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Stage the release
        run: |
          set -euo pipefail
          version='${{ needs.plugins.outputs.version }}'
          mkdir -p release
          # The editors' packages, the payload (`mcppls-payload-<version>.tar.gz`: the payload tree alone, the test tools
          # are the stage artifacts'), the server for the command line and every system (ci.yml's `server`: the tree, the
          # okb, the single files) and the kits (the openkal kit and each platform's target kit).
          cp artifacts/vsix/mcppls-*.vsix release/
          cp artifacts/payload/payload.tar.gz "release/mcppls-payload-$version.tar.gz"
          find artifacts/editor-plugins -type f \( -name 'mcppls-zed-*.tar.gz' -o -name 'mcppls-clion-*.zip' \) -exec cp {} release/ \;
          find artifacts/server -type f -name "mcppls-$version*" -exec cp {} release/ \;
          find artifacts -path '*/kit-*/mcppls-kit-*.tar.gz' -exec cp {} release/ \;
          ls -l release
          tar -tzf "release/mcppls-payload-$version.tar.gz" > "$RUNNER_TEMP/listing"
          if grep -qv '^payload/' "$RUNNER_TEMP/listing"; then echo "::error::the payload archive carries more than the payload tree"; exit 1; fi
      # The devtools the same run built for Linux x86_64 (stage-linux-x64), so this job needs no toolchain.
      - name: The release tool from this run
        run: |
          set -euo pipefail
          tar -xzf "$(find artifacts -name 'stage-linux-x64.tar.gz' | head -1)" stage/mcppls-devtools
          ./stage/mcppls-devtools --help > /dev/null
      # Every required asset present and non-empty, nothing shipped that the manifest does not
      # declare, and MANIFEST.md rendered from the same declaration.
      - name: Check against the release manifest
        run: |
          set -euo pipefail
          version='${{ needs.plugins.outputs.version }}'
          ./stage/mcppls-devtools release check --version "$version" --dir release --render
          (cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          ./stage/mcppls-devtools release check --version "$version" --dir release
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: release
          if-no-files-found: error
          retention-days: 14
