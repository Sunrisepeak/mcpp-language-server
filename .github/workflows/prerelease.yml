name: Pre-release

# A release candidate, built and tested the way a user would get it, without publishing anything:
# every job of ci.yml, then release-checks.yml on the artifacts that run produced (the plugins,
# installing them, performance, stability, and the staged, checked `release-candidate` artifact
# Release publishes).
#
# It runs by itself on a release candidate tag (v<version>-rc<n>) and weekly on main; Release calls
# it before publishing, so nothing is published that did not pass here. A pull request that changes
# release packaging gets the same release checks from ci.yml, after the CI it runs anyway.

on:
  push:
    tags: ['v*-rc*']
  schedule:
    - cron: '0 20 * * 0'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: prerelease-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  checks:
    needs: ci
    uses: ./.github/workflows/release-checks.yml
