name: mtest
description: >
  The mtest engine the cases run with: the release .github/versions.env pins (MTEST_VERSION), an xlings
  package (xim:mtest) that the index verifies; MTEST names its launcher. A job that has no xlings yet gets
  the pinned one first (XLINGS_VERSION).
runs:
  using: composite
  steps:
    - name: xlings, where the job has none
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        command -v xlings > /dev/null 2>&1 && exit 0
        . .github/versions.env
        curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
          https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh \
          | bash -s "$XLINGS_VERSION"
        echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"
    - name: xlings, where the job has none (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if (Get-Command xlings -ErrorAction SilentlyContinue) { exit 0 }
        irm https://d2learn.org/xlings-install.ps1.txt | iex
        "$env:USERPROFILE\.xlings\subos\current\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - shell: bash
      run: |
        set -euo pipefail
        . .github/versions.env
        # The index and the mirrors are reached over the network: an attempt refreshes the index first,
        # as install-mcpp.sh does for mcpp.
        for attempt in 1 2 3 4 5; do
          xlings update > /dev/null 2>&1 || true
          if xlings install "mtest@$MTEST_VERSION" -y -g; then break; fi
          [ "$attempt" = 5 ] && { echo "::error::mtest@$MTEST_VERSION could not be installed"; exit 1; }
          sleep 30
        done
        launcher=$(command -v mtest)
        "$launcher" --version
        "$launcher" --version | grep -qF "$MTEST_VERSION" || { echo "::error::xlings's mtest is not $MTEST_VERSION"; exit 1; }
        echo "MTEST=$launcher" >> "$GITHUB_ENV"
