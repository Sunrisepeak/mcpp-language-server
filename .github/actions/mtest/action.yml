name: mtest
description: >
  The mtest engine the cases run with: the release .github/versions.env pins (MTEST_VERSION), its sha256
  checked (MTEST_SHA256), unpacked under the runner's temporary directory; MTEST names its launcher.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        . .github/versions.env
        archive="mtest-$MTEST_VERSION-openkal-bundle-all.tar.gz"
        # Git Bash's tar reads `D:\...` as a remote host's name: the POSIX spelling on Windows.
        temp="$RUNNER_TEMP"; python=python3
        if [ "$RUNNER_OS" = Windows ]; then temp=$(cygpath -u "$RUNNER_TEMP"); python=python; fi
        # The release's web address, else the API's address of the same asset: the web one answered 504
        # for minutes while the API's answered 200 (2026-11-09).
        if ! curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$temp/$archive" \
               "https://github.com/mcpp-community/mtest/releases/download/v$MTEST_VERSION/$archive"; then
          id=$(curl -fsSL --retry 3 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" \
                 "https://api.github.com/repos/mcpp-community/mtest/releases/tags/v$MTEST_VERSION" \
               | "$python" -c 'import json,sys; print(next(str(a["id"]) for a in json.load(sys.stdin)["assets"] if a["name"] == sys.argv[1]))' "$archive")
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/octet-stream" -o "$temp/$archive" \
               "https://api.github.com/repos/mcpp-community/mtest/releases/assets/$id"
        fi
        actual=$("$python" -c "import hashlib,sys; print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "$temp/$archive")
        [ "$actual" = "$MTEST_SHA256" ] || { echo "::error::$archive: sha256 $actual, versions.env says $MTEST_SHA256"; exit 1; }
        mkdir -p "$temp/mtest" && tar xzf "$temp/$archive" -C "$temp/mtest"
        launcher="$temp/mtest/mtest-$MTEST_VERSION-openkal-bundle-all/bin/mtest"
        [ "$RUNNER_OS" = Windows ] && launcher="$launcher.exe"
        "$launcher" --version
        echo "MTEST=$launcher" >> "$GITHUB_ENV"
