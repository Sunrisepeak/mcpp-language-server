name: Set up mcpp
description: Install xlings, the pinned mcpp and the pinned LLVM toolchain, with the package store cached.
runs:
  using: composite
  steps:
    # One source for the build pins (.github/versions.env). A workflow that set one of them keeps
    # its value, which is how nightly asks for `latest` without editing anything here.
    - name: Version pins
      shell: bash
      run: |
        set -euo pipefail
        while IFS='=' read -r name value; do
          case "$name" in ''|\#*) continue ;; esac
          if [ -z "${!name:-}" ]; then echo "$name=$value" >> "$GITHUB_ENV"; fi
          echo "$name=${!name:-$value}"
        done < .github/versions.env
    - name: Install xlings (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
          https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh \
          | bash -s "$XLINGS_VERSION"
        echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"
    - name: Install xlings (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        irm https://d2learn.org/xlings-install.ps1.txt | iex
        "$env:USERPROFILE\.xlings\subos\current\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    # By system and architecture: the store holds programs (clang++, ld.lld), and an arm64 Linux runner that
    # restored an x86_64 one could not execute its clang++ (server M3 on linux-arm64, run 40552282222).
    - name: Cache the mcpp package store
      uses: actions/cache@v6
      with:
        path: ~/.mcpp/registry/data/xpkgs
        key: mcpp-xpkgs-${{ runner.os }}-${{ runner.arch }}-${{ env.MCPP_VERSION }}-${{ hashFiles('**/mcpp.toml') }}
        restore-keys: mcpp-xpkgs-${{ runner.os }}-${{ runner.arch }}-${{ env.MCPP_VERSION }}-
    - name: Install mcpp and LLVM
      shell: bash
      run: bash .github/scripts/install-mcpp.sh
    # THE MCPP UNDER CROSS-VALIDATION (MCPP_SOURCE_REF): built from that branch with the released
    # mcpp, once per system, architecture and commit, and put first on PATH. The store and the home
    # are the released mcpp's, stated, because a binary outside the home derives one from where it
    # lies.
    - name: The mcpp under review (commit)
      if: env.MCPP_SOURCE_REF != ''
      id: review
      shell: bash
      run: |
        set -euo pipefail
        sha=$(git ls-remote https://github.com/mcpp-community/mcpp.git "refs/heads/$MCPP_SOURCE_REF" | cut -f1)
        [ -n "$sha" ] || { echo "::error::no branch $MCPP_SOURCE_REF in mcpp-community/mcpp"; exit 1; }
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
        echo "dir=$HOME/.mcpp-under-review/$sha" >> "$GITHUB_OUTPUT"
    - name: The mcpp under review (cache)
      if: env.MCPP_SOURCE_REF != ''
      uses: actions/cache@v6
      with:
        path: ${{ steps.review.outputs.dir }}
        key: mcpp-under-review-${{ runner.os }}-${{ runner.arch }}-${{ steps.review.outputs.sha }}
    - name: The mcpp under review (build)
      if: env.MCPP_SOURCE_REF != ''
      shell: bash
      run: |
        set -euo pipefail
        dir='${{ steps.review.outputs.dir }}'
        exe=''; [ "$RUNNER_OS" = Windows ] && exe='.exe'
        if [ ! -x "$dir/bin/mcpp$exe" ]; then
          src="$RUNNER_TEMP/mcpp-src"
          git clone --quiet --depth 1 --branch "$MCPP_SOURCE_REF" https://github.com/mcpp-community/mcpp.git "$src"
          rm -f "$src/.xlings.json"
          # Two compiles at a time on an arm64 runner: four of the engine's largest units at once
          # exceeded its memory (mcpp's own aarch64 job, 2026-10-28).
          if [ "$RUNNER_ARCH" = ARM64 ]; then export MCPP_JOBS=2; fi
          ( cd "$src" && mcpp build --release )
          built=$(find "$src/target" -type f -name "mcpp$exe" -path '*/bin/*' | head -1)
          [ -n "$built" ] || { echo "::error::mcpp did not build from $MCPP_SOURCE_REF"; exit 1; }
          mkdir -p "$dir/bin" && cp "$built" "$dir/bin/"
        fi
        home="$HOME/.mcpp"
        if [ "$RUNNER_OS" = Windows ]; then home=$(cygpath -m "$USERPROFILE/.mcpp"); echo "$(cygpath -w "$dir/bin")" >> "$GITHUB_PATH"
        else echo "$dir/bin" >> "$GITHUB_PATH"; fi
        echo "MCPP_HOME=$home" >> "$GITHUB_ENV"
        "$dir/bin/mcpp$exe" --version
        echo "under review: $MCPP_SOURCE_REF @ ${{ steps.review.outputs.sha }}"
